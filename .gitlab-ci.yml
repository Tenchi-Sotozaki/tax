stages:
  - build

variables:
  JAVA_HOME: "/usr/lib/jvm/java-21-openjdk-amd64"

build_job:
  stage: build
  script:
    # 1. Javaのバージョンが正しく認識されているか確認（ログ出力用）
    - $JAVA_HOME/bin/java -version

    # 2. Gradleラッパー（gradlew）に実行権限を付与
    - chmod +x ./gradlew

    # 3. 指定したJava 21の環境を使ってGradleビルドを実行
    - ./gradlew clean build -Dorg.gradle.java.home=$JAVA_HOME
  
  only:
    - cicd_setting
