spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/accommodation_tax_db
    username: postgres
    password: GEpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: false
  mvc:
    hiddenmethod:
      filter:
        enabled: true
    format:
      date: yyyy-MM-dd
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB


server:
  port: 8080
  address: localhost
  servlet:
    context-path: /accommodation-tax
  tomcat:
    max-part-count: 100
    max-http-form-post-size: 10MB
    max-swallow-size: 10MB

logging:
  level:
    jp.lg.asp: INFO

app:
  jichitai:
    code: '01202'
  hash:
    salt: 'xQ7#mK2$vP9@nL4&wR6!jF8^hD3*bN5'
