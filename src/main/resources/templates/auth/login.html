<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン - 宿泊税LGWAN-ASPシステム</title>
<link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
<link rel="stylesheet" th:href="@{/css/bootstrap-icons-complete.css}">
<link rel="stylesheet" th:href="@{/css/accommodation.css}">
<link rel="stylesheet" th:href="@{/css/accommodation-custom.css}">
</head>
<body
	class="bg-light d-flex align-items-center justify-content-center vh-100">

	<div class="card shadow-sm" style="width: 100%; max-width: 420px;">
		<div class="card-header-login text-white text-center py-4">
			<img src="/accommodation-tax/images/logo-acomo.svg?v=2" alt="AcOmO" class="acomo-logo-login">
			<h6 class="mb-0 fw-bold text-white">宿泊税LGWAN-ASPシステム</h6>
		</div>
		<div class="card-body p-4">
			<!-- Spring Security ログイン失敗エラー -->
			<div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show" role="alert">
				<i class="bi bi-exclamation-triangle-fill me-2"></i>IDまたはパスワードが一致しません
				<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
			</div>

			<!-- Spring Security ログアウト完了メッセージ -->
			<div th:if="${param.logout}" class="alert alert-info alert-dismissible fade show" role="alert">
				<i class="bi bi-check-circle-fill me-2"></i>ログアウトしました
				<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
			</div>

			<!-- セッションタイムアウトメッセージ -->
			<div th:if="${param.expired}" class="alert alert-warning alert-dismissible fade show" role="alert">
				<i class="bi bi-clock-history me-2"></i>セッションがタイムアウトしました。再度ログインしてください。
				<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
			</div>

			<form th:action="@{/login}" method="post">
				<!-- CSRFトークン（CSRF保護が有効な場合のみ） -->
				<input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}"
					th:value="${_csrf.token}" />

				<!-- ID  -->
				<div class="mb-3">
					<label for="staffId" class="form-label fw-medium"> ID <span
						class="text-danger">*</span>
					</label> <input type="text" class="form-control" id="staffId"
						name="username" autocomplete="username" required>
				</div>

				<!-- パスワード -->
				<div class="mb-4">
					<label for="password" class="form-label fw-medium"> パスワード<span
						class="text-danger">*</span>
					</label> <input type="password" class="form-control" id="password"
						name="password" autocomplete="current-password" required>
				</div>

				<!-- ログインボタン -->
				<button type="submit" class="btn btn-primary w-100">
					<i class="bi bi-box-arrow-in-right me-2"></i>ログイン
				</button>
			</form>
		</div>
	</div>

	<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
