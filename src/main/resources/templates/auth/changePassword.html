<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ユーザーパスワード変更</title>
<link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
<link rel="stylesheet" th:href="@{/css/bootstrap-icons-complete.css}">
<link rel="stylesheet" th:href="@{/css/accommodation.css}">
<link rel="stylesheet" th:href="@{/css/accommodation-custom.css}">
</head>
<body
	class="bg-light d-flex align-items-center justify-content-center vh-100">

	<div class="card shadow-sm" style="width: 100%; max-width: 420px;">
		<div class="card-header-login text-white text-center py-4">
			<img src="/accommodation-tax/images/logo-acomo.svg?v=2" alt="AcOmO"
				class="acomo-logo-login">
			<h6 class="mb-0 fw-bold text-white">宿泊税LGWAN-ASPシステム</h6>
		</div>
		<div class="card-body p-4">
			<h3 class="h6 text-center text-muted mb-4">パスワード変更</h3>

			<div class="alert alert-info">
				<i class="bi bi-shield-lock me-2"></i>新しいパスワードを設定してください。
			</div>

			<div th:if="${successMessage}"
				class="alert alert-success alert-dismissible fade show" role="alert">
				<i class="bi bi-check-circle-fill me-2"></i><span
					th:text="${successMessage}"></span>
				<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
			</div>

			<div th:if="${error}"
				class="alert alert-danger alert-dismissible fade show" role="alert">
				<i class="bi bi-exclamation-triangle-fill me-2"></i><span
					th:text="${error}"></span>
				<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
			</div>

			<form th:action="@{/admin/user-password-change}" method="post">
				<input type="hidden" th:if="${_csrf}"
					th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

				<div class="mb-3">
					<label for="adminId" class="form-label fw-medium">ID</label> <input
						type="text" class="form-control form-control-readonly" id="adminId"
						th:value="${adminId}" readonly>
				</div>

				<div class="mb-3">
					<label for="nowPassword" class="form-label fw-medium">
						現在のパスワード <span class="text-danger">*</span>
					</label> <input type="password" class="form-control" id="nowPassword"
						name="nowPassword" autocomplete="current-password" required>
				</div>

				<div class="mb-3">
					<label for="newPassword" class="form-label fw-medium">
						新しいパスワード <span class="text-danger">*</span>
					</label> <input type="password" class="form-control" id="newPassword"
						name="newPassword" autocomplete="new-password" required>
				</div>

				<div class="mb-4">
					<label for="newPasswordConfirm" class="form-label fw-medium">
						新しいパスワード（確認用） <span class="text-danger">*</span>
					</label> <input type="password" class="form-control"
						id="newPasswordConfirm" name="newPasswordConfirm"
						autocomplete="new-password" required>
				</div>

				<div class="d-flex gap-2">
					<button type="button" class="btn btn-outline-secondary w-50"
						data-bs-toggle="modal" data-bs-target="#backConfirmModal">
						<i class="bi bi-arrow-left me-1"></i>戻る
					</button>
					<button type="submit" class="btn btn-primary w-50">
						<i class="bi bi-save me-2"></i>設定する
					</button>
				</div>
			</form>
		</div>
	</div>

	<!-- 戻る確認モーダル -->
	<div th:replace="~{layout/components :: linkConfirmModal('backConfirmModal', '確認', 'パスワードを変更せずに戻ります。よろしいですか？', ${backUrl}, '戻る')}"></div>

	<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
