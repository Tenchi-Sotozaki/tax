<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>初回パスワード設定 - 宿泊税LGWAN-ASPシステム</title>
<link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
<link rel="stylesheet" th:href="@{/css/bootstrap-icons-complete.css}">
<link rel="stylesheet" th:href="@{/css/accommodation.css}">
</head>
<body
	class="bg-light d-flex align-items-center justify-content-center vh-100">

	<div class="card shadow-sm" style="width: 100%; max-width: 420px;">
		<div class="card-header bg-primary text-white text-center py-4">
			<i class="bi bi-building fs-2 d-block mb-2"></i>
			<h2 class="h5 mb-0 fw-bold">宿泊税LGWAN-ASPシステム</h2>
		</div>
		<div class="card-body p-4">
			<h3 class="h6 text-center text-muted mb-4">初回パスワード設定</h3>

			<div class="alert alert-info">
			    <i class="bi bi-shield-lock me-2"></i>このアカウントはユーザー・権限を管理するための<strong>管理者アカウント</strong>です。続行するには、新しいパスワードの設定が必要です。
			</div>

			<div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
				<i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
				<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
			</div>

			<form th:action="@{/admin/password-change}" method="post">
				<input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}"
					th:value="${_csrf.token}" />

				<div class="mb-3">
					<label for="adminId" class="form-label fw-medium">ID</label>
					<input type="text" class="form-control" id="adminId"
						th:value="${adminId}" readonly>
				</div>

				<div class="mb-3">
					<label for="newPassword" class="form-label fw-medium"> 新しいパスワード <span
						class="badge bg-danger ms-1">必須</span>
					</label> <input type="password" class="form-control" id="newPassword"
						name="newPassword" autocomplete="new-password" required>
				</div>

				<div class="mb-4">
					<label for="newPasswordConfirm" class="form-label fw-medium"> 新しいパスワード（確認用） <span
						class="badge bg-danger ms-1">必須</span>
					</label> <input type="password" class="form-control" id="newPasswordConfirm"
						name="newPasswordConfirm" autocomplete="new-password" required>
				</div>

				<button type="submit" class="btn btn-primary w-100">
					<i class="bi bi-save me-2"></i>設定する
				</button>
			</form>
		</div>
	</div>

	<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
