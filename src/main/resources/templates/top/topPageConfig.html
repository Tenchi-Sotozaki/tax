<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">

<head>
	<title>トップページ編集</title>
</head>

<body>
	<div layout:fragment="content" class="container-fluid p-4">

		<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
			<h5 class="mb-0 fw-bold text-dark">
				<i class="bi bi-pencil-square me-2 text-primary"></i>トップページ編集
			</h5>
		</div>
		
		<div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
			<span th:text="${successMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>
		<div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
			<span th:text="${errorMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>

		<form id="configForm" th:action="@{/top/config/save}" th:object="${form}" method="post">
			
			<input type="hidden" th:field="*{seq}">

			<!-- HTML入力エリア -->
			<div class="card shadow-sm mb-4">
				<div class="card-header py-3">
					<h5 class="mb-0"><i class="bi bi-code-slash me-2"></i>HTML入力エリア</h5>
				</div>
				<div class="card-body bg-light-subtle">
					<input class="form-control font-monospace" id="htmlContent" th:field="*{title}"
						rows="15" placeholder="タイトルを入力してください"></input>
				</div>				
				<div class="card-body bg-light-subtle">
					<textarea class="form-control font-monospace" id="htmlContent" th:field="*{htmlContent}"
						rows="15" placeholder="本文を入力してください"></textarea>
				</div>
				<div class="row">
				    <!-- 登録日 -->
				    <div class="col-md-6">
				        <div class="card-body bg-light-subtle">
				            <label for="registrationDate1" class="form-label fw-medium">
				                掲載開始日 <!--<span class="badge bg-danger text-white ms-1">必須</span>-->
				            </label>
							<input type="date"
							       class="form-control"
							       th:field="*{PostingStartDate}"
							       required>
				            <div id="registrationDateError1" class="text-danger small mt-1 d-none">
				                ※掲載開始日を入力してください
				            </div>
				        </div>
				    </div>

				    <!-- 終了日 -->
				    <div class="col-md-6">
				        <div class="card-body bg-light-subtle">
				            <label for="registrationDate2" class="form-label fw-medium">
				                掲載終了日 <!--<span class="badge bg-danger text-white ms-1">必須</span>-->
				            </label>
							<input type="date"
							       class="form-control"
							       th:field="*{PostingEndDate}"
							       required>
				            <div id="registrationDateError2" class="text-danger small mt-1 d-none">
				                ※掲載終了日を入力してください
				            </div>
				        </div>
				    </div>
				</div>
			</div>

			<!-- プレビューエリア -->
			<div class="card shadow-sm mb-4" th:if="${preview}">
				<div class="card-header py-3">
					<h5 class="mb-0"><i class="bi bi-eye me-2"></i>プレビュー</h5>
				</div>
				
				<div th:utext="${previewTitle}"></div>
				<div th:utext="${previewHtml}"></div>
			</div>

			<!-- アクションボタン -->
			<div class="d-flex justify-content-center gap-3 py-4 mb-5">
				
				<a th:href="@{/top/topPageConfigDaicho}" class="btn btn-outline-secondary px-4">
					<i class="bi bi-arrow-left me-2"></i>一覧に戻る
				</a>

				<button type="submit" form="configForm"
					formaction="/accommodation-tax/top/config/preview"
					class="btn btn-outline-primary px-4">
					<i class="bi bi-eye me-2"></i>プレビュー
				</button>

				<button type="submit" form="configForm"
					formaction="/accommodation-tax/top/config/save"
					class="btn btn-success px-5">
					<i class="bi bi-check-circle me-2"></i>
					<span th:text="${form.htmlContent != null and !#strings.isEmpty(form.htmlContent)} ? '更新' : '登録'">保存</span>
				</button>

			</div>
		</form>
	</div>

	<th:block layout:fragment="scripts">
		<script>
			function onKbnChange(radio) {
				const sel = document.getElementById('jichitaiCd');
				sel.disabled = (radio.value === '0');
				if (radio.value === '0') sel.value = '';
			}
		</script>
	</th:block>
</body>
</html>
