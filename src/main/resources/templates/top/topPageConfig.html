<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">

<head>
	<title>トップページ編集</title>
</head>

<body>
	<div layout:fragment="content" class="container-fluid p-4">

		<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
			<h5 class="mb-0 fw-bold text-dark">
				<i class="bi bi-pencil-square me-2 text-primary"></i>トップページ編集
			</h5>
		</div>

		<div th:if="${validationErrors != null and !validationErrors.isEmpty()}" class="alert alert-danger alert-dismissible fade show" role="alert">
			<i class="bi bi-exclamation-triangle-fill me-2"></i> 入力内容に <span th:text="${validationErrors.size()}"></span> 件のエラーがあります。
			<ul class="mb-0 mt-1">
				<li th:each="err : ${validationErrors}" th:text="${err}" class="small"></li>
			</ul>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>
		<div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
			<span th:text="${successMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>
		<div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
			<span th:text="${errorMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>

		<form id="configForm" th:action="@{/top/config/save}" th:object="${form}" method="post">

			<input type="hidden" th:field="*{seq}">

			<!-- HTML入力エリア -->
			<div class="card shadow-sm mb-4">
				<div class="card-header py-3">
					<h5 class="mb-0"><i class="bi bi-code-slash me-2"></i>HTML入力エリア</h5>
				</div>
				<div class="card-body bg-light-subtle">
					<label for="title" class="form-label fw-medium">
					    タイトル<span class="text-danger">*</span>
					</label>
					<input class="form-control font-monospace" id="title" th:field="*{title}"
						th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''"
						placeholder="タイトルを入力してください">
					<div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
				</div>
				<div class="card-body bg-light-subtle">
					<label for="htmlContent" class="form-label fw-medium">
					    内容 <span class="text-danger">*</span>
					</label>
					<textarea class="form-control font-monospace" id="htmlContent" th:field="*{htmlContent}"
						th:classappend="${#fields.hasErrors('htmlContent')} ? 'is-invalid' : ''"
						rows="15" placeholder="本文を入力してください"></textarea>
					<div class="invalid-feedback" th:if="${#fields.hasErrors('htmlContent')}" th:errors="*{htmlContent}"></div>
				</div>
				<div class="row">
				    <!-- 掲載開始日 -->
				    <div class="col-md-6">
				        <div class="card-body bg-light-subtle">
				            <label for="postingStartDate" class="form-label fw-medium">
				                掲載開始日
				            </label>
							<input type="date"
							       id="postingStartDate"
							       class="form-control"
							       th:classappend="${#fields.hasErrors('postingStartDate')} ? 'is-invalid' : ''"
							       th:field="*{postingStartDate}">
						<div class="invalid-feedback" th:if="${#fields.hasErrors('postingStartDate')}" th:errors="*{postingStartDate}"></div>
				        </div>
				    </div>

				    <!-- 掲載終了日 -->
				    <div class="col-md-6">
				        <div class="card-body bg-light-subtle">
				            <label for="postingEndDate" class="form-label fw-medium">
				                掲載終了日
				            </label>
							<input type="date"
							       id="postingEndDate"
							       class="form-control"
							       th:field="*{postingEndDate}">
				        </div>
				    </div>
				</div>
			</div>

			<!-- プレビューエリア -->
			<div class="card shadow-sm mb-4" th:if="${preview}">
				<div class="card-header py-3">
					<h5 class="mb-0"><i class="bi bi-eye me-2"></i>プレビュー</h5>
				</div>

				<div th:utext="${previewTitle}"></div>
				<div th:utext="${previewHtml}"></div>
			</div>

			<!-- アクションボタン -->
			<div class="d-flex justify-content-center gap-3 py-4 mb-5">
				
				<button type="submit" form="configForm"
					formaction="/accommodation-tax/top/config/preview"
					class="btn btn-outline-primary px-4">
					<i class="bi bi-eye me-2"></i>プレビュー
				</button>

				<button type="button"
					data-bs-toggle="modal"
					data-bs-target="#saveConfirmModal"
					class="btn btn-success btn-lg px-5">
					<i class="bi bi-check-circle me-2"></i>
					<span th:text="${form.seq != null} ? '更新' : '登録'">保存</span>
				</button>

				<a href="#"
					data-bs-toggle="modal"
					data-bs-target="#backConfirmModal"
					class="btn btn-outline-secondary btn-lg px-4">
					<i class="bi bi-arrow-left me-2"></i>一覧に戻る
				</a>

			</div>
		</form>

		<div th:replace="~{layout/components :: confirmModal('saveConfirmModal', ${form.seq != null} ? '更新確認' : '登録確認', ${form.seq != null} ? 'この内容で更新します。よろしいですか？' : 'この内容で登録します。よろしいですか？', 'configForm', 'btn-success', ${form.seq != null} ? '更新する' : '登録する')}"></div>

		<div th:replace="~{layout/components :: linkConfirmModal('backConfirmModal', '確認', '入力内容が破棄されます。よろしいですか？', @{/top/topPageConfigDaicho}, '一覧に戻る')}"></div>
	</div>

	<th:block layout:fragment="scripts">
		<script>
			function onKbnChange(radio) {
				const sel = document.getElementById('jichitaiCd');
				sel.disabled = (radio.value === '0');
				if (radio.value === '0') sel.value = '';
			}
		</script>
	</th:block>
</body>
</html>
