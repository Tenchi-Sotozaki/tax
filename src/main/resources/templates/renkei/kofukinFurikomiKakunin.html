<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">
<head>
<title>交付金データ出力確認</title>
<link rel="stylesheet" th:href="@{/css/kofukin-furikomi.css}">
</head>
<body>
	<div layout:fragment="content" class="container-fluid p-4">

		<div
			class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
			<h5 class="mb-0 fw-bold text-dark">
				<i class="bi bi-bank me-2 text-primary"></i>交付金データ出力確認
			</h5>
			<span class="text-muted small"> 選択件数: <strong
				th:text="${#lists.size(rows)}">0</strong> 件
			</span>
		</div>

		<!-- 確認データ一覧 -->
		<div class="table-container mb-3">
			<table
				class="table table-bordered table-hover table-sm align-middle mb-0">
				<thead class="table-info">
					<tr>
						<th style="width: 100px;">指定番号</th>
						<th style="width: 100px;">宛名番号</th>
						<th style="width: 200px;">氏名/名称</th>
						<th style="width: 80px;">年度</th>
						<th style="width: 120px;">交付年月日</th>
						<th style="width: 120px;">納入税額</th>
						<th style="width: 80px;">交付率</th>
						<th style="width: 120px;">交付額</th>
						<th style="width: 100px;">銀行コード</th>
						<th style="width: 150px;">銀行名</th>
						<th style="width: 100px;">支店コード</th>
						<th style="width: 130px;">支店名</th>
						<th style="width: 100px;">預金種目</th>
						<th style="width: 100px;">口座番号</th>
						<th style="width: 200px;">口座名義</th>
					</tr>
				</thead>
				<tbody>
					<th:block th:if="${rows != null and !rows.empty}">
						<tr th:each="row : ${rows}">
							<td th:text="${row.shiteiNo}"></td>
							<td th:text="${row.atenaNo}"></td>
							<td th:text="${row.name}"></td>
							<td th:text="${row.nendo}"></td>
							<td
								th:text="${row.kofuYmd != null ? #temporals.format(row.kofuYmd, 'yyyy-MM-dd') : ''}"></td>
							<td
								th:text="${row.kofuZeigaku != null ? #numbers.formatInteger(row.kofuZeigaku, 3, 'COMMA') : ''}"></td>
							<td th:text="${row.kofuRitsu}"></td>
							<td
								th:text="${row.kofuGaku != null ? #numbers.formatInteger(row.kofuGaku, 3, 'COMMA') : ''}"></td>
							<td th:text="${row.bankCd}"></td>
							<td th:text="${row.bankName}"></td>
							<td th:text="${row.branchCd}"></td>
							<td th:text="${row.branchName}"></td>
							<td><span th:switch="${row.shumoku}"> <span
									th:case="'1'">普通</span> <span th:case="'2'">当座</span> <span
									th:case="*" th:text="${row.shumoku}"></span>
							</span></td>
							<td th:text="${row.kozaNo}"></td>
							<td th:text="${row.meigi}"></td>
						</tr>
					</th:block>
					<th:block th:if="${rows == null or rows.empty}">
						<tr>
							<td colspan="15" class="text-center py-4 text-muted">該当データがありません</td>
						</tr>
					</th:block>
				</tbody>
			</table>
		</div>

		<!-- 戻るボタン -->
		<div class="mb-3 text-center">
			<a th:href="@{/kofukinFurikomi/list}"
				class="btn btn-outline-primary btn-lg px-4"> <i
				class="bi bi-arrow-left me-2"></i>戻る
			</a>
		</div>
	</div>
</body>
</html>
