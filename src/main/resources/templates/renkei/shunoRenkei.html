<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">
<head>
<title>収納管理連携</title>
<link rel="stylesheet" th:href="@{/css/shunoRenkei.css}">
</head>
<body>
	<div layout:fragment="content" class="container-fluid p-4">

		<div
			class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
			<h2 class="h2">
				<i class="bi bi-cloud-arrow-down me-2 text-primary"></i>収納管理連携
			</h2>
		</div>

		<!-- ========== 検索条件（アコーディオン） ========== -->
		<div class="accordion mb-3 shadow-sm" id="searchAccordion">
			<div class="accordion-item border">
				<h2 class="accordion-header">
					<button class="accordion-button py-2 fw-semibold" type="button"
						data-bs-toggle="collapse" data-bs-target="#searchPanel">
						<i class="bi bi-funnel me-2 text-primary"></i>検索条件
					</button>
				</h2>
				<div id="searchPanel" class="accordion-collapse collapse show">
					<div class="accordion-body pt-3 pb-2 px-3">
						<form th:action="@{/shunoRenkei/list}" th:object="${searchForm}"
							method="get">
							<!-- SP:1列 / タブレット:2列 / PC:4列 -->
							<div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-2 mb-2">
								<div class="col-md-3">
									<label for="shinkokuFrom" class="form-label fw-medium">申告日（開始）</label>
									<input type="date" class="form-control" id="shinkokuFrom"
										name="shinkokuFrom">
								</div>
								<div class="col-md-3">
									<label for="shinkokuTo" class="form-label fw-medium">申告日（終了）</label>
									<input type="date" class="form-control" id="shinkokuTo"
										name="shinkokuTo">
								</div>
								<div class="col-md-2">
									<label for="taishoMonth" class="form-label fw-medium">対象月</label>
									<input type="month" class="form-control" id="taishoMonth"
										name="taishoMonth">
								</div>
								<div class="col-md-2">
									<label for="shiteiNo" class="form-label fw-medium">指定番号</label>
									<input type="text" class="form-control" id="shiteiNo"
										name="shiteiNo">
								</div>
								<div class="col-md-2">
									<label for="name" class="form-label fw-medium">氏名/名称</label> <input
										type="text" class="form-control" id="name" name="name">
								</div>
								<div class="col-12">
									<button type="submit" class="btn btn-primary">
										<i class="bi bi-search me-1"></i>検索
									</button>
									<button type="button" class="btn btn-outline-secondary ms-2"
										id="clearBtn">
										<i class="bi bi-arrow-counterclockwise me-1"></i>リセット
									</button>
								</div>
							</div>
						</form>
					</div>
				</div>
			</div>

			<!-- ボタンエリア -->
			<div class="d-flex justify-content-between align-items-center mb-3">
				<div>
					<button id="viewBtn" class="btn btn-secondary">
						<i class="bi bi-eye me-1"></i>照会
					</button>
					<button id="csvBtn" class="btn btn-outline-primary ms-2">
						<i class="bi bi-file-earmark-spreadsheet me-1"></i>csv出力
					</button>
				</div>
				<div class="text-muted">
					<small>検索結果: <span id="resultCount">0</span> 件
					</small>
				</div>
			</div>

			<!-- 一覧エリア -->
			<div class="table-container">
				<table class="table table-striped table-hover mb-0" id="shunoTable">
					<thead class="table-primary">
						<tr>
							<th style="width: 5%;"><input type="checkbox" id="selectAll"></th>
							<th style="width: 10%;">指定番号</th>
							<th style="width: 10%;">宛名番号</th>
							<th style="width: 20%;">氏名/名称</th>
							<th style="width: 10%;">対象年月</th>
							<th style="width: 10%;" class="text-end">宿泊税額</th>
							<th style="width: 15%;">登録年月日</th>
							<th style="width: 15%;">申告年月日</th>
						</tr>
					</thead>
					<tbody>
						<!-- JavaScriptで行を描画 -->
					</tbody>
				</table>
			</div>

			<!-- ページネーション（ダミー） -->
			<nav aria-label="ページネーション" class="mt-4">
				<ul class="pagination justify-content-center">
					<li class="page-item disabled"><a class="page-link" href="#"
						tabindex="-1">前へ</a></li>
					<li class="page-item active"><a class="page-link" href="#">1</a></li>
					<li class="page-item"><a class="page-link" href="#">2</a></li>
					<li class="page-item"><a class="page-link" href="#">3</a></li>
					<li class="page-item"><a class="page-link" href="#">次へ</a></li>
				</ul>
			</nav>

		</div>
	</div>

	<th:block layout:fragment="scripts">
		<script th:src="@{/js/shuno_renkei.js}"></script>
	</th:block>
</body>
</html>
