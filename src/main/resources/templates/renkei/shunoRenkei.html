<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">
<head>
<title>収納管理データ出力</title>
<link rel="stylesheet" th:href="@{/css/shuno-renkei.css}">
</head>
<body>
	<div layout:fragment="content" class="container-fluid p-4">

		<div
			class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
			<h5 class="mb-0 fw-bold text-dark">
				<i class="bi bi-file-earmark-arrow-up me-2 text-primary"></i>収納管理データ出力
			</h5>
			<span class="text-muted small"> 検索結果: <strong
				th:text="${items != null ? items.totalElements : 0}">0</strong> 件
			</span>
		</div>

		<!-- ========== 検索条件（アコーディオン） ========== -->
		<div class="accordion mb-3 shadow-sm" id="searchAccordion">
			<div class="accordion-item border">
				<h2 class="accordion-header">
					<button class="accordion-button py-2 fw-semibold" type="button"
						data-bs-toggle="collapse" data-bs-target="#searchPanel">
						<i class="bi bi-funnel me-2 text-primary"></i>検索条件
					</button>
				</h2>
				<div id="searchPanel" class="accordion-collapse collapse show">
					<div class="accordion-body pt-3 pb-2 px-3">
						<form th:action="@{/shunoRenkei/list}" th:object="${searchForm}"
							method="get">
							<input type="hidden" name="searched" value="true">
							<!-- SP:1列 / タブレット:2列 / PC:4列 -->
							<div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-2 mb-2">
								<div class="col">
									<label for="shinkokuFrom"
										class="form-label form-label-sm fw-medium mb-1">申告年月日（FROM）</label>
									<input type="date" class="form-control form-control-sm"
										id="shinkokuFrom" name="shinkokuFrom" data-no-today
										th:attr="value=${searchForm.shinkokuFrom}">
								</div>
								<div class="col">
									<label for="shinkokuTo"
										class="form-label form-label-sm fw-medium mb-1">申告年月日（TO）</label>
									<input type="date" class="form-control form-control-sm"
										id="shinkokuTo" name="shinkokuTo" data-no-today th:attr="value=${searchForm.shinkokuTo}">
								</div>
								<div class="col">
									<label for="taishoMonth"
										class="form-label form-label-sm fw-medium mb-1">対象月</label> <input
										type="month" class="form-control form-control-sm"
										id="taishoMonth" name="taishoMonth" th:value="*{taishoMonth}">
								</div>
								<div class="col">
									<label for="shiteiNo"
										class="form-label form-label-sm fw-medium mb-1">指定番号</label> <input
										type="text" class="form-control form-control-sm" id="shiteiNo"
										name="shiteiNo" th:value="*{shiteiNo}">
								</div>
								<div class="col">
									<div class="d-flex align-items-center gap-2 mb-1" style="white-space: nowrap;">
										<label class="form-label form-label-sm fw-medium mb-0">氏名/名称</label>
										<div class="form-check form-check-inline me-0">
											<input class="form-check-input" type="radio" name="nameMatchType" value="prefix" id="namePrefix" th:checked="${searchForm.nameMatchType == 'prefix'}">
											<label class="form-check-label small" for="namePrefix">前方</label>
										</div>
										<div class="form-check form-check-inline me-0">
											<input class="form-check-input" type="radio" name="nameMatchType" value="partial" id="namePartial" th:checked="${searchForm.nameMatchType == null or searchForm.nameMatchType == 'partial'}">
											<label class="form-check-label small" for="namePartial">部分</label>
										</div>
										<div class="form-check form-check-inline me-0">
											<input class="form-check-input" type="radio" name="nameMatchType" value="exact" id="nameExact" th:checked="${searchForm.nameMatchType == 'exact'}">
											<label class="form-check-label small" for="nameExact">完全</label>
										</div>
									</div>
									<input type="text" class="form-control form-control-sm"
										id="name" name="name" th:value="*{name}">
								</div>
							</div>
							<div class="d-flex justify-content-end gap-2 pt-1 border-top">
								<button type="reset" class="btn btn-outline-secondary"><i class="bi bi-arrow-counterclockwise me-1"></i>検索条件初期化</button>
								<button type="submit" class="btn btn-primary px4">
									<i class="bi bi-search me-1"></i>検索する
								</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>

		<!-- ボタンエリア -->
		<div class="card shadow-sm mb-4" th:if="${items != null and !items.empty}">
			<div class="card-body py-2 px-3">
				<div class="d-flex flex-wrap align-items-center gap-1"
					style="row-gap: 0.4rem;">
					<div>
						<button id="viewBtn" class="btn btn-outline-primary">
							<i class="bi bi-eye me-1"></i>照会
						</button>
						<button id="csvBtn" class="btn btn-primary ms-2">
							<i class="bi bi-file-earmark-spreadsheet me-1"></i>csv出力
						</button>
					</div>
				</div>
			</div>
		</div>

		<!-- 一覧エリア -->
		<div id="listArea" th:classappend="${items == null} ? 'd-none' : ''" class="mt-2 mb-2">

			<!-- ページネーション & 表示件数 -->
			<div class="d-flex align-items-center justify-content-center position-relative mt-3 mb-3">
				<nav class="pagination-container">
					<ul class="pagination pagination-sm mb-0" id="pagination"></ul>
				</nav>
				<div class="d-flex align-items-center gap-2 position-absolute end-0">
					<label for="pageSizeSelect" class="form-label form-label-sm fw-medium mb-0 text-nowrap">表示件数</label>
					<select id="pageSizeSelect" class="form-select form-select-sm" style="width: auto;">
						<option value="10" th:selected="${searchForm.pageSize == 10}">10件</option>
						<option value="50" th:selected="${searchForm.pageSize == 50}">50件</option>
						<option value="100" th:selected="${searchForm.pageSize == 100}">100件</option>
					</select>
				</div>
			</div>

			<div class="table-container">
				<table
					class="table table-bordered table-hover table-sm align-middle mb-0 sticky-table"
					id="shunoTable">
					<thead class="table-primary">
						<tr>
							<th style="width: 20px;" class="text-center"><input
								type="checkbox" id="selectAll"></th>
							<th style="width: 100px;">指定番号</th>
							<th style="width: 100px;">宛名番号</th>
							<th style="width: 200px;">氏名/名称</th>
							<th style="width: 100px;">対象年月</th>
							<th style="width: 100px;">宿泊税額</th>
							<th style="width: 150px;">登録年月日</th>
							<th style="width: 150px;">申告年月日</th>
						</tr>
					</thead>
					<tbody>
						<th:block th:if="${items != null and !items.empty}">
							<tr th:each="item : ${items.content}">
								<td class="text-center"><input type="checkbox"
									name="selectedIds" th:value="${item.shiteiNo}"
									th:attr="data-shiteiNo=${item.shiteiNo},data-nendo=${item.nendo},data-kibetsu=${item.kibetsu}" />
								</td>
								<td th:text="${item.shiteiNo}">指定番号</td>
								<td th:text="${item.atenaNo}">宛名番号</td>
								<td th:text="${item.name}">氏名/名称</td>
								<td th:text="${item.taishoYm}">対象年月</td>
								<td th:text="${item.totalZeigaku}">宿泊税額</td>
								<td
									th:text="${item.torokuYmd != null ? #temporals.format(item.torokuYmd, 'yyyy-MM-dd') : ''}">登録年月日</td>
								<td
									th:text="${item.shinkokuYmd != null ? #temporals.format(item.shinkokuYmd, 'yyyy-MM-dd') : ''}">申告年月日</td>
							</tr>
						</th:block>
						<th:block th:if="${items == null or items.empty}">
							<tr>
								<td colspan="8" class="text-center py-4 text-muted">該当データがありません</td>
							</tr>
						</th:block>
					</tbody>
				</table>
			</div>
		</div>
	</div>

	<th:block layout:fragment="scripts">
		<script th:src="@{/js/shunoRenkei.js}"></script>
	</th:block>
</body>
</html>
