<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">
<head>
<title>蜿守ｴ咲ｮ｡逅・｣謳ｺ</title>
<link rel="stylesheet" th:href="@{/css/shunoRenkei.css}">
</head>
<body>
	<div layout:fragment="content" class="container-fluid p-4">

		<div
			class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
			<h5 class="mb-0 fw-bold text-dark">
				<i class="bi bi-file-earmark-arrow-up me-2 text-primary"></i>蜿守ｴ咲ｮ｡逅・｣謳ｺ
			</h5>
			<span class="text-muted small"> 讀懃ｴ｢邨先棡: <strong
				th:text="${#lists.size(items)}">0</strong> 莉ｶ
			</span>
		</div>

		<!-- ========== 謚ｽ蜃ｺ譚｡莉ｶ・医い繧ｳ繝ｼ繝・ぅ繧ｪ繝ｳ・・========== -->
		<div class="accordion mb-3 shadow-sm" id="searchAccordion">
			<div class="accordion-item border">
				<h2 class="accordion-header">
					<button class="accordion-button py-2 fw-semibold" type="button"
						data-bs-toggle="collapse" data-bs-target="#searchPanel">
						<i class="bi bi-funnel me-2 text-primary"></i>謚ｽ蜃ｺ譚｡莉ｶ
					</button>
				</h2>
				<div id="searchPanel" class="accordion-collapse collapse show">
					<div class="accordion-body pt-3 pb-2 px-3">
						<form th:action="@{/shunoRenkei/list}" th:object="${searchForm}"
							method="get">
							<!-- SP:1蛻・/ 繧ｿ繝悶Ξ繝・ヨ:2蛻・/ PC:4蛻・-->
							<div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-2 mb-2">
								<div class="col">
									<label for="shinkokuFrom"
										class="form-label form-label-sm fw-medium mb-1">逕ｳ蜻頑律・磯幕蟋具ｼ・/label>
									<input type="date" class="form-control form-control-sm"
										id="shinkokuFrom" name="shinkokuFrom" th:value="*{shinkokuFrom}">
								</div>
								<div class="col">
									<label for="shinkokuTo"
										class="form-label form-label-sm fw-medium mb-1">逕ｳ蜻頑律・育ｵゆｺ・ｼ・/label>
									<input type="date" class="form-control form-control-sm"
										id="shinkokuTo" name="shinkokuTo" th:value="*{shinkokuTo}">
								</div>
								<div class="col">
									<label for="taishoMonth"
										class="form-label form-label-sm fw-medium mb-1">蟇ｾ雎｡譛・/label> <input
										type="month" class="form-control form-control-sm"
										id="taishoMonth" name="taishoMonth" th:value="*{taishoMonth}">
								</div>
								<div class="col">
									<label for="shiteiNo"
										class="form-label form-label-sm fw-medium mb-1">謖・ｮ夂分蜿ｷ</label> <input
										type="text" class="form-control form-control-sm" id="shiteiNo"
										name="shiteiNo" th:value="*{shiteiNo}">
								</div>
								<div class="col">
									<div class="d-flex align-items-center gap-2 mb-1" style="white-space: nowrap;">
										<label class="form-label form-label-sm fw-medium mb-0">豌丞錐/蜷咲ｧｰ</label>
										<div class="form-check form-check-inline me-0">
											<input class="form-check-input" type="radio" name="nameMatchType" value="prefix" id="namePrefix" th:checked="${searchForm.nameMatchType == 'prefix'}">
											<label class="form-check-label small" for="namePrefix">蜑肴婿</label>
										</div>
										<div class="form-check form-check-inline me-0">
											<input class="form-check-input" type="radio" name="nameMatchType" value="partial" id="namePartial" th:checked="${searchForm.nameMatchType == null or searchForm.nameMatchType == 'partial'}">
											<label class="form-check-label small" for="namePartial">驛ｨ蛻・/label>
										</div>
										<div class="form-check form-check-inline me-0">
											<input class="form-check-input" type="radio" name="nameMatchType" value="exact" id="nameExact" th:checked="${searchForm.nameMatchType == 'exact'}">
											<label class="form-check-label small" for="nameExact">螳悟・</label>
										</div>
									</div>
									<input type="text" class="form-control form-control-sm"
										id="name" name="name" th:value="*{name}">
								</div>
							</div>
							<div class="d-flex justify-content-end gap-2 pt-1 border-top">
								<a th:href="@{/shunoRenkei/list}"
									class="btn btn-outline-secondary btn-sm"> <i
									class="bi bi-arrow-counterclockwise me-1"></i>繝ｪ繧ｻ繝・ヨ
								</a>
								<button type="submit" class="btn btn-primary btn-sm px4">
									<i class="bi bi-search me-1"></i>讀懃ｴ｢縺吶ｋ
								</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>

		<!-- 繝懊ち繝ｳ繧ｨ繝ｪ繧｢ -->
		<div class="card shadow-sm mb-3">
			<div class="card-body py-2 px-3">
				<div class="d-flex flex-wrap align-items-center gap-1"
					style="row-gap: 0.4rem;">
					<div>
						<button id="viewBtn" class="btn btn-outline-secondary btn-sm">
							<i class="bi bi-eye me-1"></i>辣ｧ莨・
						</button>
						<button id="csvBtn" class="btn btn-outline-primary btn-sm ms-2">
							<i class="bi bi-file-earmark-spreadsheet me-1"></i>csv蜃ｺ蜉・
						</button>
					</div>
				</div>
			</div>
		</div>

		<!-- 荳隕ｧ繧ｨ繝ｪ繧｢ -->
		<div class="table-container">
			<table
				class="table table-bordered table-hover table-sm align-middle mb-0 sticky-table"
				id="shunoTable">
				<thead class="table-primary">
					<tr>
						<th style="width: 20px;" class="text-center"><input
							type="checkbox" id="selectAll"></th>
						<th style="width: 100px;">謖・ｮ夂分蜿ｷ</th>
						<th style="width: 100px;">螳帛錐逡ｪ蜿ｷ</th>
						<th style="width: 200px;">豌丞錐/蜷咲ｧｰ</th>
						<th style="width: 100px;">蟇ｾ雎｡蟷ｴ譛・/th>
						<th style="width: 100px;">螳ｿ豕顔ｨ朱｡・/th>
						<th style="width: 150px;">逋ｻ骭ｲ蟷ｴ譛域律</th>
						<th style="width: 150px;">逕ｳ蜻雁ｹｴ譛域律</th>
					</tr>
				</thead>
				<tbody>
					<th:block th:if="${items != null and !items.empty}">
						<tr th:each="item : ${items}">
							<td class="text-center"><input type="checkbox"
								name="selectedIds" th:value="${item.shiteiNo}"
								th:attr="data-shiteiNo=${item.shiteiNo},data-nendo=${item.nendo},data-kibetsu=${item.kibetsu}" />
							</td>
							<td th:text="${item.shiteiNo}">謖・ｮ夂分蜿ｷ</td>
							<td th:text="${item.atenaNo}">螳帛錐逡ｪ蜿ｷ</td>
							<td th:text="${item.name}">豌丞錐/蜷咲ｧｰ</td>
							<td th:text="${item.taishoYm}">蟇ｾ雎｡蟷ｴ譛・/td>
							<td th:text="${item.totalZeigaku}">螳ｿ豕顔ｨ朱｡・/td>
							<td
								th:text="${item.torokuYmd != null ? #temporals.format(item.torokuYmd, 'yyyy-MM-dd') : ''}">逋ｻ骭ｲ蟷ｴ譛域律</td>
							<td
								th:text="${item.shinkokuYmd != null ? #temporals.format(item.shinkokuYmd, 'yyyy-MM-dd') : ''}">逕ｳ蜻雁ｹｴ譛域律</td>
						</tr>
					</th:block>
					<th:block th:if="${items == null or items.empty}">
						<tr>
							<td colspan="8" class="text-center py-4 text-muted">隧ｲ蠖薙ョ繝ｼ繧ｿ縺後≠繧翫∪縺帙ｓ</td>
						</tr>
					</th:block>
				</tbody>
			</table>
		</div>

		<!-- 繝壹・繧ｸ繝阪・繧ｷ繝ｧ繝ｳ -->
		<div class="card-footer bg-white py-2 border-top">
			<nav>
				<ul class="pagination pagination-sm justify-content-center mb-0">
					<li class="page-item disabled"><a class="page-link" href="#">蜑阪∈</a></li>
					<li class="page-item active"><a class="page-link" href="#">1</a></li>
					<li class="page-item"><a class="page-link" href="#">谺｡縺ｸ</a></li>
				</ul>
			</nav>
		</div>
	</div>

	<th:block layout:fragment="scripts">
		<script th:src="@{/js/shunoRenkei.js}"></script>
	</th:block>
</body>
</html>
