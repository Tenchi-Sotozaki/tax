<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">
<head>
<title>収納管理連携</title>
<link rel="stylesheet" th:href="@{/css/shuno-renkei.css}">
</head>
<body>
	<div layout:fragment="content" class="container-fluid p-4">

		<div
			class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
			<h5 class="mb-0 fw-bold text-dark">
				<i class="bi bi-file-earmark-arrow-up me-2 text-primary"></i>収納管理連携
			</h5>
			<span class="text-muted small"> 検索結果: <strong
				th:text="${items != null ? items.totalElements : 0}">0</strong> 件
			</span>
		</div>

		<!-- ========== 抽出条件（アコーディオン） ========== -->
		<div class="accordion mb-3 shadow-sm" id="searchAccordion">
			<div class="accordion-item border">
				<h2 class="accordion-header">
					<button class="accordion-button py-2 fw-semibold" type="button"
						data-bs-toggle="collapse" data-bs-target="#searchPanel">
						<i class="bi bi-funnel me-2 text-primary"></i>抽出条件
					</button>
				</h2>
				<div id="searchPanel" class="accordion-collapse collapse show">
					<div class="accordion-body pt-3 pb-2 px-3">
						<form th:action="@{/shunoRenkei/list}" th:object="${searchForm}"
							method="get">
							<!-- SP:1列 / タブレット:2列 / PC:4列 -->
							<div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-2 mb-2">
								<div class="col">
									<label for="shinkokuFrom"
										class="form-label form-label-sm fw-medium mb-1">申告日（開始）</label>
									<input type="date" class="form-control form-control-sm"
										id="shinkokuFrom" name="shinkokuFrom" th:value="*{shinkokuFrom}">
								</div>
								<div class="col">
									<label for="shinkokuTo"
										class="form-label form-label-sm fw-medium mb-1">申告日（終了）</label>
									<input type="date" class="form-control form-control-sm"
										id="shinkokuTo" name="shinkokuTo" th:value="*{shinkokuTo}">
								</div>
								<div class="col">
									<label for="taishoMonth"
										class="form-label form-label-sm fw-medium mb-1">対象月</label> <input
										type="month" class="form-control form-control-sm"
										id="taishoMonth" name="taishoMonth" th:value="*{taishoMonth}">
								</div>
								<div class="col">
									<label for="shiteiNo"
										class="form-label form-label-sm fw-medium mb-1">指定番号</label> <input
										type="text" class="form-control form-control-sm" id="shiteiNo"
										name="shiteiNo" th:value="*{shiteiNo}">
								</div>
								<div class="col">
									<div class="d-flex align-items-center gap-2 mb-1" style="white-space: nowrap;">
										<label class="form-label form-label-sm fw-medium mb-0">氏名/名称</label>
										<div class="form-check form-check-inline me-0">
											<input class="form-check-input" type="radio" name="nameMatchType" value="prefix" id="namePrefix" th:checked="${searchForm.nameMatchType == 'prefix'}">
											<label class="form-check-label small" for="namePrefix">前方</label>
										</div>
										<div class="form-check form-check-inline me-0">
											<input class="form-check-input" type="radio" name="nameMatchType" value="partial" id="namePartial" th:checked="${searchForm.nameMatchType == null or searchForm.nameMatchType == 'partial'}">
											<label class="form-check-label small" for="namePartial">部分</label>
										</div>
										<div class="form-check form-check-inline me-0">
											<input class="form-check-input" type="radio" name="nameMatchType" value="exact" id="nameExact" th:checked="${searchForm.nameMatchType == 'exact'}">
											<label class="form-check-label small" for="nameExact">完全</label>
										</div>
									</div>
									<input type="text" class="form-control form-control-sm"
										id="name" name="name" th:value="*{name}">
								</div>
							</div>
							<div class="d-flex justify-content-end gap-2 pt-1 border-top">
								<a th:href="@{/shunoRenkei/list}"
									class="btn btn-outline-secondary btn-sm"> <i
									class="bi bi-arrow-counterclockwise me-1"></i>リセット
								</a>
								<button type="submit" class="btn btn-primary btn-sm px4">
									<i class="bi bi-search me-1"></i>検索する
								</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>

		<!-- ボタンエリア -->
		<div class="card shadow-sm mb-3">
			<div class="card-body py-2 px-3">
				<div class="d-flex flex-wrap align-items-center gap-1"
					style="row-gap: 0.4rem;">
					<div>
						<button id="viewBtn" class="btn btn-outline-primary btn-sm">
							<i class="bi bi-eye me-1"></i>照会
						</button>
						<button id="csvBtn" class="btn btn-primary btn-sm ms-2">
							<i class="bi bi-file-earmark-spreadsheet me-1"></i>csv出力
						</button>
					</div>
				</div>
			</div>
		</div>

		<div class="d-flex justify-content-end align-items-center mb-2">
			<label class="form-label form-label-sm mb-0 me-2">表示件数</label>
			<select class="form-select form-select-sm" style="width: auto;" onchange="location.href=this.value">
				<option th:each="s : ${#arrays.toArray({10, 50, 100})}"
					th:value="@{/shunoRenkei/list(page=0, pageSize=${s}, shinkokuFrom=${searchForm.shinkokuFrom}, shinkokuTo=${searchForm.shinkokuTo}, taishoMonth=${searchForm.taishoMonth}, shiteiNo=${searchForm.shiteiNo}, name=${searchForm.name}, nameMatchType=${searchForm.nameMatchType})}"
					th:text="${s}" th:selected="${s == searchForm.pageSize}">10</option>
			</select>
		</div>

		<!-- 一覧エリア -->
		<div class="table-container">
			<table
				class="table table-bordered table-hover table-sm align-middle mb-0 sticky-table"
				id="shunoTable">
				<thead class="table-primary">
					<tr>
						<th style="width: 20px;" class="text-center"><input
							type="checkbox" id="selectAll"></th>
						<th style="width: 100px;">指定番号</th>
						<th style="width: 100px;">宛名番号</th>
						<th style="width: 200px;">氏名/名称</th>
						<th style="width: 100px;">対象年月</th>
						<th style="width: 100px;">宿泊税額</th>
						<th style="width: 150px;">登録年月日</th>
						<th style="width: 150px;">申告年月日</th>
					</tr>
				</thead>
				<tbody>
					<th:block th:if="${items != null and !items.empty}">
						<tr th:each="item : ${items.content}">
							<td class="text-center"><input type="checkbox"
								name="selectedIds" th:value="${item.shiteiNo}"
								th:attr="data-shiteiNo=${item.shiteiNo},data-nendo=${item.nendo},data-kibetsu=${item.kibetsu}" />
							</td>
							<td th:text="${item.shiteiNo}">指定番号</td>
							<td th:text="${item.atenaNo}">宛名番号</td>
							<td th:text="${item.name}">氏名/名称</td>
							<td th:text="${item.taishoYm}">対象年月</td>
							<td th:text="${item.totalZeigaku}">宿泊税額</td>
							<td
								th:text="${item.torokuYmd != null ? #temporals.format(item.torokuYmd, 'yyyy-MM-dd') : ''}">登録年月日</td>
							<td
								th:text="${item.shinkokuYmd != null ? #temporals.format(item.shinkokuYmd, 'yyyy-MM-dd') : ''}">申告年月日</td>
						</tr>
					</th:block>
					<th:block th:if="${items == null or items.empty}">
						<tr>
							<td colspan="8" class="text-center py-4 text-muted">該当データがありません</td>
						</tr>
					</th:block>
				</tbody>
			</table>
		</div>

		<!-- ページネーション -->
		<div class="card-footer bg-white py-2 border-top" th:if="${items != null and items.totalPages > 0}">
			<nav>
				<ul class="pagination pagination-sm justify-content-center mb-0">
					<li class="page-item" th:classappend="${items.first} ? 'disabled'">
						<a class="page-link" th:href="@{/shunoRenkei/list(page=${items.number - 1}, pageSize=${searchForm.pageSize}, shinkokuFrom=${searchForm.shinkokuFrom}, shinkokuTo=${searchForm.shinkokuTo}, taishoMonth=${searchForm.taishoMonth}, shiteiNo=${searchForm.shiteiNo}, name=${searchForm.name}, nameMatchType=${searchForm.nameMatchType})}">前へ</a>
					</li>
					<th:block th:each="p : ${pageWindow}">
						<li class="page-item disabled" th:if="${p == -1}"><span class="page-link">…</span></li>
						<li class="page-item" th:if="${p != -1}" th:classappend="${p == items.number} ? 'active'">
							<a class="page-link" th:href="@{/shunoRenkei/list(page=${p}, pageSize=${searchForm.pageSize}, shinkokuFrom=${searchForm.shinkokuFrom}, shinkokuTo=${searchForm.shinkokuTo}, taishoMonth=${searchForm.taishoMonth}, shiteiNo=${searchForm.shiteiNo}, name=${searchForm.name}, nameMatchType=${searchForm.nameMatchType})}" th:text="${p + 1}">1</a>
						</li>
					</th:block>
					<li class="page-item" th:classappend="${items.last} ? 'disabled'">
						<a class="page-link" th:href="@{/shunoRenkei/list(page=${items.number + 1}, pageSize=${searchForm.pageSize}, shinkokuFrom=${searchForm.shinkokuFrom}, shinkokuTo=${searchForm.shinkokuTo}, taishoMonth=${searchForm.taishoMonth}, shiteiNo=${searchForm.shiteiNo}, name=${searchForm.name}, nameMatchType=${searchForm.nameMatchType})}">次へ</a>
					</li>
				</ul>
			</nav>
		</div>
	</div>

	<th:block layout:fragment="scripts">
		<script th:src="@{/js/shunoRenkei.js}"></script>
	</th:block>
</body>
</html>
