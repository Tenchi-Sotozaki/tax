<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">

<head>
<title>送付先情報CSV出力</title>
</head>

<body>
	<div layout:fragment="content" class="container-fluid p-4">

		<div
			class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
			<h5 class="mb-0 fw-bold text-dark">
				<i class="bi bi-file-earmark-arrow-down me-2 text-primary"></i>送付先情報CSV出力
			</h5>
			<div class="text-muted small">
				検索結果：<span id="totalCount" th:text="${items.size()}">0</span>件
			</div>
		</div>

		<form th:action="@{/renkei/sofusaki-csv/download}" method="post"
			id="csvForm">
			<input type="hidden" th:if="${_csrf}"
				th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

			<!-- ======== テーブル上部コントロール ======== -->
			<div class="d-flex justify-content-between align-items-center mb-2">
				<!-- CSV出力ボタン（左端） -->
				<button type="submit" class="btn btn-success btn-sm" id="csvBtn">
					<i class="bi bi-download me-1"></i>CSV出力
				</button>

				<!-- ページネーション（中央） -->
				<nav>
					<ul class="pagination pagination-sm mb-0" id="pagination"></ul>
				</nav>

				<!-- 表示件数セレクタ（右端） -->
				<div class="d-flex align-items-center gap-2">
					<label class="form-label form-label-sm fw-medium mb-0">表示件数</label>
					<select id="pageSizeSelect" class="form-select form-select-sm"
						style="width: auto;">
						<option value="10" selected>10件</option>
						<option value="50">50件</option>
						<option value="100">100件</option>
					</select>
				</div>
			</div>

			<!-- ======== 一覧テーブル ======== -->
			<div class="card shadow-sm mb-2">
				<div class="table-responsive"
					style="max-height: 60vh; overflow-y: auto;">
					<table
						class="table table-striped table-hover table-bordered align-middle mb-0">
						<thead class="table-primary"
							style="position: sticky; top: 0; z-index: 1;">
							<tr>
								<th style="width: 40px;"><input type="checkbox"
									id="checkAll" class="form-check-input" checked></th>
								<th style="width: 120px;">指定番号</th>
								<th style="width: 200px;">氏名/名称</th>
								<th style="width: 170px;">印刷日時</th>
								<th style="width: 200px;">帳票名</th>
							</tr>
						</thead>
						<tbody>
							<tr th:if="${items.isEmpty()}">
								<td colspan="5" class="text-center text-muted py-4">データが見つかりません</td>
							</tr>
							<tr class="csv-row" th:each="item, stat : ${items}">
								<td><input type="checkbox" name="selectedIndexes"
									th:value="${stat.index}" class="form-check-input row-check"
									checked></td>
								<td th:text="${item.shiteiNo}"></td>
								<td th:text="${item.soufusakiName}"></td>
								<td
									th:text="${item.opeDt != null ? #temporals.format(item.opeDt, 'yyyy/MM/dd HH:mm:ss') : ''}"></td>
								<td th:text="${item.rptName}"></td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</form>

	</div>

	<th:block layout:fragment="scripts">
		<script th:src="@{/js/sofusakiCsv.js}"></script>
	</th:block>
</body>

</html>
