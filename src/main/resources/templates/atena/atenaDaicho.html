<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">
<head>
<title>宛名管理台帳</title>
</head>
<body>
	<div layout:fragment="content" class="container-fluid px-4 py-3"
		th:with="isSearched=${param.atenaNo != null or param.name != null or param.nameKana != null or param.yubinNo != null or param.jusho != null or param.tel != null or param.kojinNo != null or param.hojinNo != null or param.page != null}">

		<div
			class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center mb-3 pb-2 border-bottom">
			<h5 class="mb-0 fw-bold text-dark">
				<i class="bi bi-person-lines-fill me-2 text-primary"></i>宛名管理台帳
			</h5>
			<div class="d-flex align-items-center gap-3">
				<span class="text-muted small" th:if="${isSearched}">検索結果：<span
					th:text="${items.totalElements}">0</span> 件
				</span>

			</div>
		</div>

		<div th:if="${successMessage}"
			class="alert alert-success alert-dismissible fade show" role="alert">
			<span th:text="${successMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>

		<!-- 抽出条件 (アコーディオン) -->
		<div class="accordion mb-3 shadow-sm" id="searchAccordion">
			<div class="accordion-item border">
				<h2 class="accordion-header">
					<button class="accordion-button py-2 fw-semibold" type="button"
						data-bs-toggle="collapse" data-bs-target="#searchPanel"
						th:classappend="${isSearched} ? 'collapsed' : ''"
						th:aria-expanded="${!isSearched} ? 'true' : 'false'">
						<i class="bi bi-funnel me-2"></i>検索条件
					</button>
				</h2>
				<div id="searchPanel" class="accordion-collapse collapse"
					th:classappend="${!isSearched} ? 'show' : ''">
					<div class="accordion-body pt-3 pb-2 px-3">
						<form th:action="@{/atena/list}" th:object="${searchForm}"
							method="get">
							<div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-2 mb-2">
								<div class="col">
									<label class="form-label form-label-sm fw-medium mb-1">宛名番号</label>
									<input type="text" class="form-control form-control-sm"
										th:field="*{atenaNo}" placeholder="宛名番号">
								</div>
								<div class="col">
									<div class="d-flex align-items-center gap-2 mb-1"
										style="white-space: nowrap;">
										<label class="form-label form-label-sm fw-medium mb-0">氏名/名称</label>
										<div class="form-check form-check-inline me-0">
											<input class="form-check-input" type="radio"
												th:field="*{nameMatchType}" value="prefix" id="namePrefix">
											<label class="form-check-label small" for="namePrefix">前方</label>
										</div>
										<div class="form-check form-check-inline me-0">
											<input class="form-check-input" type="radio"
												th:field="*{nameMatchType}" value="partial" id="namePartial">
											<label class="form-check-label small" for="namePartial">部分</label>
										</div>
										<div class="form-check form-check-inline me-0">
											<input class="form-check-input" type="radio"
												th:field="*{nameMatchType}" value="exact" id="nameExact">
											<label class="form-check-label small" for="nameExact">完全</label>
										</div>
									</div>
									<input type="text" class="form-control form-control-sm"
										th:field="*{name}" placeholder="氏名または名称">
								</div>
								<div class="col">
									<div class="d-flex align-items-center gap-2 mb-1"
										style="white-space: nowrap;">
										<label class="form-label form-label-sm fw-medium mb-0">ふりがな</label>
										<div class="form-check form-check-inline me-0">
											<input class="form-check-input" type="radio"
												th:field="*{nameKanaMatchType}" value="prefix"
												id="nameKanaPrefix"> <label
												class="form-check-label small" for="nameKanaPrefix">前方</label>
										</div>
										<div class="form-check form-check-inline me-0">
											<input class="form-check-input" type="radio"
												th:field="*{nameKanaMatchType}" value="partial"
												id="nameKanaPartial"> <label
												class="form-check-label small" for="nameKanaPartial">部分</label>
										</div>
										<div class="form-check form-check-inline me-0">
											<input class="form-check-input" type="radio"
												th:field="*{nameKanaMatchType}" value="exact"
												id="nameKanaExact"> <label
												class="form-check-label small" for="nameKanaExact">完全</label>
										</div>
									</div>
									<input type="text" class="form-control form-control-sm"
										th:field="*{nameKana}" placeholder="ふりがな">
								</div>
								<div class="col">
									<label class="form-label form-label-sm fw-medium mb-1">郵便番号</label>
									<input type="text" class="form-control form-control-sm"
										th:field="*{yubinNo}" placeholder="郵便番号">
								</div>
								<div class="col">
									<div class="d-flex align-items-center gap-2 mb-1"
										style="white-space: nowrap;">
										<label class="form-label form-label-sm fw-medium mb-0">住所</label>
										<div class="form-check form-check-inline me-0">
											<input class="form-check-input" type="radio"
												th:field="*{jushoMatchType}" value="prefix" id="jushoPrefix">
											<label class="form-check-label small" for="jushoPrefix">前方</label>
										</div>
										<div class="form-check form-check-inline me-0">
											<input class="form-check-input" type="radio"
												th:field="*{jushoMatchType}" value="partial"
												id="jushoPartial"> <label
												class="form-check-label small" for="jushoPartial">部分</label>
										</div>
										<div class="form-check form-check-inline me-0">
											<input class="form-check-input" type="radio"
												th:field="*{jushoMatchType}" value="exact" id="jushoExact">
											<label class="form-check-label small" for="jushoExact">完全</label>
										</div>
									</div>
									<input type="text" class="form-control form-control-sm"
										th:field="*{jusho}" placeholder="住所">
								</div>
								<div class="col">
									<label class="form-label form-label-sm fw-medium mb-1">電話番号</label>
									<input type="text" class="form-control form-control-sm"
										th:field="*{tel}" placeholder="電話番号">
								</div>
								<div class="col">
									<label class="form-label form-label-sm fw-medium mb-1">個人番号</label>
									<input type="text" class="form-control form-control-sm"
										th:field="*{kojinNo}" placeholder="個人番号">
								</div>
								<div class="col">
									<label class="form-label form-label-sm fw-medium mb-1">法人番号</label>
									<input type="text" class="form-control form-control-sm"
										th:field="*{hojinNo}" placeholder="法人番号">
								</div>
							</div>
							<div class="d-flex justify-content-end gap-2 pt-1 border-top">
								<a th:href="@{/atena/list}"
									class="btn btn-outline-secondary btn-sm"> <i
									class="bi bi-arrow-counterclockwise me-1"></i>検索条件初期化
								</a>
								<button type="submit" class="btn btn-primary btn-sm px-4">
									<i class="bi bi-search me-1"></i>検索する
								</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>

		<!-- 検索結果エリア -->
		<div th:if="${isSearched}">

			<!-- 表示件数 + ページネーション（同一行） -->
			<div class="d-flex align-items-center mb-1">
				<div style="min-width: 130px;">
					<a th:href="@{/atena/register}" class="btn btn-primary btn-sm">
						<i class="bi bi-plus-circle me-1"></i>新規登録
					</a>
				</div>
				<nav class="flex-grow-1">
					<ul class="pagination pagination-sm justify-content-center mb-0" id="pagination"></ul>
				</nav>
				<div class="d-flex align-items-center" style="min-width: 130px; justify-content: flex-end;">
					<label class="form-label form-label-sm mb-0 me-2">表示件数</label>
					<select id="pageSizeSelect" class="form-select form-select-sm" style="width: auto;">
						<option value="10" th:selected="${searchForm.pageSize == 10}">10件</option>
						<option value="50" th:selected="${searchForm.pageSize == 50}">50件</option>
						<option value="100" th:selected="${searchForm.pageSize == 100}">100件</option>
					</select>
				</div>
			</div>

			<!-- 一覧テーブル -->
			<div class="card shadow-sm mb-5">
				<div class="table-responsive">
					<table
						class="table table-striped table-hover table-sm align-middle mb-0">
						<thead class="table-primary">
							<tr>
								<th>宛名番号</th>
								<th>氏名/名称</th>
								<th>ふりがな</th>
								<th>法人番号</th>
								<th>郵便番号・住所</th>
								<th>電話番号</th>
								<th></th>
							</tr>
						</thead>
						<tbody>
							<tr th:if="${items.totalElements == 0}">
								<td colspan="7" class="text-center text-muted py-4">該当する宛名が見つかりません</td>
							</tr>
							<tr th:each="item : ${items.content}">
								<td th:text="${item.atena.atenaNo}"></td>
								<td th:text="${item.atena.name}"></td>
								<td class="text-muted" th:text="${item.atena.nameKana}"></td>
								<td th:text="${item.atena.hojinNo}"></td>
								<td>
									<div
										th:text="${item.atena.yubinNo != null ? '〒' + item.atena.yubinNo : ''}"></div>
									<div th:text="${item.atena.jusho}"></div>
								</td>
								<td>
									<div th:text="${item.atena.tel1}"></div>
									<div th:if="${item.atena.tel2}" th:text="${item.atena.tel2}"
										class="text-muted small"></div>
								</td>
								<td><a th:if="${item.manual}"
									th:href="@{/atena/view/{atenaNo}(atenaNo=${item.atena.atenaNo})}"
									class="btn btn-outline-primary btn-sm">照会</a></td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>

		</div>

	</div>
	<th:block layout:fragment="scripts">
		<script>
			document.addEventListener('DOMContentLoaded', () => {
				const rows = Array.from(document.querySelectorAll('tbody tr')).filter(tr => tr.querySelector('td'));
				const pageSizeSelect = document.getElementById('pageSizeSelect');
				const pager = new Pagination(rows, pageSizeSelect, document.getElementById('pagination'));
				if (rows.length > 0) {
					pager.render(1);
					pageSizeSelect?.addEventListener('change', () => pager.render(1));
				}
			});
		</script>
	</th:block>
</body>
</html>
