<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">
<head>
<title>宛名情報取込</title>
</head>
<body>
	<div layout:fragment="content" class="container-fluid p-4">

		<div
			class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
			<h2 class="h2">
				<i class="bi bi-upload me-2 text-primary"></i>宛名情報取込
			</h2>
		</div>

		<div th:if="${successMessage}"
			class="alert alert-success alert-dismissible fade show" role="alert">
			<i class="bi bi-check-circle-fill me-2"></i><span
				th:text="${successMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>
		<div th:if="${errorMessage}"
			class="alert alert-danger alert-dismissible fade show" role="alert">
			<i class="bi bi-exclamation-triangle-fill me-2"></i><span
				th:text="${errorMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>

		<!-- ファイル選択エリア -->
		<div class="card mb-4 shadow-sm">
			<div class="card-header bg-primary text-white py-3">
				<h5 class="mb-0">
					<i class="bi bi-file-earmark-arrow-up me-2"></i>ファイル選択
				</h5>
			</div>
			<div class="card-body bg-light-subtle">
				<form th:action="@{/atena/import}" method="post"
					enctype="multipart/form-data">
					<input type="hidden" th:name="${_csrf.parameterName}"
						th:value="${_csrf.token}">
					<div class="row g-3 align-items-end">
						<div class="col-md-6">
							<label for="file" class="form-label fw-medium"> CSVファイル <span
								class="badge bg-danger ms-1">必須</span>
							</label> <input type="file" class="form-control" id="file" name="file"
								accept=".csv">
						</div>
						<div class="col-md-2">
							<button type="submit" class="btn btn-primary w-100">
								<i class="bi bi-upload me-1"></i>内容取込
							</button>
						</div>
					</div>
				</form>
			</div>
		</div>

		<!-- 取込済みファイル一覧エリア -->
		<div class="card shadow-sm mb-5">
			<div class="card-header bg-secondary text-white py-3">
				<h5 class="mb-0">
					<i class="bi bi-clock-history me-2"></i>取込済みファイル一覧
				</h5>
			</div>
			<div class="table-responsive">
				<table class="table table-striped table-hover align-middle mb-0">
					<thead class="table-secondary">
						<tr>
							<th>ファイル名</th>
							<th>処理日時</th>
							<th>処理件数</th>
							<th>備考</th>
						</tr>
					</thead>
					<tbody>
						<tr th:if="${history.isEmpty()}">
							<td colspan="4" class="text-center text-muted py-4">取込履歴がありません</td>
						</tr>
						<tr th:each="h : ${history}">
							<td th:text="${h.fileName}"></td>
							<td th:text="${#temporals.format(h.shoriDt, 'yyyy/MM/dd HH:mm')}"></td>
							<td th:text="${h.shoriKensu}"></td>
							<td><span th:text="'新規：' + ${h.shinkiKensu} + '件'"></span> <span
								class="ms-2" th:text="'更新：' + ${h.koshinKensu} + '件'"></span></td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>

	</div>
</body>
</html>
