<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">

<head>
<title
	th:text="${mode == 'register' ? '宛名登録' : (mode == 'edit' ? '宛名編集' : '宛名照会')}">宛名</title>
</head>

<body>
	<div layout:fragment="content" class="container-fluid p-4">

		<div
			class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
			<h5 class="mb-0 fw-bold text-dark">
				<i class="bi bi-person-lines-fill me-2 text-primary"></i> <span
					th:text="${mode == 'register' ? '宛名登録' : (mode == 'edit' ? '宛名編集' : '宛名照会')}">宛名</span>
			</h5>
			<div th:if="${mode == 'view'}">
				<a th:href="@{/atena/edit/{atenaNo}(atenaNo=${form.atenaNo})}"
					class="btn btn-sm btn-primary"> <i
					class="bi bi-pencil-square me-1"></i>編集する
				</a>
			</div>
		</div>

		<div
			th:if="${validationErrors != null and !validationErrors.isEmpty()}"
			class="alert alert-danger alert-dismissible fade show" role="alert">
			<i class="bi bi-exclamation-triangle-fill me-2"></i>
			入力内容にエラーがあります。各項目を確認してください。
			<ul class="mb-0 mt-1">
				<li th:each="err : ${validationErrors}" th:text="${err}"
					class="small"></li>
			</ul>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>

		<div th:if="${successMessage}"
			class="alert alert-success alert-dismissible fade show" role="alert">
			<span th:text="${successMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>
		<div th:if="${errorMessage}"
			class="alert alert-danger alert-dismissible fade show" role="alert">
			<span th:text="${errorMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>

		<form id="atenaForm"
			th:action="${mode == 'register'} ? @{/atena/register} : @{/atena/edit/{atenaNo}(atenaNo=${form.atenaNo})}"
			th:object="${form}" method="post">

			<input type="hidden" name="mode" th:value="${mode}">

			<div class="card shadow-sm mb-4">
				<div class="card-header py-3">
					<h5 class="mb-0">
						<i class="bi bi-person-vcard me-2"></i>宛名情報
					</h5>
				</div>
				<div class="card-body bg-light-subtle">
					<div class="row g-3">

						<!-- 宛名番号 -->
						<div class="col-md-4">
							<label for="atenaNo" class="form-label fw-medium">宛名番号</label> <input
								type="text" class="form-control" id="atenaNo"
								th:field="*{atenaNo}" readonly
								th:data-initial-value="*{atenaNo}">
						</div>

						<!-- 個人番号 -->
						<div class="col-md-4">
							<label for="kojinNo" class="form-label fw-medium">個人番号</label> <input
								type="text" class="form-control" id="kojinNo"
								th:field="*{kojinNo}" th:readonly="${mode == 'view'}"
								th:errorclass="is-invalid" th:data-initial-value="*{kojinNo}">
							<div class="invalid-feedback"
								th:if="${#fields.hasErrors('kojinNo')}" th:errors="*{kojinNo}"></div>
						</div>

						<!-- 法人番号 -->
						<div class="col-md-4">
							<label for="hojinNo" class="form-label fw-medium">法人番号</label> <input
								type="text" class="form-control" id="hojinNo"
								th:field="*{hojinNo}" th:readonly="${mode == 'view'}"
								th:errorclass="is-invalid" th:data-initial-value="*{hojinNo}">
							<div class="invalid-feedback"
								th:if="${#fields.hasErrors('hojinNo')}" th:errors="*{hojinNo}"></div>
						</div>

						<!-- 氏名/名称 -->
						<div class="col-md-4">
							<label for="name" class="form-label fw-medium"> 氏名/名称 <span
								class="text-danger" th:if="${mode != 'view'}">*</span>
							</label> <input type="text" class="form-control" id="name"
								th:field="*{name}" th:readonly="${mode == 'view'}"
								th:errorclass="is-invalid" th:data-initial-value="*{name}">
							<div class="invalid-feedback"
								th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
						</div>

						<!-- ふりがな -->
						<div class="col-md-4">
							<label for="nameKana" class="form-label fw-medium">ふりがな</label> <input
								type="text" class="form-control" id="nameKana"
								th:field="*{nameKana}" th:readonly="${mode == 'view'}"
								th:errorclass="is-invalid" placeholder="ひらがなで入力"
								th:data-initial-value="*{nameKana}">
							<div class="invalid-feedback"
								th:if="${#fields.hasErrors('nameKana')}" th:errors="*{nameKana}"></div>
						</div>

						<div class="col-md-4"></div>

						<!-- 郵便番号 -->
						<div class="col-md-4">
							<label for="yubinNo" class="form-label fw-medium">郵便番号</label> <input
								type="text" class="form-control" id="yubinNo"
								th:field="*{yubinNo}" th:readonly="${mode == 'view'}"
								th:errorclass="is-invalid" placeholder="例：123-4567"
								th:data-initial-value="*{yubinNo}">
							<div class="invalid-feedback"
								th:if="${#fields.hasErrors('yubinNo')}" th:errors="*{yubinNo}"></div>
						</div>

						<!-- 住所 -->
						<div class="col-md-4">
							<label for="jusho" class="form-label fw-medium">住所</label> <input
								type="text" class="form-control" id="jusho" th:field="*{jusho}"
								th:readonly="${mode == 'view'}" th:errorclass="is-invalid"
								th:data-initial-value="*{jusho}">
							<div class="invalid-feedback"
								th:if="${#fields.hasErrors('jusho')}" th:errors="*{jusho}"></div>
						</div>

						<div class="col-md-4"></div>

						<!-- 電話番号1 -->
						<div class="col-md-4">
							<label for="tel1" class="form-label fw-medium">電話番号1</label> <input
								type="text" class="form-control" id="tel1" th:field="*{tel1}"
								th:readonly="${mode == 'view'}" th:errorclass="is-invalid"
								placeholder="例：03-1234-5678" th:data-initial-value="*{tel1}">
							<div class="invalid-feedback"
								th:if="${#fields.hasErrors('tel1')}" th:errors="*{tel1}"></div>
						</div>

						<!-- 電話番号2 -->
						<div class="col-md-4">
							<label for="tel2" class="form-label fw-medium">電話番号2</label> <input
								type="text" class="form-control" id="tel2" th:field="*{tel2}"
								th:readonly="${mode == 'view'}" th:errorclass="is-invalid"
								placeholder="例：03-1234-5678" th:data-initial-value="*{tel2}">
							<div class="invalid-feedback"
								th:if="${#fields.hasErrors('tel2')}" th:errors="*{tel2}"></div>
						</div>

					</div>
				</div>
			</div>

			<!-- アクションボタン -->
			<div class="d-flex justify-content-center gap-3 py-4 mb-5">

				<button type="submit" form="atenaForm"
					class="btn btn-success btn-lg px-5" th:if="${mode == 'register'}">
					<i class="bi bi-save me-2"></i>登録する
				</button>

				<button type="submit" form="atenaForm"
					class="btn btn-success btn-lg px-5" th:if="${mode == 'edit'}">
					<i class="bi bi-pencil-square me-2"></i>更新する
				</button>

				<a th:href="@{/atena/edit/{atenaNo}(atenaNo=${form.atenaNo})}"
					class="btn btn-primary btn-lg px-5" th:if="${mode == 'view'}">
					<i class="bi bi-pencil-square me-2"></i>編集する
				</a> <a th:href="@{/atena/search}"
					class="btn btn-outline-secondary btn-lg px-4"
					th:onclick="${mode != 'view'} ? 'return confirm(\'入力内容は破棄されます。よろしいですか？\')' : 'return true'">
					<i class="bi bi-arrow-left me-2"></i>一覧に戻る
				</a>

			</div>

		</form>

	</div>
</body>
</html>
