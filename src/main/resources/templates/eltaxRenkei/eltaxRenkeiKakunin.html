<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">

<head>
	<title>髮ｻ蟄千筏蜻頑ュ蝣ｱ蜿冶ｾｼ遒ｺ隱・/title>
</head>

<body>
	<div layout:fragment="content" class="container-fluid p-4">

		<div
			class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
			<h5 class="mb-0 fw-bold text-dark">
				<i class="bi bi-file-earmark-check me-2 text-primary"></i> 髮ｻ蟄千筏蜻頑ュ蝣ｱ蜿冶ｾｼ遒ｺ隱・
			</h5>
		</div>

		<!-- 譁ｽ險ｭ諠・ｱ繧ｨ繝ｪ繧｢ -->
		<div class="card shadow-sm mb-4">
			<div class="card-header fw-bold">譁ｽ險ｭ諠・ｱ</div>
			<div class="card-body">
				<div class="row g-3">
					<div class="col-md-3">
						<label class="form-label text-muted small">謖・ｮ夂分蜿ｷ</label>
						<input type="text" class="form-control" readonly th:value="${kakuninDto.shiteiNo}">
					</div>
					<div class="col-md-9">
						<label class="form-label text-muted small">譁ｽ險ｭ蜷咲ｧｰ</label>
						<input type="text" class="form-control" readonly th:value="${kakuninDto.shisetsuName}">
					</div>
					<div class="col-md-12">
						<label class="form-label text-muted small">譁ｽ險ｭ菴乗園</label>
						<input type="text" class="form-control" readonly th:value="${kakuninDto.shisetsuJusho}">
					</div>
					<div class="col-md-6">
						<label class="form-label text-muted small">迚ｹ蛻･蠕ｴ蜿守ｾｩ蜍呵・錐遘ｰ</label>
						<input type="text" id="tokugimuNameText" class="form-control" readonly
							th:value="${kakuninDto.atenaName}">
					</div>
					<div class="col-md-6">
						<label class="form-label text-muted small">迚ｹ蛻･蠕ｴ蜿守ｾｩ蜍呵・ｽ乗園</label>
						<input type="text" id="tokugimuJushoText" class="form-control" readonly
							th:value="${kakuninDto.atenaJusho}">
					</div>
				</div>
			</div>
		</div>

		<!-- 蜿冶ｾｼ繝輔ぃ繧､繝ｫ諠・ｱ繧ｨ繝ｪ繧｢ -->
		<div class="card shadow-sm mb-4">
			<div class="card-header fw-bold">
				蜿冶ｾｼ繝輔ぃ繧､繝ｫ諠・ｱ
				<span class="ms-3 text-muted small" th:text="${kakuninDto.fileName}"></span>
				<span class="ms-2 badge bg-secondary" th:text="${kakuninDto.shubetsuName}"></span>
			</div>
			<div class="card-body p-0">
				<table class="table table-hover mb-0">
					<thead class="table-light">
						<tr>
							<th style="width:30%">鬆・岼蜷・/th>
							<th style="width:35%">譖ｴ譁ｰ蜑肴ュ蝣ｱ</th>
							<th style="width:35%">蜿冶ｾｼ諠・ｱ</th>
						</tr>
					</thead>
					<tbody>
						<tr th:if="${#lists.isEmpty(kakuninDto.diffRows)}">
							<td colspan="3" class="text-center p-3">蜿冶ｾｼ繝・・繧ｿ縺後≠繧翫∪縺帙ｓ</td>
						</tr>
						<tr th:each="row : ${kakuninDto.diffRows}"
							th:classappend="${row.beforeValue != row.afterValue and !#strings.isEmpty(row.beforeValue)} ? 'table-warning' : ''">
							<td th:text="${row.itemName}"></td>
							<td th:text="${row.beforeValue}"></td>
							<td>
								<span th:text="${row.afterValue}"
									th:classappend="${row.beforeValue != row.afterValue and !#strings.isEmpty(row.beforeValue)} ? 'fw-bold text-danger' : ''">
								</span>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>

		<!-- 繧｢繧ｯ繧ｷ繝ｧ繝ｳ繝懊ち繝ｳ -->
		<div class="d-flex gap-2">
			<a th:href="@{/eltax-renkei}" class="btn btn-secondary">
				<i class="bi bi-arrow-left me-1"></i>謌ｻ繧・
			</a>
			<form id="commitForm" th:action="@{/eltax-renkei/kakunin/commit}" method="post">
				<input type="hidden" id="commitAtenaNo" name="atenaNo" value="">
				<button type="button" id="commitBtn" class="btn btn-primary">
					<i class="bi bi-upload me-1"></i>蜿冶ｾｼ
				</button>
			</form>
		</div>

		<!-- 繧ｵ繝ｼ繝舌・蛟､蜿励￠貂｡縺礼畑繝｡繧ｿ隕∫ｴ -->
		<span id="kakuninMeta" class="d-none" th:data-atena-search-required="${kakuninDto.atenaSearchRequired}"
			th:data-tokugimu-name="${kakuninDto.tokugimuName}" th:data-tokugimu-jusho="${kakuninDto.tokugimuJusho}"
			th:data-tokugimu-tel="${kakuninDto.tokugimuTel}" th:data-kojin-no="${kakuninDto.kojinNo}"
			th:data-hojin-no="${kakuninDto.hojinNo}">
		</span>

		<!-- 螳帛錐讀懃ｴ｢繝｢繝ｼ繝繝ｫ -->
		<div th:replace="~{layout/components :: addressSearchModal}"></div>

	</div>
</body>

<th:block layout:fragment="scripts">
	<script th:src="@{/js/eltaxRenkeiKakunin.js}"></script>
</th:block>

</html>
