<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">
<head>
<title th:text="${mode == 'register' ? '指定番号・合算指定番号設定登録' : (mode == 'edit' ? '指定番号・合算指定番号設定編集' : '指定番号・合算指定番号設定照会')}">指定番号・合算指定番号設定</title>
</head>
<body>
	<div layout:fragment="content" class="container-fluid p-4">

		<div
			class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
			<h5 class="mb-0 fw-bold text-dark">
				<i class="bi bi-sliders me-2 text-primary"></i>
				<span th:text="${mode == 'register' ? '指定番号・合算指定番号設定登録' : (mode == 'edit' ? '指定番号・合算指定番号設定編集' : '指定番号・合算指定番号設定照会')}">指定番号・合算指定番号設定</span>
			</h5>
			<div th:if="${mode == 'view'}">
				<a th:href="@{/admin/shitei-gassan/edit}" class="btn btn-sm btn-primary">
					<i class="bi bi-pencil-square me-1"></i>編集する
				</a>
			</div>
		</div>

		<!-- メッセージ表示 -->
		<div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
			<span th:text="${successMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>
		<div th:if="${infoMessage}" class="alert alert-info alert-dismissible fade show" role="alert">
			<span th:text="${infoMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>
		<div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
			<span th:text="${errorMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>

		<div class="card shadow-sm">
			<div class="card-body">
				<form th:action="@{/admin/shitei-gassan/save}" method="post" th:object="${configDto}">
					<input type="hidden" th:field="*{version}">

					<div class="row mb-3">
						<div class="col-md-4">
							<label for="shiteiStChar" class="form-label">指定番号</label>
							<input type="text" class="form-control"
								th:field="*{shiteiStChar}" id="shiteiStChar"
								maxlength="3" placeholder="例：001"
								th:readonly="${mode == 'view'}">
							<div th:if="${#fields.hasErrors('shiteiStChar')}" class="text-danger small mt-1">
								<span th:errors="*{shiteiStChar}"></span>
							</div>
						</div>
					</div>

					<div class="row mb-3">
						<div class="col-md-4">
							<label for="gassanStChar" class="form-label">合算指定番号</label>
							<input type="text" class="form-control"
								th:field="*{gassanStChar}" id="gassanStChar"
								maxlength="3" placeholder="例：001"
								th:readonly="${mode == 'view'}">
							<div th:if="${#fields.hasErrors('gassanStChar')}" class="text-danger small mt-1">
								<span th:errors="*{gassanStChar}"></span>
							</div>
						</div>
					</div>

					<div class="d-flex justify-content-end gap-2" th:if="${mode == 'edit'}">
						<a th:href="@{/admin/shitei-gassan/view}" class="btn btn-outline-secondary">
							<i class="bi bi-arrow-left me-1"></i>照会に戻る
						</a>
						<button type="submit" class="btn btn-primary">
							<i class="bi bi-check-circle me-1"></i>
							<span th:text="${mode == 'register' ? '登録する' : '更新する'}">保存</span>
						</button>
					</div>
				</form>
			</div>
		</div>

	</div>
</body>
</html>
