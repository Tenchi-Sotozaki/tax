<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">
<head>
<title>金融機関コード取込</title>
</head>
<body>
	<div layout:fragment="content" class="container-fluid p-4">

		<div
			class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
			<h5 class="mb-0 fw-bold text-dark">
				<i class="bi bi-bank me-2 text-primary"></i>金融機関コード取込
			</h5>
		</div>

		<!-- メッセージ表示 -->
		<div th:if="${successMessage}"
			class="alert alert-success alert-dismissible fade show" role="alert">
			<span th:text="${successMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>
		<div th:if="${errorMessage}"
			class="alert alert-danger alert-dismissible fade show" role="alert">
			<i class="bi bi-exclamation-triangle-fill me-2"></i><span
				th:text="${errorMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>

		<!-- 取込エリア -->
		<div class="card shadow-sm mb-4">
			<div class="card-header">
				<h6 class="mb-0">
					<i class="bi bi-upload me-2"></i>zipファイルの取込
				</h6>
			</div>
			<div class="card-body">
				<form th:action="@{/admin/bank-import/upload}" method="post"
					enctype="multipart/form-data" id="bankImportForm">
					<input type="hidden" th:name="${_csrf.parameterName}"
						th:value="${_csrf.token}" />

					<div class="row g-3 align-items-end">
						<div class="col-md-6">
							<label for="file" class="form-label fw-medium">ZenginCode のzipファイル <span
								class="text-danger">*</span></label> <input type="file" class="form-control"
								id="file" name="file" accept=".zip" required>
						</div>
					</div>

					<div class="alert alert-secondary mt-3 mb-0 small">
						<i class="bi bi-info-circle me-1"></i>
						<a href="https://github.com/zengin-code/source-data" target="_blank"
							rel="noopener">ZenginCode</a> の「Code」→「Download ZIP」で取得したファイルを、解凍せずそのまま選択してください。
						<br>取込を実行すると、金融機関マスタ・支店マスタの既存データはすべて置き換わります。
						<br>金融機関マスタに存在しない金融機関コードの支店は取り込みません。
					</div>

					<div class="d-flex justify-content-center gap-2 mt-4">
						<button type="submit" class="btn btn-primary" id="importButton">
							<i class="bi bi-upload me-1"></i> 取込
						</button>
					</div>
				</form>
			</div>
		</div>

		<!-- 取込結果 -->
		<div class="card shadow-sm" th:if="${result != null}">
			<div class="card-header">
				<h6 class="mb-0">
					<i class="bi bi-list-check me-2"></i>取込結果
				</h6>
			</div>
			<div class="card-body">
				<table class="table table-sm table-bordered mb-0" style="max-width: 480px;">
					<tbody>
						<tr>
							<th class="table-light" style="width: 60%;">金融機関 取込件数</th>
							<td class="text-end" th:text="${result.bankCount} + ' 件'"></td>
						</tr>
						<tr>
							<th class="table-light">支店 取込件数</th>
							<td class="text-end" th:text="${result.branchCount} + ' 件'"></td>
						</tr>
						<tr>
							<th class="table-light">スキップした金融機関コード数</th>
							<td class="text-end" th:text="${result.skippedBankCount} + ' 件'"></td>
						</tr>
						<tr>
							<th class="table-light">スキップした支店件数</th>
							<td class="text-end" th:text="${result.skippedBranchCount} + ' 件'"></td>
						</tr>
						<tr>
							<th class="table-light">取り込んだデータの版（updated_at）</th>
							<td class="text-end" th:text="${result.updatedAt}"></td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>

	</div>

	<th:block layout:fragment="scripts">
		<script th:src="@{/js/bankImport.js}"></script>
	</th:block>
</body>
</html>
