<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">
<head>
<title>自治体情報設定</title>
</head>
<body>
	<div layout:fragment="content" class="container-fluid p-4">

		<div
			class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
			<h5 class="mb-0 fw-bold text-dark">
				<i class="bi bi-building me-2 text-primary"></i>自治体情報設定
			</h5>
		</div>

		<!-- メッセージ表示 -->
		<div th:if="${validationErrors != null and !validationErrors.isEmpty()}" class="alert alert-danger alert-dismissible fade show" role="alert">
			<i class="bi bi-exclamation-triangle-fill me-2"></i> 入力内容に <span th:text="${validationErrors.size()}"></span> 件のエラーがあります。
			<ul class="mb-0 mt-1">
				<li th:each="err : ${validationErrors}" th:text="${err}" class="small"></li>
			</ul>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>
		<div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
			<span th:text="${successMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>
		<div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
			<span th:text="${errorMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>

		<form th:action="@{/admin/jichitai-config/save}" method="post" th:object="${configForm}" novalidate>
			
			<!-- 自治体情報エリア -->
			<div class="card shadow-sm mb-4">
				<div class="card-header">
					<h6 class="mb-0"><i class="bi bi-info-circle me-2"></i>自治体情報</h6>
				</div>
				<div class="card-body">
					<div class="row g-3">
						<div class="col-md-3">
							<label for="jichitaiCd" class="form-label fw-medium">自治体コード <span class="text-danger">*</span></label>
							<input type="text" id="jichitaiCd" th:field="*{jichitaiCd}" class="form-control"
								th:classappend="${#fields.hasErrors('jichitaiCd')} ? 'is-invalid' : ''"
								maxlength="5">
							<div class="invalid-feedback" th:if="${#fields.hasErrors('jichitaiCd')}" th:errors="*{jichitaiCd}"></div>
						</div>
						<div class="col-md-3">
							<label for="name" class="form-label fw-medium">自治体名称 <span class="text-danger">*</span></label>
							<input type="text" id="name" th:field="*{name}" class="form-control"
								th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
								maxlength="20">
							<div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
						</div>
						<div class="col-md-3">
							<label for="kbnName" class="form-label fw-medium">自治体種別名 <span class="text-danger">*</span></label>
							<input type="text" id="kbnName" th:field="*{kbnName}" class="form-control"
								th:classappend="${#fields.hasErrors('kbnName')} ? 'is-invalid' : ''"
								maxlength="10">
							<div class="invalid-feedback" th:if="${#fields.hasErrors('kbnName')}" th:errors="*{kbnName}"></div>
						</div>						
						<div class="col-md-3">
						    <label for="param" class="form-label fw-medium">自治体識別名<span class="text-danger">*</span></label>
						    <input type="text" id="param" th:field="*{param}" class="form-control" 
								th:classappend="${#fields.hasErrors('param')} ? 'is-invalid' : ''" 
								maxlength="10">
						    <div class="invalid-feedback" th:if="${#fields.hasErrors('param')}" th:errors="*{param}">
						    </div>
						</div>						
					</div>
				</div>
			</div>

			<!-- 納税関連情報エリア -->
			<div class="card shadow-sm mb-4">
				<div class="card-header">
					<h6 class="mb-0"><i class="bi bi-calendar me-2"></i>納税関連情報</h6>
				</div>
				<div class="card-body">
					<div class="row g-3">
						<div class="col-md-3">
							<label for="nendoStMonth" class="form-label fw-medium">年度開始月 <span class="text-danger">*</span></label>
							<select id="nendoStMonth"
							        th:field="*{nendoStMonth}"
							        class="form-select">

							    <option value="">選択してください</option>

							    <option th:each="m : ${#numbers.sequence(1,12)}"
							            th:value="${m}"
							            th:text="${m + '月'}"
							            th:selected="${nendoStMonth == #strings.toString(m)}">
							    </option>

							</select>
							<div class="invalid-feedback" th:if="${#fields.hasErrors('nendoStMonth')}" th:errors="*{nendoStMonth}"></div>
						</div>
						<div class="col-md-3">
							<label for="nozeiShuki" class="form-label fw-medium">デフォルト納税周期 <span class="text-danger">*</span></label>
							<select id="nozeiShuki" th:field="*{nozeiShuki}" class="form-select"
								th:classappend="${#fields.hasErrors('nozeiShuki')} ? 'is-invalid' : ''">
								<option value="">選択してください</option>
								<option value="1">毎月</option>
								<option value="3">3ヶ月</option>
							</select>
							<div class="invalid-feedback" th:if="${#fields.hasErrors('nozeiShuki')}" th:errors="*{nozeiShuki}"></div>
						</div>
					</div>
				</div>
			</div>

			<!-- 採番情報エリア -->
			<div class="card shadow-sm mb-4">
				<div class="card-header">
					<h6 class="mb-0"><i class="bi bi-hash me-2"></i>採番情報</h6>
				</div>
				<div class="card-body">
					<div class="row g-3">
						<div class="col-md-3">
							<label for="shiteiStChar" class="form-label fw-medium">指定番号 <span class="text-danger">*</span></label>
							<input type="text" id="shiteiStChar" th:field="*{shiteiStChar}" class="form-control"
								th:classappend="${#fields.hasErrors('shiteiStChar')} ? 'is-invalid' : ''"
								maxlength="3" placeholder="例：001">
							<div class="invalid-feedback" th:if="${#fields.hasErrors('shiteiStChar')}" th:errors="*{shiteiStChar}"></div>
						</div>
						<div class="col-md-3">
							<label for="gassanStChar" class="form-label fw-medium">合算指定番号 <span class="text-danger">*</span></label>
							<input type="text" id="gassanStChar" th:field="*{gassanStChar}" class="form-control"
								th:classappend="${#fields.hasErrors('gassanStChar')} ? 'is-invalid' : ''"
								maxlength="3" placeholder="例：001">
							<div class="invalid-feedback" th:if="${#fields.hasErrors('gassanStChar')}" th:errors="*{gassanStChar}"></div>
						</div>
						<div class="col-md-3">
							<label for="atenaStNo" class="form-label fw-medium">宛名番号 <span class="text-danger">*</span></label>
							<input type="text" id="atenaStNo" th:field="*{atenaStNo}" class="form-control"
								th:classappend="${#fields.hasErrors('atenaStNo')} ? 'is-invalid' : ''"
								placeholder="例：1">
							<div class="invalid-feedback" th:if="${#fields.hasErrors('atenaStNo')}" th:errors="*{atenaStNo}"></div>
						</div>
					</div>
				</div>
			</div>

			<!-- ボタンエリア -->
			<div class="d-flex justify-content-center">
				<button type="submit" class="btn btn-success px-5">
					<i class="bi bi-check-circle me-1"></i>登録する
				</button>
			</div>

		</form>

	</div>
</body>
</html>
