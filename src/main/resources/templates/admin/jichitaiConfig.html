<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">
<head>
<title>自治体情報設定</title>
</head>
<body>
	<div layout:fragment="content" class="container-fluid p-4">

		<div
			class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
			<h5 class="mb-0 fw-bold text-dark">
				<i class="bi bi-building me-2 text-primary"></i>自治体情報設定
			</h5>
		</div>

		<!-- メッセージ表示 -->
		<div th:if="${validationErrors != null and !validationErrors.isEmpty()}" class="alert alert-danger alert-dismissible fade show" role="alert">
			<i class="bi bi-exclamation-triangle-fill me-2"></i> 入力内容に <span th:text="${validationErrors.size()}"></span> 件のエラーがあります。
			<ul class="mb-0 mt-1">
				<li th:each="err : ${validationErrors}" th:text="${err}" class="small"></li>
			</ul>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>
		<div th:if="${successMessage}"
			class="alert alert-success alert-dismissible fade show" role="alert">
			<span th:text="${successMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>
		<div th:if="${errorMessage}"
			class="alert alert-danger alert-dismissible fade show" role="alert">
			<span th:text="${errorMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>

		<!-- 自治体情報 -->
		<div class="card shadow-sm mb-4">
			<div class="card-header">
				<h6 class="mb-0"><i class="bi bi-info-circle me-2"></i>自治体情報</h6>
			</div>
			<div class="card-body">
				<div class="row g-3">
					<div class="col-md-3">
						<label class="form-label fw-medium">自治体コード</label>
						<div class="form-control-plaintext" th:text="${jichitai.jichitaiCd}"></div>
					</div>
					<div class="col-md-3">
						<label class="form-label fw-medium">自治体名称</label>
						<div class="form-control-plaintext" th:text="${jichitai.name}"></div>
					</div>
					<div class="col-md-3">
						<label class="form-label fw-medium">自治体種別名</label>
						<div class="form-control-plaintext" th:text="${jichitai.kbnName}"></div>
					</div>
				</div>
			</div>
		</div>

		<!-- 年度開始月設定フォーム -->
		<div class="card shadow-sm">
			<div class="card-header">
				<h6 class="mb-0"><i class="bi bi-calendar me-2"></i>年度開始月設定</h6>
			</div>
			<div class="card-body">
				<form th:action="@{/admin/jichitai-config/save}" method="post"
					th:object="${configForm}" novalidate>
					<div class="row g-3 align-items-end">
						<div class="col-md-3">
							<label for="nendoStMonth" class="form-label">年度開始月 <span class="text-danger">*</span></label>
							<select id="nendoStMonth" th:field="*{nendoStMonth}"
								th:classappend="${#fields.hasErrors('nendoStMonth')} ? 'is-invalid' : ''"
								class="form-select">
								<option value="">選択してください</option>
								<option th:each="m : ${#numbers.sequence(1, 12)}"
									th:value="${m}"
									th:text="${m + '月'}">
								</option>
							</select>
							<div class="invalid-feedback" th:if="${#fields.hasErrors('nendoStMonth')}"
								th:errors="*{nendoStMonth}"></div>

						</div>
						<div class="col-md-2">
							<button type="submit" class="btn btn-primary">
								<i class="bi bi-check-circle me-1"></i>保存する
							</button>
						</div>
					</div>
				</form>
			</div>
		</div>

	</div>
</body>
</html>
