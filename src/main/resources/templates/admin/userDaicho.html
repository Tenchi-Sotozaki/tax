<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">
<head>
<title>ユーザー管理台帳</title>
</head>
<body>
	<div layout:fragment="content" class="container-fluid p-4">

		<div
			class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
			<h5 class="mb-0 fw-bold text-dark">
				<i class="bi bi-person-search me-2 text-primary"></i>ユーザー管理台帳
			</h5>
		</div>

		<div th:if="${successMessage}"
			class="alert alert-success alert-dismissible fade show" role="alert">
			<i class="bi bi-check-circle-fill me-2"></i> <span
				th:text="${successMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>

		<div th:if="${errorMessage}"
			class="alert alert-danger alert-dismissible fade show" role="alert">
			<i class="bi bi-exclamation-triangle-fill me-2"></i> <span
				th:text="${errorMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>

		<!-- ======== 抽出条件アコーディオン ======== -->
		<div class="accordion mb-3 shadow-sm" id="searchAccordion">
			<div class="accordion-item border">
				<h2 class="accordion-header">
					<button class="accordion-button py-2 fw-semibold" type="button"
						data-bs-toggle="collapse" data-bs-target="#searchPanel">
						<i class="bi bi-funnel me-2"></i>抽出条件
					</button>
				</h2>
			</div>
			<div id="searchPanel" class="accordion-collapse collapse show">
				<div class="accordion-body pt-3 pb-2 px-3">
					<form th:action="@{/admin/user-search}"
						th:object="${userSearchForm}" method="get">
						<div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-2 mb-2">
							<div class="col">
								<label class="form-label form-label-sm fw-medium mb-1">ID</label>
								<input type="text" class="form-control form-control-sm"
									th:field="*{id}" placeholder="IDを入力">
							</div>
							<div class="col">
								<div class="d-flex align-items-center gap-2 mb-1" style="white-space: nowrap;">
									<label class="form-label form-label-sm fw-medium mb-0">氏名</label>
									<div class="form-check form-check-inline me-0">
										<input class="form-check-input" type="radio" th:field="*{nameMatchType}" value="prefix" id="namePrefix">
										<label class="form-check-label small" for="namePrefix">前方</label>
									</div>
									<div class="form-check form-check-inline me-0">
										<input class="form-check-input" type="radio" th:field="*{nameMatchType}" value="partial" id="namePartial">
										<label class="form-check-label small" for="namePartial">部分</label>
									</div>
									<div class="form-check form-check-inline me-0">
										<input class="form-check-input" type="radio" th:field="*{nameMatchType}" value="exact" id="nameExact">
										<label class="form-check-label small" for="nameExact">完全</label>
									</div>
								</div>
								<input type="text" class="form-control form-control-sm"
									th:field="*{name}" placeholder="氏名を入力">
							</div>
							<div class="col">
								<div class="d-flex align-items-center gap-2 mb-1" style="white-space: nowrap;">
									<label class="form-label form-label-sm fw-medium mb-0">ふりがな</label>
									<div class="form-check form-check-inline me-0">
										<input class="form-check-input" type="radio" th:field="*{nameKanaMatchType}" value="prefix" id="nameKanaPrefix">
										<label class="form-check-label small" for="nameKanaPrefix">前方</label>
									</div>
									<div class="form-check form-check-inline me-0">
										<input class="form-check-input" type="radio" th:field="*{nameKanaMatchType}" value="partial" id="nameKanaPartial">
										<label class="form-check-label small" for="nameKanaPartial">部分</label>
									</div>
									<div class="form-check form-check-inline me-0">
										<input class="form-check-input" type="radio" th:field="*{nameKanaMatchType}" value="exact" id="nameKanaExact">
										<label class="form-check-label small" for="nameKanaExact">完全</label>
									</div>
								</div>
								<input type="text" class="form-control form-control-sm"
									th:field="*{nameKana}" placeholder="ふりがなを入力">
							</div>
							<div class="col">
								<div class="d-flex align-items-center gap-2 mb-1" style="white-space: nowrap;">
									<label class="form-label form-label-sm fw-medium mb-0">部署</label>
									<div class="form-check form-check-inline me-0">
										<input class="form-check-input" type="radio" th:field="*{bushoMatchType}" value="prefix" id="bushoPrefix">
										<label class="form-check-label small" for="bushoPrefix">前方</label>
									</div>
									<div class="form-check form-check-inline me-0">
										<input class="form-check-input" type="radio" th:field="*{bushoMatchType}" value="partial" id="bushoPartial">
										<label class="form-check-label small" for="bushoPartial">部分</label>
									</div>
									<div class="form-check form-check-inline me-0">
										<input class="form-check-input" type="radio" th:field="*{bushoMatchType}" value="exact" id="bushoExact">
										<label class="form-check-label small" for="bushoExact">完全</label>
									</div>
								</div>
								<input type="text" class="form-control form-control-sm"
									th:field="*{busho}" placeholder="部署を入力">
							</div>
						</div>
						<div class="d-flex justify-content-end gap-2 pt-1 border-top">
							<a th:href="@{/admin/user-search}"
								class="btn btn-outline-secondary btn-sm"> <i
								class="bi bi-arrow-counterclockwise me-1"></i>クリア
							</a>
							<button type="submit" class="btn btn-primary btn-sm px-4">
								<i class="bi bi-search me-1"></i>検索する
							</button>
						</div>
					</form>
				</div>
			</div>
		</div>


		<!-- 操作ボタン＆件数 -->
		<div class="d-flex justify-content-between align-items-center mb-2">
			<div class="d-flex gap-2">
				<a th:href="@{/admin/user-registration}" class="btn btn-success">
					<i class="bi bi-person-plus me-1"></i>ユーザー登録
				</a>
				<button type="button" id="editBtn" class="btn btn-primary" disabled
					onclick="goToEdit()">
					<i class="bi bi-pencil-square me-1"></i>ユーザー編集
				</button>
				<button type="button" id="deleteBtn" class="btn btn-danger" disabled
					onclick="confirmDelete()">
					<i class="bi bi-trash me-1"></i>削除
				</button>
			</div>
			<span class="text-muted small">検索結果：<span
				th:text="${items.size()}">0</span> 件
			</span>
		</div>

		<!-- 削除用フォーム -->
		<form id="deleteForm" th:action="@{/admin/user-delete-batch}" method="post" style="display:none;"></form>

		<!-- 削除確認モーダル -->
		<div th:replace="~{layout/components :: confirmModal('deleteModal','削除確認','選択したユーザーを削除します。よろしいですか？','deleteForm','btn-danger','削除する')}"></div>

		<!-- 一覧テーブル -->
		<div class="card shadow-sm mb-5">
			<div class="table-responsive">
				<table class="table table-striped table-hover align-middle mb-0">
					<thead class="table-primary">
						<tr>
							<th style="width: 40px;"></th>
							<th style="width: 160px;">ID</th>
							<th style="width: 180px;">氏名</th>
							<th style="width: 180px;">ふりがな</th>
							<th style="width: 180px">部署</th>
							<th style="width: 180px;">権限</th>
						</tr>
					</thead>
					<tbody>
						<tr th:if="${items.isEmpty()}">
							<td colspan="6" class="text-center text-muted py-4">該当するユーザーが見つかりません</td>
						</tr>
						<tr th:each="user : ${items}">
							<td><input type="checkbox"
								class="form-check-input user-checkbox" th:value="${user.id}"></td>
							<td th:text="${user.id}"></td>
							<td th:text="${user.name}"></td>
							<td class="text-muted" th:text="${user.nameKana}"></td>
							<td th:text="${user.busho}"></td>
							<td th:text="${roleMap[user.roleId.toString()]}"></td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>

	</div>

	<th:block layout:fragment="scripts">
		<script th:inline="javascript">
    const editBasePath = /*[[@{/admin/user-edit/}]]*/ '/admin/user-edit/';
</script>
		<script th:src="@{/js/userDaicho.js}"></script>
	</th:block>
</body>
</html>
