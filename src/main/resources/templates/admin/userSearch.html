<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">
<head>
<title>ユーザー検索</title>
</head>
<body>
	<div layout:fragment="content" class="container-fluid p-4">

		<div
			class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
			<h2 class="h2">
				<i class="bi bi-person-search me-2 text-primary"></i>ユーザー検索
			</h2>
		</div>

		<div th:if="${successMessage}"
			class="alert alert-success alert-dismissible fade show" role="alert">
			<i class="bi bi-check-circle-fill me-2"></i> <span
				th:text="${successMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>

		<!-- 検索条件エリア -->
		<div class="card mb-4 shadow-sm">
			<div class="card-header bg-primary text-white py-3">
				<h5 class="mb-0">
					<i class="bi bi-funnel me-2"></i>検索条件
				</h5>
			</div>
			<div class="card-body bg-light-subtle">
				<form th:action="@{/admin/user-search}"
					th:object="${userSearchForm}" method="get">
					<div class="row g-3 align-items-end">
						<div class="col-md-3">
							<label for="id" class="form-label fw-medium">ID</label> <input
								type="text" class="form-control" id="id" th:field="*{id}"
								placeholder="IDを入力">
						</div>
						<div class="col-md-3">
							<label for="name" class="form-label fw-medium">氏名</label> <input
								type="text" class="form-control" id="name" th:field="*{name}"
								placeholder="氏名を入力">
						</div>
						<div class="col-md-3">
							<label for="nameKana" class="form-label fw-medium">ふりがな</label> <input
								type="text" class="form-control" id="nameKana"
								th:field="*{nameKana}" placeholder="ふりがなを入力">
						</div>
						<div class="col-md-3">
							<label for="busho" class="form-label fw-medium">部署</label> <input
								type="text" class="form-control" id="busho" th:field="*{busho}"
								placeholder="部署を入力">
						</div>
						<div class="col-md-12 d-flex gap-2">
							<button type="submit" class="btn btn-primary">
								<i class="bi bi-search me-1"></i>検索する
							</button>
							<a th:href="@{/admin/user-search}"
								class="btn btn-outline-secondary"> <i
								class="bi bi-arrow-counterclockwise me-1"></i>クリア
							</a>
						</div>
					</div>
				</form>
			</div>
		</div>

		<!-- 操作ボタン＆件数 -->
		<div class="d-flex justify-content-between align-items-center mb-2">
			<div class="d-flex gap-2">
				<a th:href="@{/admin/user-registration}" class="btn btn-success">
					<i class="bi bi-person-plus me-1"></i>ユーザー登録
				</a>
				<button type="button" id="editBtn" class="btn btn-primary" disabled
					onclick="goToEdit()">
					<i class="bi bi-pencil-square me-1"></i>ユーザー編集
				</button>
			</div>
			<span class="text-muted small">検索結果：<span
				th:text="${items.size()}">0</span> 件
			</span>
		</div>

		<!-- 一覧テーブル -->
		<div class="card shadow-sm mb-5">
			<div class="table-responsive">
				<table class="table table-striped table-hover align-middle mb-0">
					<thead class="table-primary">
						<tr>
							<th style="width: 40px;"></th>
							<th style="width: 160px;">ID</th>
							<th style="width: 160px;">氏名</th>
							<th style="width: 180px;">ふりがな</th>
							<th>部署</th>
						</tr>
					</thead>
					<tbody>
						<tr th:if="${items.isEmpty()}">
							<td colspan="5" class="text-center text-muted py-4">該当するユーザーが見つかりません</td>
						</tr>
						<tr th:each="user : ${items}">
							<td><input type="checkbox" class="form-check-input user-checkbox"
								th:value="${user.id}"></td>
							<td th:text="${user.id}"></td>
							<td th:text="${user.name}"></td>
							<td class="text-muted" th:text="${user.nameKana}"></td>
							<td th:text="${user.busho}"></td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>

	</div>

<th:block layout:fragment="scripts">
<script th:inline="javascript">
    const editBasePath = /*[[@{/admin/user-edit/}]]*/ '/admin/user-edit/';

    document.querySelectorAll('.user-checkbox').forEach(cb => {
        cb.addEventListener('change', function () {
            document.querySelectorAll('.user-checkbox').forEach(other => {
                if (other !== this) other.checked = false;
            });
            document.getElementById('editBtn').disabled =
                !document.querySelector('.user-checkbox:checked');
        });
    });

    function goToEdit() {
        const checked = document.querySelector('.user-checkbox:checked');
        if (!checked) return;
        location.href = editBasePath + encodeURIComponent(checked.value);
    }
</script>
</th:block>
</body>
</html>
