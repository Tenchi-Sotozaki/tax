<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">

<head>
	<title th:text="${mode == 'register' ? '納入期限登録' : (mode == 'edit' ? '納入期限編集' : '納入期限照会')}">納入期限設定</title>
</head>

<body>
	<div layout:fragment="content" class="container-fluid p-4" th:data-is-edit="${mode == 'edit'}">

		<div
			class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
			<h5 class="mb-0 fw-bold text-dark">
				<i class="bi bi-calendar-check me-2 text-primary"></i> <span
					th:text="${mode == 'register' ? '納入期限登録' : (mode == 'edit' ? '納入期限編集' : '納入期限照会')}">納入期限設定</span>
			</h5>
			<div th:if="${mode == 'view'}" class="d-flex align-items-center gap-2">
				<a th:href="@{/admin/nokigen/edit/{nendo}(nendo=${nokigen.nendo})}" class="btn btn-primary text-nowrap">
					<i class="bi bi-pencil-square me-1"></i>編集する
				</a>
			</div>
		</div>
		<div th:if="${validationErrors != null and !validationErrors.isEmpty()}"
			class="alert alert-danger alert-dismissible fade show" role="alert">
			<i class="bi bi-exclamation-triangle-fill me-2"></i> 入力内容に <span
				th:text="${validationErrors.size()}"></span> 件のエラーがあります。
			<ul class="mb-0 mt-1">
				<li th:each="err : ${validationErrors}" th:text="${err}" class="small"></li>
			</ul>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>

		<!-- メッセージ表示 -->
		<div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
			<span th:text="${successMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>

		<!-- エラーメッセージ -->
		<div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
			<span th:text="${errorMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>

		<div th:if="${warnMessage}" class="alert alert-warning alert-dismissible fade show" role="alert">
			<span th:text="${warnMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>

		<!-- 入力フォーム -->
		<div class="card shadow-sm">
			<div class="card-body">
				<form id="nokigenForm" th:action="@{/admin/nokigen/save}" method="post" th:object="${nokigen}" novalidate>
					<input type="hidden" th:field="*{addDt}"> 
					<input type="hidden" th:field="*{addUser}">
					<input type="hidden" th:field="*{updDt}">
					<input type="hidden" th:field="*{updUser}"> 
					<input type="hidden" th:field="*{version}">
					<input type="hidden" name="mode" th:value="${mode}">
					<div class="row mb-3 align-items-end">
						<!-- 年度 -->
						<div class="col-md-3">
							<label for="nendo" class="form-label">
								年度 <span class="text-danger" th:if="${mode == 'register'}">*</span>
							</label>
					
							<!-- 照会モードの場合はプルダウン -->
							<select th:if="${mode == 'view'}" class="form-select" id="nendo" th:field="*{nendo}"
								th:data-base-url="@{/admin/nokigen/view/}" onchange="changeNendo(this)">
								<option th:each="n : ${nendoList}" th:value="${n}" th:text="${n + '年度'}"
									th:selected="${n == nokigen.nendo}">
								</option>
							</select>
					
							<!-- 登録モードの場合はテキスト入力 -->
							<input th:unless="${mode == 'view'}" type="text" class="form-control" th:field="*{nendo}" id="nendo"
							    placeholder="例：2024" th:readonly="${mode != 'register'}"
							    th:classappend="(${validationErrors != null and !validationErrors.isEmpty()} ? 'is-invalid' : '') + (${mode != 'register'} ? ' form-control-readonly' : '')"
							    th:data-initial-value="*{nendo}">
					
							<div class="invalid-feedback" th:if="${validationErrors != null and !validationErrors.isEmpty()}">
								<span th:each="err : ${validationErrors}" th:text="${err}"></span>
							</div>
						</div>
					
						<!-- 休業日・複写ボタン（登録モード時のみ表示） -->
						<div class="col-md-9 d-flex align-items-center flex-wrap gap-2 mt-2 mt-md-0" th:if="${mode == 'register'}">
							<span class="small text-muted me-1">休業日の場合：</span>
							<div class="form-check form-check-inline mb-0">
								<input class="form-check-input rounded-circle" type="checkbox" name="shiftWeekend" id="shiftFriday"
									value="friday" style="width:0.85em;height:0.85em;">
								<label class="form-check-label small" for="shiftFriday">前営業日にずらす</label>
							</div>
							<div class="form-check form-check-inline mb-0">
								<input class="form-check-input rounded-circle" type="checkbox" name="shiftWeekend" id="shiftMonday"
									value="monday" style="width:0.85em;height:0.85em;">
								<label class="form-check-label small" for="shiftMonday">翌営業日にずらす</label>
							</div>
							<button type="button" class="btn btn-outline-primary ms-2" th:data-url="@{/admin/nokigen/prev-data/}"
								th:data-exists-url="@{/admin/nokigen/exists/}" onclick="copyPrevYear(this)">
								<i class="bi bi-copy me-1"></i>前年度を複写する
							</button>
						</div>
					</div>

					<div class="row g-3 mb-3">
						<!-- 1期 -->
						<div class="col-md-3">
							<label for="nokigen1st" class="form-label">
								1期 <span th:if="${kiMonthLabels}" th:text="'(' + ${kiMonthLabels[0]} + ')'"
									class="text-muted"></span>
							</label>

							<input type="date" class="form-control" th:field="*{nokigen1st}" id="nokigen1st"
								th:readonly="${mode == 'view'}" th:data-initial-value="*{nokigen1st}"
								th:classappend="${mode == 'view'} ? ' form-control-readonly' : ''">
						</div>
						<!-- 2期 -->
						<div class="col-md-3">
							<label for="nokigen2nd" class="form-label">
								2期 <span th:if="${kiMonthLabels}" th:text="'(' + ${kiMonthLabels[1]} + ')'"
									class="text-muted"></span>
							</label>

							<input type="date" class="form-control" th:field="*{nokigen2nd}" id="nokigen2nd"
								th:readonly="${mode == 'view'}" th:data-initial-value="*{nokigen2nd}"
								th:classappend="${mode == 'view'} ? ' form-control-readonly' : ''">
						</div>
						<!-- 3期 -->
						<div class="col-md-3">
							<label for="nokigen3rd" class="form-label">
								3期 <span th:if="${kiMonthLabels}" th:text="'(' + ${kiMonthLabels[2]} + ')'"
									class="text-muted"></span>
							</label>

							<input type="date" class="form-control" th:field="*{nokigen3rd}" id="nokigen3rd"
								th:readonly="${mode == 'view'}" th:data-initial-value="*{nokigen3rd}"
								th:classappend="${mode == 'view'} ? ' form-control-readonly' : ''">
						</div>
						<!-- 4期 -->
						<div class="col-md-3">
							<label for="nokigen4th" class="form-label">
								4期 <span th:if="${kiMonthLabels}" th:text="'(' + ${kiMonthLabels[3]} + ')'"
									class="text-muted"></span>
							</label>

							<input type="date" class="form-control" th:field="*{nokigen4th}" id="nokigen4th"
								th:readonly="${mode == 'view'}" th:data-initial-value="*{nokigen4th}"
								th:classappend="${mode == 'view'} ? ' form-control-readonly' : ''">
						</div>
						<!-- 5期 -->
						<div class="col-md-3">
							<label for="nokigen5th" class="form-label">
								5期 <span th:if="${kiMonthLabels}" th:text="'(' + ${kiMonthLabels[4]} + ')'"
									class="text-muted"></span>
							</label>

							<input type="date" class="form-control" th:field="*{nokigen5th}" id="nokigen5th"
								th:readonly="${mode == 'view'}" th:data-initial-value="*{nokigen5th}"
								th:classappend="${mode == 'view'} ? ' form-control-readonly' : ''">
						</div>
						<!-- 6期 -->
						<div class="col-md-3">
							<label for="nokigen6th" class="form-label">
								6期 <span th:if="${kiMonthLabels}" th:text="'(' + ${kiMonthLabels[5]} + ')'"
									class="text-muted"></span>
							</label>

							<input type="date" class="form-control" th:field="*{nokigen6th}" id="nokigen6th"
								th:readonly="${mode == 'view'}" th:data-initial-value="*{nokigen6th}"
								th:classappend="${mode == 'view'} ? ' form-control-readonly' : ''">
						</div>
						<!-- 7期 -->
						<div class="col-md-3">
							<label for="nokigen7th" class="form-label">
								7期 <span th:if="${kiMonthLabels}" th:text="'(' + ${kiMonthLabels[6]} + ')'"
									class="text-muted"></span>
							</label>

							<input type="date" class="form-control" th:field="*{nokigen7th}" id="nokigen7th"
								th:readonly="${mode == 'view'}" th:data-initial-value="*{nokigen7th}"
								th:classappend="${mode == 'view'} ? ' form-control-readonly' : ''">
						</div>
						<!-- 8期 -->
						<div class="col-md-3">
							<label for="nokigen8th" class="form-label">
								8期 <span th:if="${kiMonthLabels}" th:text="'(' + ${kiMonthLabels[7]} + ')'"
									class="text-muted"></span>
							</label>

							<input type="date" class="form-control" th:field="*{nokigen8th}" id="nokigen8th"
								th:readonly="${mode == 'view'}" th:data-initial-value="*{nokigen8th}"
								th:classappend="${mode == 'view'} ? ' form-control-readonly' : ''">
						</div>
						<!-- 9期 -->
						<div class="col-md-3">
							<label for="nokigen9th" class="form-label">
								9期 <span th:if="${kiMonthLabels}" th:text="'(' + ${kiMonthLabels[8]} + ')'"
									class="text-muted"></span>
							</label>

							<input type="date" class="form-control" th:field="*{nokigen9th}" id="nokigen9th"
								th:readonly="${mode == 'view'}" th:data-initial-value="*{nokigen9th}"
								th:classappend="${mode == 'view'} ? ' form-control-readonly' : ''">
						</div>
						<!-- 10期 -->
						<div class="col-md-3">
							<label for="nokigen10th" class="form-label">
								10期 <span th:if="${kiMonthLabels}" th:text="'(' + ${kiMonthLabels[9]} + ')'"
									class="text-muted"></span>
							</label>

							<input type="date" class="form-control" th:field="*{nokigen10th}" id="nokigen10th"
								th:readonly="${mode == 'view'}" th:data-initial-value="*{nokigen10th}"
								th:classappend="${mode == 'view'} ? ' form-control-readonly' : ''">
						</div>
						<!-- 11期 -->
						<div class="col-md-3">
							<label for="nokigen11th" class="form-label">
								11期 <span th:if="${kiMonthLabels}" th:text="'(' + ${kiMonthLabels[10]} + ')'"
									class="text-muted"></span>
							</label>

							<input type="date" class="form-control" th:field="*{nokigen11th}" id="nokigen11th"
								th:readonly="${mode == 'view'}" th:data-initial-value="*{nokigen11th}"
								th:classappend="${mode == 'view'} ? ' form-control-readonly' : ''">
						</div>
						<!-- 12期 -->
						<div class="col-md-3">
							<label for="nokigen12th" class="form-label">
								12期 <span th:if="${kiMonthLabels}" th:text="'(' + ${kiMonthLabels[11]} + ')'"
									class="text-muted"></span>
							</label>

							<input type="date" class="form-control" th:field="*{nokigen12th}" id="nokigen12th"
								th:readonly="${mode == 'view'}" th:data-initial-value="*{nokigen12th}"
								th:classappend="${mode == 'view'} ? ' form-control-readonly' : ''">
						</div>
					</div>
				</form>
			</div>
		</div>

		<!-- ボタン -->
		<div class="text-center mt-4" th:if="${mode != 'view'}">
			<!-- 戻る -->
			<button type="button" class="btn btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#backModal"
				th:if="${mode == 'edit'}">
				<i class="bi bi-arrow-left me-1"></i> 戻る
			</button>
			<!-- 登録/更新 -->
			<button type="submit" form="nokigenForm" class="btn btn-success">
				<i class="bi bi-check-circle me-1"></i> <span th:text="${mode == 'register' ? '登録する' : '更新する'}">保存</span>
			</button>
		</div>
		
		<!-- 入力内容破棄確認モーダル -->
		<div
			th:replace="~{layout/components :: linkConfirmModal('backModal','確認','入力内容が破棄されます。よろしいですか？',@{/admin/nokigen/view/{nendo}(nendo=${mode == 'edit' ? nokigen.nendo : nendoList[0]})},'戻る')}">
		</div>

	</div>
</body>
<th:block layout:fragment="scripts">
	<script th:src="@{/js/nokigenConfig.js}"></script>
</th:block>

</html>
