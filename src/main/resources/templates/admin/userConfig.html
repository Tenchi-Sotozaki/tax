<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">
<head>
<title>ユーザー登録/編集</title>
</head>
<body>
	<div layout:fragment="content" class="container-fluid p-4">

		<div
			class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom"
			th:data-is-edit="${isEdit}">
			<h5 class="mb-0 fw-bold text-dark">
				<i th:class="${isView} ? 'bi bi-person-lines-fill me-2 text-primary' : (${isEdit} ? 'bi bi-pencil-square me-2 text-primary' : 'bi bi-person-plus me-2 text-primary')"></i>
				<span th:text="${isView} ? 'ユーザー照会' : (${isEdit} ? 'ユーザー編集' : 'ユーザー登録')"></span>
			</h5>

			<a th:href="@{/admin/user-edit/{id}(id=${userForm.originalId})}"
				class="btn btn-primary btn-sm" th:if="${isView}"> <i
				class="bi bi-pencil-square me-2"></i>編集する
			</a>
		</div>

		<!-- 登録・更新成功メッセージ -->
		<div th:if="${successMessage}"
			class="alert alert-success alert-dismissible fade show" role="alert">
			<i class="bi bi-check-circle-fill me-2"></i> <span
				th:text="${successMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>

		<form id="userConfigForm"
			th:action="${isEdit} ? @{/admin/user-edit/{id}(id=${userForm.originalId})} : @{/admin/user-registration}"
			th:object="${userForm}" method="post">

			<div
				th:if="${validationErrors != null and !validationErrors.isEmpty()}"
				class="alert alert-danger alert-dismissible fade show" role="alert">
				<i class="bi bi-exclamation-triangle-fill me-2"></i>
				入力内容にエラーがあります。各項目を確認してください。
				<ul class="mb-0 mt-1">
					<li th:each="err : ${validationErrors}" th:text="${err}"
						class="small"></li>
				</ul>
				<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
			</div>

			<div class="card mb-4 shadow-sm">
				<div class="card-header py-3">
					<h5 class="mb-0">
						<i class="bi bi-person-vcard me-2"></i>ユーザー情報
					</h5>
				</div>
				<div class="card-body bg-light-subtle">
					<div class="row g-3">

						<input type="hidden" th:field="*{originalId}">

						<!-- ID -->
						<div class="col-md-4">

							<label for="id" class="form-label fw-medium"> ID <span
								class="text-danger">*</span>
							</label> <input type="text" class="form-control" id="id" th:field="*{id}"
								th:errorclass="is-invalid" th:readonly="${isEdit}"
								th:data-initial-value="*{id}">

							<div class="invalid-feedback" th:if="${#fields.hasErrors('id')}"
								th:errors="*{id}"></div>
						</div>

						<div class="col-md-4"></div>
						<div class="col-md-4"></div>

						<!-- 氏名 -->
						<div class="col-md-4">

							<label for="name" class="form-label fw-medium"> 氏名 <span
								class="text-danger">*</span>
							</label> <input type="text" class="form-control" id="name"
								th:field="*{name}" th:errorclass="is-invalid"
								th:readonly="${isView}" th:data-initial-value="*{name}">

							<div class="invalid-feedback"
								th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
							</div>
						</div>

						<!-- ふりがな -->
						<div class="col-md-4">
							<label for="nameKana" class="form-label fw-medium"> ふりがな
								<span class="text-danger">*</span>
							</label> <input type="text" class="form-control" id="nameKana"
								th:field="*{nameKana}" th:errorclass="is-invalid"
								placeholder="ひらがなで入力" th:readonly="${isView}"
								th:data-initial-value="*{nameKana}">

							<div class="invalid-feedback"
								th:if="${#fields.hasErrors('nameKana')}" th:errors="*{nameKana}"></div>
						</div>

						<div class="col-md-4"></div>

						<!-- 部署 -->
						<div class="col-md-4">
							<label for="busho" class="form-label fw-medium"> 部署 <span
								class="text-danger">*</span>
							</label> <input type="text" class="form-control" id="busho"
								th:field="*{busho}" th:errorclass="is-invalid"
								th:readonly="${isView}" th:data-initial-value="*{busho}">

							<div class="invalid-feedback"
								th:if="${#fields.hasErrors('busho')}" th:errors="*{busho}">
							</div>
						</div>

						<!-- 権限 -->
						<div class="col-md-4">
							<label for="roleId" class="form-label fw-medium"> 権限 <span
								class="text-danger">*</span>
							</label> <select class="form-select" id="roleId" th:field="*{roleId}"
								th:errorclass="is-invalid" th:data-initial-value="*{roleId}"
								th:disabled="${isView == true or isDefaultUser == true}">
								<option value="">選択してください</option>
								<option th:each="role : ${roles}" th:value="${role.roleId}"
									th:text="${role.name}"></option>
							</select>
							<div th:if="${isDefaultUser}" class="form-text text-muted">デフォルトユーザーの権限は変更できません。</div>

							<div class="invalid-feedback"
								th:if="${#fields.hasErrors('roleId')}" th:errors="*{roleId}">
							</div>
						</div>

						<div class="col-md-4"></div>

						<!-- パスワード関連は照会画面では表示しない -->
						<th:block th:unless="${isView}">

							<!-- 新しいパスワード -->
							<div class="col-md-4">
								<label for="password" class="form-label fw-medium"> <span
									th:if="${isEdit}">新しいパスワード</span> <span th:if="!${isEdit}">パスワード
										<span class="text-danger">*</span>
								</span> <span th:if="${isEdit}" class="text-muted small ms-1">(変更する場合のみ入力)</span>
								</label> <input type="password" class="form-control" id="password"
									th:field="*{password}" th:errorclass="is-invalid"
									autocomplete="new-password" th:data-initial-value="*{password}">

								<div class="invalid-feedback"
									th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
							</div>

							<!-- パスワード(確認用) -->
							<div class="col-md-4">
								<label for="passwordConfirm" class="form-label fw-medium">
									パスワード(確認用) <span class="text-danger" th:if="!${isEdit}">*</span>
								</label> <input type="password" class="form-control" id="passwordConfirm"
									name="passwordConfirm" th:errorclass="is-invalid"
									autocomplete="new-password">

								<div class="invalid-feedback"
									th:if="${#fields.hasErrors('passwordConfirm')}"
									th:errors="*{passwordConfirm}"></div>
							</div>

						</th:block>

					</div>
				</div>
			</div>

			<!-- アクションボタン -->
			<div class="d-flex justify-content-center gap-3 py-4 mb-5">

				<!-- 戻る（編集は照会画面へ、登録は一覧へ。照会画面は入力破棄の確認を出さない） -->
				<a th:if="${isView != true}" href="#"
					class="btn btn-outline-primary btn-lg px-4"
					data-bs-toggle="modal" data-bs-target="#backConfirmModal"> <i
					class="bi bi-arrow-left me-2"></i>戻る
				</a>
				<a th:if="${isView}" th:href="@{/admin/user-search}"
					class="btn btn-outline-primary btn-lg px-4"> <i
					class="bi bi-arrow-left me-2"></i>一覧に戻る
				</a>

				<!-- 編集時のみ削除ボタンを表示 -->
				<button type="button" class="btn btn-danger btn-lg px-5"
					th:if="${isEdit == true and isView != true}"
					onclick="confirmUserDelete()">
					<i class="bi bi-trash me-2"></i>削除する
				</button>

				<!-- 登録する／更新する（確認モーダルを経由する） -->
				<button type="button" id="openConfirmModalBtn"
					class="btn btn-success btn-lg px-5" th:unless="${isView}">
					<i
						th:class="${isEdit} ? 'bi bi-pencil-square me-2' : 'bi bi-save me-2'"></i>
					<span th:text="${isEdit} ? '更新する' : '登録する'"></span>
				</button>

			</div>
		</form>

		<!-- 削除用フォーム・確認モーダル（編集画面のみ） -->
		<th:block th:if="${isEdit == true and isView != true}">
			<form id="deleteForm" th:action="@{/admin/user-delete/{id}(id=${userForm.originalId})}" method="post"
				style="display:none;"></form>
			<div
				th:replace="~{layout/components :: confirmModal('deleteModal','削除確認','このユーザーを削除します。よろしいですか？','deleteForm','btn-danger','削除する')}">
			</div>
		</th:block>

		<!-- 確認モーダル（登録と更新） -->
		<div th:if="${isView != true}"
			th:replace="~{layout/components :: confirmModal('registerModal', ${isEdit} ? '更新確認' : '登録確認', ${isEdit} ? 'この内容で更新します。よろしいですか？' : 'この内容で登録します。よろしいですか？', 'userConfigForm', ${isEdit} ? 'btn-success' : 'btn-primary', ${isEdit} ? '更新' : '登録')}">
		</div>

		<div th:if="${isView != true}" th:replace="~{layout/components :: linkConfirmModal('backConfirmModal', '確認', '入力内容が破棄されます。よろしいですか？', ${isEdit == true} ? @{/admin/user-view/{id}(id=${userForm.originalId})} : @{/admin/user-search}, '戻る')}"></div>

	</div>

	<!-- JavaScriptファイル読み込み -->
	<th:block layout:fragment="scripts">
		<script th:src="@{/js/userConfig.js}"></script>
	</th:block>
</body>
</html>
