<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">

<head>
<title>トップページ編集</title>
</head>

<body>
	<div layout:fragment="content" class="container-fluid p-4">

		<div
			class="d-flex justify-content-between align-items-center pb-2 mb-3 border-bottom">
			<h5 class="mb-0 fw-bold text-dark">
				<i class="bi bi-pencil-square me-2 text-primary"></i>トップページ編集
			</h5>
		</div>

		<div
			th:if="${validationErrors != null and !validationErrors.isEmpty()}"
			class="alert alert-danger" role="alert">
			<i class="bi bi-exclamation-triangle-fill me-2"></i>入力内容を確認してください。
			<ul class="mb-0 mt-2">
				<li th:each="err : ${validationErrors}" th:text="${err}"></li>
			</ul>
		</div>

		<form th:action="@{/admin/top-page-config/save}"
			th:object="${topPageForm}" method="post">

			<!-- 掲載期間 -->
			<div class="card shadow-sm mb-3">
				<div class="card-header bg-primary bg-opacity-10 py-2">
					<h6 class="mb-0 fw-semibold">
						<i class="bi bi-calendar-range me-2 text-primary"></i>掲載期間
					</h6>
				</div>
				<div class="card-body py-3">
					<div class="row row-cols-1 row-cols-md-3 g-2">
						<div class="col">
							<label class="form-label form-label-sm fw-medium mb-1">掲載開始日
								<span class="text-danger">*</span>
							</label> <input type="date" class="form-control form-control-sm"
								th:field="*{keisaiStYmd}">
						</div>
						<div class="col">
							<label class="form-label form-label-sm fw-medium mb-1">掲載終了日</label>
							<input type="date" class="form-control form-control-sm"
								th:field="*{keisaiEdYmd}">
							<div class="form-text">未入力の場合は終了日なしとして扱います。</div>
						</div>
					</div>
				</div>
			</div>

			<!-- HTML入力エリア -->
			<div class="card shadow-sm mb-3">
				<div class="card-header bg-primary bg-opacity-10 py-2">
					<h6 class="mb-0 fw-semibold">
						<i class="bi bi-code-slash me-2 text-primary"></i>HTML入力エリア
						<span class="text-danger">*</span>
					</h6>
				</div>
				<div class="card-body py-3">
					<textarea id="contents" class="form-control font-monospace" rows="12"
						th:field="*{contents}"
						placeholder="&lt;h2&gt;操作マニュアル&lt;/h2&gt;"></textarea>
				</div>
			</div>

			<!-- プレビュー -->
			<div class="card shadow-sm mb-3">
				<div class="card-header bg-primary bg-opacity-10 py-2">
					<h6 class="mb-0 fw-semibold">
						<i class="bi bi-eye me-2 text-primary"></i>プレビュー
					</h6>
				</div>
				<div class="card-body py-3">
					<div id="preview" class="border rounded p-3 bg-white"></div>
				</div>
			</div>

			<!-- アクションボタン。並び順は左から「一覧に戻る」「プレビュー」「登録する」 -->
			<div class="d-flex justify-content-center gap-3 py-3">
				<a th:href="@{/admin/top-page-config/list}"
					class="btn btn-outline-primary btn-lg px-4"
					onclick="return confirm('入力内容は破棄されます。よろしいですか？')"> <i
					class="bi bi-arrow-left me-2"></i>一覧に戻る
				</a>
				<button type="button" id="btnPreview"
					class="btn btn-outline-secondary btn-lg px-4">
					<i class="bi bi-eye me-2"></i>プレビュー
				</button>
				<button type="submit" class="btn btn-success btn-lg px-5">
					<i class="bi bi-save me-2"></i>登録する
				</button>
			</div>

		</form>

	</div>

	<th:block layout:fragment="scripts">
		<script th:src="@{/js/topPageConfig.js}"></script>
	</th:block>
</body>

</html>
