<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">
<head>
<title th:text="${mode == 'register' ? '納税周期登録' : '納税周期編集'}">納税周期設定</title>
</head>
<body>
	<div layout:fragment="content" class="container-fluid p-4">

		<div
			class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
			<h2 class="h2">
				<i class="bi bi-calendar-plus me-2 text-primary"></i> <span
					th:text="${mode == 'register' ? '納税周期登録' : '納税周期編集'}">納税周期設定</span>
			</h2>
		</div>

		<!-- メッセージ表示 -->
		<div th:if="${successMessage}"
			class="alert alert-success alert-dismissible fade show" role="alert">
			<span th:text="${successMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>
		<div th:if="${errorMessage}"
			class="alert alert-danger alert-dismissible fade show" role="alert">
			<span th:text="${errorMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>

		<!-- 入力フォーム -->
		<div class="card shadow-sm">
			<div class="card-body">
				<form th:action="@{/admin/nozei-shuki/save}" method="post"
					th:object="${nozeiShuki}">
					<input type="hidden" th:field="*{seq}"> <input
						type="hidden" th:field="*{jichitaiCd}"> <input
						type="hidden" th:field="*{delFlg}"> <input type="hidden"
						th:field="*{addDt}"> <input type="hidden"
						th:field="*{addUser}"> <input type="hidden"
						th:field="*{updDt}"> <input type="hidden"
						th:field="*{updUser}"> <input type="hidden"
						th:field="*{version}">

					<div class="row">
						<div class="col-md-6">
							<div class="mb-3">
								<label for="shuki" class="form-label">納税周期 <span
									class="text-danger">*</span></label> <select class="form-select"
									th:field="*{shuki}" id="shuki" required>
									<option value="">選択してください</option>
									<option value="1">毎月</option>
									<option value="2">2ヶ月</option>
									<option value="3">3ヶ月</option>
									<option value="4">4ヶ月</option>
									<option value="6">6ヶ月</option>
									<option value="12">年1回</option>
								</select>
							</div>
						</div>
					</div>

					<div class="d-flex justify-content-between">
						<div>
							<a th:href="@{/admin/nozei-shuki}" class="btn btn-secondary me-2">
								<i class="bi bi-arrow-left me-1"></i>一覧に戻る
							</a>
						</div>
						<div>
							<th:block th:if="${mode == 'edit'}">
								<button type="button" class="btn btn-danger me-2"
									onclick="deleteNozeiShuki()">
									<i class="bi bi-trash me-1"></i>削除する
								</button>
							</th:block>
							<button type="submit" class="btn btn-primary">
								<i class="bi bi-check-circle me-1"></i> <span
									th:text="${mode == 'register' ? '登録する' : '更新する'}">保存</span>
							</button>
						</div>
					</div>
				</form>
			</div>
		</div>

		<!-- 削除確認モーダル -->
		<div class="modal fade" id="deleteModal" tabindex="-1"
			aria-hidden="true">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title">削除確認</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
					</div>
					<div class="modal-body">
						<p>この納税周期を削除しますか？</p>
						<p class="text-muted">削除した納税周期は復元できません。</p>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary"
							data-bs-dismiss="modal">キャンセル</button>
						<form
							th:action="@{/admin/nozei-shuki/delete/{seq}(seq=${nozeiShuki.seq})}"
							method="post" style="display: inline;">
							<button type="submit" class="btn btn-danger">削除する</button>
						</form>
					</div>
				</div>
			</div>
		</div>

	</div>

	<th:block layout:fragment="scripts">
		<script th:src="@{/js/nozei_shuki_config.js}"></script>
	</th:block>

</body>
</html>
