<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">

<head>
	<title th:text="${mode == 'register' ? '邏咲ｨ主捉譛溽匳骭ｲ' : '邏咲ｨ主捉譛溽ｷｨ髮・}">邏咲ｨ主捉譛溯ｨｭ螳・/title>
</head>

<body>
	<div layout:fragment="content" class="container-fluid p-4" th:data-is-edit="${mode != 'register'}">

		<div
			class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
			<h5 class="mb-0 fw-bold text-dark">
				<i class="bi bi-calendar-plus me-2 text-primary"></i> <span
					th:text="${mode == 'register' ? '邏咲ｨ主捉譛溽匳骭ｲ' : '邏咲ｨ主捉譛溽ｷｨ髮・}">邏咲ｨ主捉譛溯ｨｭ螳・/span>
			</h5>
		</div>

		<div th:if="${validationErrors != null and !validationErrors.isEmpty()}"
			class="alert alert-danger alert-dismissible fade show" role="alert">
			<i class="bi bi-exclamation-triangle-fill me-2"></i> 蜈･蜉帛・螳ｹ縺ｫ <span
				th:text="${validationErrors.size()}"></span> 莉ｶ縺ｮ繧ｨ繝ｩ繝ｼ縺後≠繧翫∪縺吶・
			<ul class="mb-0 mt-1">
				<li th:each="err : ${validationErrors}" th:text="${err}" class="small"></li>
			</ul>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>


		<!-- 繝｡繝・そ繝ｼ繧ｸ陦ｨ遉ｺ -->
		<div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
			<span th:text="${successMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>
		<div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
			<span th:text="${errorMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>

		<!-- 蜈･蜉帙ヵ繧ｩ繝ｼ繝 -->
		<form th:action="@{/admin/nozei-shuki/save}" method="post" th:object="${nozeiShuki}">
			<div class="card shadow-sm">
				<div class="card-body">

					<input type="hidden" th:field="*{seq}"> <input type="hidden" th:field="*{jichitaiCd}"> <input
						type="hidden" th:field="*{delFlg}"> <input type="hidden" th:field="*{addDt}"> <input
						type="hidden" th:field="*{addUser}"> <input type="hidden" th:field="*{updDt}"> <input
						type="hidden" th:field="*{updUser}"> <input type="hidden" th:field="*{version}">
					<div class="row">
						<div class="col-md-6">
							<div class="mb-3">
								<label for="shuki" class="form-label">邏咲ｨ主捉譛・<span class="text-danger">*</span></label>
								<select class="form-select" th:field="*{shuki}" id="shuki"
									th:classappend="${validationErrors != null and !validationErrors.isEmpty()} ? 'is-invalid'"
									th:data-initial-value="*{shuki}">
									<option value="">驕ｸ謚槭＠縺ｦ縺上□縺輔＞</option>
									<option value="1">豈取怦</option>
									<option value="2">2繝ｶ譛・/option>
									<option value="3">3繝ｶ譛・/option>
									<option value="4">4繝ｶ譛・/option>
									<option value="6">6繝ｶ譛・/option>
									<option value="12">蟷ｴ1蝗・/option>
								</select>
								<div class="invalid-feedback"
									th:if="${validationErrors != null and !validationErrors.isEmpty()}">
									<span th:each="err : ${validationErrors}" th:text="${err}"></span>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>

			<div class="d-flex justify-content-center mt-2">
				<div>
					<a th:href="@{/admin/nozei-shuki/list}" class="btn btn-secondary me-2"
						onclick="return confirm('蜈･蜉帛・螳ｹ縺ｯ遐ｴ譽・＆繧後∪縺吶ゅｈ繧阪＠縺・〒縺吶°・・)"> <i class="bi bi-arrow-left me-1"></i>荳隕ｧ縺ｫ謌ｻ繧・
					</a>
				</div>
				<div>
					<th:block th:if="${mode == 'edit'}">
						<button type="button" class="btn btn-danger me-2" onclick="deleteNozeiShuki()">
							<i class="bi bi-trash me-1"></i>蜑企勁縺吶ｋ
						</button>
					</th:block>
					<button type="submit" class="btn btn-success">
						<i class="bi bi-check-circle me-1"></i> <span
							th:text="${mode == 'register' ? '逋ｻ骭ｲ縺吶ｋ' : '譖ｴ譁ｰ縺吶ｋ'}"></span>
					</button>
				</div>
			</div>
		</form>



		<!-- 蜑企勁繝輔か繝ｼ繝・磯國縺暦ｼ・-->
		<form id="deleteNozeiShukiForm" th:action="@{/admin/nozei-shuki/delete/{seq}(seq=${nozeiShuki.seq})}"
			method="post" class="d-none"></form>

		<!-- 蜑企勁遒ｺ隱阪Δ繝ｼ繝繝ｫ -->
		<div
			th:replace="~{layout/components :: confirmModal('deleteModal', '蜑企勁遒ｺ隱・, '縺薙・邏咲ｨ主捉譛溘ｒ蜑企勁縺励∪縺吶ょ炎髯､縺励◆邏咲ｨ主捉譛溘・蠕ｩ蜈・〒縺阪∪縺帙ｓ縲ゅｈ繧阪＠縺・〒縺吶°・・, 'deleteNozeiShukiForm', 'btn-danger', '蜑企勁縺吶ｋ')}">
		</div>

	</div>

	<th:block layout:fragment="scripts">
		<script th:src="@{/js/nozeiShukiConfig.js}"></script>
	</th:block>
</body>

</html>
