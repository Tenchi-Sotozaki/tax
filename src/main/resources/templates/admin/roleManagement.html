<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">
<head>
<title>権限管理台帳</title>
</head>
<body>
	<div layout:fragment="content" class="container-fluid p-4">

		<div
			class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
			<h2 class="h2">
				<i class="bi bi-shield-lock me-2 text-primary"></i> 権限管理台帳
			</h2>
		</div>

		<!-- アクションボタン -->
		<div class="mb-3">
			<button type="button" class="btn btn-primary me-2"
				onclick="openRoleModal('create')">
				<i class="bi bi-plus-circle me-1"></i>新規登録
			</button>
			<button type="button" class="btn btn-success me-2"
				onclick="openRoleModal('edit')" id="editBtn" disabled>
				<i class="bi bi-pencil-square me-1"></i>権限編集
			</button>
			<button type="button" class="btn btn-info me-2"
				onclick="openRoleModal('view')" id="viewBtn" disabled>
				<i class="bi bi-eye me-1"></i>権限照会
			</button>
			<button type="button" class="btn btn-outline-secondary"
				onclick="viewAssignedUsers()" id="usersBtn" disabled>
				<i class="bi bi-people me-1"></i>付与ユーザー照会
			</button>
		</div>

		<!-- 権限一覧テーブル -->
		<div class="card shadow-sm">
			<div class="card-body">
				<table class="table table-hover">
					<thead class="table-light">
						<tr>
							<th></th>
							<th>権限ID</th>
							<th>権限名</th>
							<th>権限詳細</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="role : ${roles}">
							<td><input type="checkbox" class="role-checkbox"
								th:value="${role.roleId}" onchange="updateButtons()"></td>
							<td th:text="${role.roleId}"></td>
							<td th:text="${role.name}"></td>
							<td><span th:each="detail, iterStat : ${role.roleDetails}"
								th:text="${detail.screen.screenName + (detail.permission == 1 ? '(参照)' : '(更新)') + (!iterStat.last ? ', ' : '')}"></span>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>

		<!-- 権限設定モーダル -->
		<div class="modal fade" id="roleModal" tabindex="-1"
			aria-hidden="true">
			<div class="modal-dialog modal-lg">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title" id="roleModalTitle">権限登録</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
					</div>
					<div class="modal-body">
						<form id="roleForm">
							<input type="hidden" id="roleId" name="roleId"> <input
								type="hidden" id="version" name="version">

							<div class="mb-3">
								<label for="roleName" class="form-label">権限名 <span
									class="text-danger">*</span></label> <input type="text"
									class="form-control" id="roleName" name="name" required>
							</div>

							<div class="mb-3">
								<label class="form-label">権限詳細</label>
								<div class="table-responsive">
									<table class="table table-sm">
										<thead>
											<tr>
												<th>画面名</th>
												<th>権限なし</th>
												<th>参照</th>
												<th>更新</th>
											</tr>
										</thead>
										<tbody id="screenPermissions">
											<tr th:each="screen : ${screens}">
												<td th:text="${screen.screenName}"></td>
												<td><input type="radio"
													th:name="'permission_' + ${screen.screenId}" value="0"
													checked></td>
												<td><input type="radio"
													th:name="'permission_' + ${screen.screenId}" value="1">
												</td>
												<td><input type="radio"
													th:name="'permission_' + ${screen.screenId}" value="2">
												</td>
											</tr>
										</tbody>
									</table>
								</div>
							</div>
						</form>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary"
							data-bs-dismiss="modal">キャンセル</button>
						<button type="button" class="btn btn-primary" id="saveBtn"
							onclick="saveRole()">保存</button>
					</div>
				</div>
			</div>
		</div>

	</div>

	<script layout:fragment="scripts">
let currentMode = 'create';

function toggleSelectAll() {
    const selectAll = document.getElementById('selectAll');
    const checkboxes = document.querySelectorAll('.role-checkbox');
    checkboxes.forEach(cb => cb.checked = selectAll.checked);
    updateButtons();
}

function updateButtons() {
    const checked = document.querySelectorAll('.role-checkbox:checked');
    const editBtn = document.getElementById('editBtn');
    const viewBtn = document.getElementById('viewBtn');
    const usersBtn = document.getElementById('usersBtn');
    
    const hasSelection = checked.length > 0;
    const singleSelection = checked.length === 1;
    
    editBtn.disabled = !singleSelection;
    viewBtn.disabled = !singleSelection;
    usersBtn.disabled = !singleSelection;
}

function openRoleModal(mode) {
    currentMode = mode;
    const modal = new bootstrap.Modal(document.getElementById('roleModal'));
    const title = document.getElementById('roleModalTitle');
    const saveBtn = document.getElementById('saveBtn');
    
    if (mode === 'create') {
        title.textContent = '権限登録';
        saveBtn.style.display = 'block';
        document.getElementById('roleForm').reset();
        document.getElementById('roleId').value = '';
    } else {
        const checked = document.querySelector('.role-checkbox:checked');
        if (!checked) return;
        
        const roleId = checked.value;
        
        if (mode === 'edit') {
            title.textContent = '権限編集';
            saveBtn.style.display = 'block';
        } else {
            title.textContent = '権限照会';
            saveBtn.style.display = 'none';
        }
        
        loadRoleDetail(roleId, mode === 'view');
    }
    
    modal.show();
}

function loadRoleDetail(roleId, readonly) {
    fetch(`/admin/role/detail/${roleId}`)
        .then(response => response.json())
        .then(data => {
            document.getElementById('roleId').value = data.role.roleId;
            document.getElementById('roleName').value = data.role.name;
            document.getElementById('version').value = data.role.version;
            
            // 権限設定
            if (data.permissions) {
                Object.entries(data.permissions).forEach(([screenId, permission]) => {
                    const radio = document.querySelector(`input[name="permission_${screenId}"][value="${permission}"]`);
                    if (radio) radio.checked = true;
                });
            }
            
            // 読み取り専用設定
            if (readonly) {
                document.querySelectorAll('#roleForm input').forEach(input => input.disabled = true);
            } else {
                document.querySelectorAll('#roleForm input').forEach(input => input.disabled = false);
            }
        });
}

function saveRole() {
    const form = document.getElementById('roleForm');
    const formData = new FormData(form);
    
    const data = {
        roleId: formData.get('roleId') || null,
        name: formData.get('name'),
        version: formData.get('version') || null,
        screenPermissions: {}
    };
    
    // 権限設定を収集
    document.querySelectorAll('input[name^="permission_"]:checked').forEach(radio => {
        const screenId = radio.name.replace('permission_', '');
        const permission = parseInt(radio.value);
        if (permission > 0) {
            data.screenPermissions[screenId] = permission;
        }
    });
    
    fetch('/admin/role/save', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify(data)
    })
    .then(response => response.json())
    .then(result => {
        if (result.success) {
            location.reload();
        } else {
            alert('保存に失敗しました: ' + result.message);
        }
    });
}

function viewAssignedUsers() {
    const checked = document.querySelector('.role-checkbox:checked');
    if (!checked) return;
    
    const roleId = checked.value;
    // 付与ユーザー一覧画面への遷移
    window.location.href = `/admin/role/users/${roleId}`;
}
</script>

</body>
</html>
