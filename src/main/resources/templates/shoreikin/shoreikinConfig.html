<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<head>
	<title>迚ｹ蛻･蠕ｴ蜿惹ｺ句漁莠､莉倬≡辣ｧ莨夲ｼ冗匳骭ｲ・冗ｷｨ髮・/title>
</head>

<body>
	<div layout:fragment="content">
		<div class="container-fluid p-4">
			<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom"
				th:data-is-edit="${configForm.editMode}">

				<h5 class="mb-0 fw-bold text-dark">
					迚ｹ蛻･蠕ｴ蜿惹ｺ句漁莠､莉倬≡ <span th:if="${configForm.viewMode}" class="text-muted">-
						辣ｧ莨・/span> <span th:if="${configForm.editMode}" class="text-muted">-
						邱ｨ髮・/span> <span th:if="${configForm.createMode}" class="text-muted">-
						逋ｻ骭ｲ</span>
				</h5>

				<div th:if="${configForm.viewMode}">
					<button type="button" class="btn btn-primary btn-sm" onclick="editMode()">
						<i class="bi bi-pencil"></i> 邱ｨ髮・☆繧・
					</button>
				</div>

			</div>

			<!-- 迚ｹ蛻･蠕ｴ蜿守ｾｩ蜍呵・ュ蝣ｱ -->
			<div th:replace="~{layout/components :: selectedTokugimuInfo}"></div>

			<!-- 謌仙粥繝ｻ繧ｨ繝ｩ繝ｼ繝｡繝・そ繝ｼ繧ｸ -->
			<div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
				<span th:text="${successMessage}"></span>
				<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
			</div>
			<div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
				<span th:text="${errorMessage}"></span>
				<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
			</div>

			<!-- 邨ｱ蜷医Γ繧､繝ｳ繝輔か繝ｼ繝 -->
			<form th:action="${configForm.createMode ? '/accommodation-tax/shoreikin/config/create' : ''}"
				th:object="${configForm}" method="post">
				<input type="hidden" th:field="*{shiteiNo}"> <input type="hidden" th:field="*{mode}"> <input
					type="hidden" th:field="*{version}">

				<!-- 莠､莉倬≡諠・ｱ繧ｨ繝ｪ繧｢ -->
				<div class="card mb-4">
					<div class="card-header">
						<h5 class="mb-0">莠､莉倬≡諠・ｱ</h5>
					</div>
					<div class="card-body">
						<div class="row g-3">

							<!-- 莠､莉倬≡蟷ｴ蠎ｦ -->
							<div class="col-md-3">

								<label for="nendo" class="form-label">莠､莉倬≡蟷ｴ蠎ｦ
									<span class="text-danger">*</span>
								</label>

								<input type="text" class="form-control" id="nendo" th:field="*{nendo}"
									th:readonly="${configForm.viewMode or configForm.editMode}" maxlength="4"
									th:classappend="${#fields.hasErrors('nendo')} ? 'is-invalid' : ''"
									pattern="[0-9]{4}" title="4譯√・謨ｰ蟄励〒蜈･蜉帙＠縺ｦ縺上□縺輔＞" required th:data-initial-value="*{nendo}">

								<div th:if="${#fields.hasErrors('nendo')}" class="invalid-feedback">
									<span th:errors="*{nendo}"></span>
								</div>

							</div>

							<!-- 邏榊・遞朱｡・-->
							<div class="col-md-3">

								<label for="kofuZeigaku" class="form-label">邏榊・遞朱｡・
									<span class="text-danger">*</span>
								</label>

								<div class="input-group">

									<input type="number" class="form-control text-end" id="kofuZeigaku"
										th:field="*{kofuZeigaku}" th:readonly="${configForm.viewMode}"
										th:classappend="${#fields.hasErrors('kofuZeigaku')} ? 'is-invalid' : ''"
										step="1" min="0" max="99999999999999" required
										th:data-initial-value="*{kofuZeigaku}">

									<span class="input-group-text">蜀・/span>
								</div>

								<div th:if="${#fields.hasErrors('kofuZeigaku')}" class="invalid-feedback">
									<span th:errors="*{kofuZeigaku}"></span>
								</div>

							</div>

							<!-- 莠､莉倡紫 -->
							<div class="col-md-3">

								<label for="kofuRitsu" class="form-label">
									莠､莉倡紫 <span class="text-danger">*</span>
								</label>

								<div class="input-group">

									<input type="number" class="form-control text-end" id="kofuRitsu"
										th:field="*{kofuRitsu}" th:readonly="${configForm.viewMode}"
										th:classappend="${#fields.hasErrors('kofuRitsu')} ? 'is-invalid' : ''"
										step="0.01" min="0" max="99999.99" required
										th:data-initial-value="*{kofuRitsu}">

									<span class="input-group-text">%</span>

								</div>

								<div th:if="${#fields.hasErrors('kofuRitsu')}" class="invalid-feedback">
									<span th:errors="*{kofuRitsu}"></span>
								</div>

							</div>

							<!-- 莠､莉倬｡・-->
							<div class="col-md-3">

								<label for="kofuGaku" class="form-label">
									莠､莉倬｡・<span class="text-danger">*</span>
								</label>

								<div class="input-group">

									<input type="number" class="form-control text-end" id="kofuGaku"
										th:field="*{kofuGaku}" th:readonly="${configForm.viewMode}"
										th:classappend="${#fields.hasErrors('kofuGaku')} ? 'is-invalid' : ''" step="1"
										min="0" max="9999999999999" required th:data-initial-value="*{kofuGaku}">

									<span class="input-group-text">蜀・/span>
								</div>

								<div th:if="${#fields.hasErrors('kofuGaku')}" class="invalid-feedback">
									<span th:errors="*{kofuGaku}"></span>
								</div>

							</div>
						</div>

						<!-- 莠､莉伜ｹｴ譛域律 -->
						<div class="row g-3 mt-2">

							<div class="col-md-3">

								<label for="kofuYmd" class="form-label">莠､莉伜ｹｴ譛域律</label>

								<input type="date" class="form-control" id="kofuYmd"
									th:value="${configForm.kofuYmd != null ? #temporals.format(configForm.kofuYmd, 'yyyy-MM-dd') : ''}"
									name="kofuYmd" th:readonly="${configForm.viewMode}"
									th:data-initial-value="*{kofuYmd}">
							</div>

						</div>

						<!-- 邂怜・繝懊ち繝ｳ・育ｷｨ髮・・逋ｻ骭ｲ繝｢繝ｼ繝峨・縺ｿ・・-->
						<div th:if="${configForm.editable}" class="row mt-3">
							<div class="col-12">
								<button type="button" class="btn btn-info" onclick="calculateShoreikin()">
									<i class="bi bi-calculator"></i> 邂怜・
								</button>
								<small class="text-muted ms-2">
									謖・ｮ壼ｹｴ蠎ｦ縺ｮ雉ｦ隱ｲ諠・ｱ縺九ｉ邏榊・遞朱｡阪∽ｺ､莉倬｡阪ｒ閾ｪ蜍慕ｮ怜・縺励∪縺・</small>
							</div>
						</div>
					</div>
				</div>

				<!-- 繧｢繧ｯ繧ｷ繝ｧ繝ｳ繝懊ち繝ｳ -->
				<div class="d-flex gap-2">

					<!-- 逋ｻ骭ｲ繝｢繝ｼ繝・-->
					<div th:if="${configForm.createMode}">
						<button type="submit" class="btn btn-success" onclick="return confirm('莠､莉倬≡諠・ｱ繧堤匳骭ｲ縺励∪縺吶°・・)">
							<i class="bi bi-check-circle"></i> 逋ｻ骭ｲ縺吶ｋ
						</button>
					</div>

					<!-- 邱ｨ髮・Δ繝ｼ繝・-->
					<div th:if="${configForm.editMode}">
						<button type="button" class="btn btn-success" onclick="updateShoreikin()">
							<i class="bi bi-arrow-repeat"></i> 譖ｴ譁ｰ縺吶ｋ
						</button>
					</div>

					<a th:href="@{/shoreikin/list}" class="btn btn-secondary" th:if="${configForm.viewMode}"> <i
							class="bi bi-arrow-left"></i>
						謌ｻ繧・
					</a> <a th:href="@{/shoreikin/list}" class="btn btn-secondary" th:unless="${configForm.viewMode}"
						onclick="return confirm('蜈･蜉帛・螳ｹ縺ｯ遐ｴ譽・＆繧後∪縺吶ゅｈ繧阪＠縺・〒縺吶°・・)"> <i class="bi bi-arrow-left"></i> 謌ｻ繧・
					</a>
				</div>
			</form>

			<!-- 譖ｴ譁ｰ逕ｨ繝輔か繝ｼ繝・育ｷｨ髮・Δ繝ｼ繝会ｼ・-->
			<form th:action="@{/shoreikin/config/update}" th:if="${configForm.editMode}" th:object="${configForm}"
				method="post" id="updateForm" style="display: none;">
				<input type="hidden" th:field="*{shiteiNo}"> <input type="hidden" th:field="*{nendo}"> <input
					type="hidden" th:field="*{kofuZeigaku}"> <input type="hidden" th:field="*{kofuRitsu}"> <input
					type="hidden" th:field="*{kofuGaku}"> <input type="hidden"
					th:value="${configForm.kofuYmd != null ? #temporals.format(configForm.kofuYmd, 'yyyy-MM-dd') : ''}"
					name="kofuYmd"> <input type="hidden" th:field="*{version}">
				<input type="hidden" th:field="*{mode}">
			</form>

			<!-- 邱ｨ髮・Δ繝ｼ繝牙・繧頑崛縺育畑繝輔か繝ｼ繝 -->
			<form th:action="@{/shoreikin/config/edit}" th:object="${configForm}" method="post" id="editForm"
				style="display: none;">
				<input type="hidden" th:field="*{shiteiNo}"> <input type="hidden" th:field="*{nendo}"> <input
					type="hidden" th:field="*{kofuZeigaku}"> <input type="hidden" th:field="*{kofuRitsu}"> <input
					type="hidden" th:field="*{kofuGaku}"> <input type="hidden"
					th:value="${configForm.kofuYmd != null ? #temporals.format(configForm.kofuYmd, 'yyyy-MM-dd') : ''}"
					name="kofuYmd"> <input type="hidden" th:field="*{version}">
				<input type="hidden" th:field="*{shisetsuName}"> <input type="hidden" th:field="*{name}">
			</form>

			<!-- 邂怜・逕ｨ繝輔か繝ｼ繝 -->
			<form th:action="@{/shoreikin/config/calculate}" th:object="${configForm}" method="post" id="calculateForm"
				style="display: none;">
				<input type="hidden" th:field="*{shiteiNo}"> <input type="hidden" th:field="*{nendo}"> <input
					type="hidden" th:field="*{kofuRitsu}"> <input type="hidden"
					th:value="${configForm.kofuYmd != null ? #temporals.format(configForm.kofuYmd, 'yyyy-MM-dd') : ''}"
					name="kofuYmd"> <input type="hidden" th:field="*{version}">
				<input type="hidden" th:field="*{mode}"> <input type="hidden" th:field="*{shisetsuName}"> <input
					type="hidden" th:field="*{name}">
			</form>

			<!-- 迚ｹ蛻･蠕ｴ蜿守ｾｩ蜍呵・欠螳壹Δ繝ｼ繝繝ｫ -->
			<div th:replace="~{layout/components :: shiteiGassanSearchModal}"></div>
		</div>

		<th:block layout:fragment="scripts">
			<script th:src="@{/js/shoreikinConfig.js}"></script>
			<script th:src="@{/js/shiteiGassanSearch.js}"></script>
		</th:block>
	</div>
</body>

</html>
