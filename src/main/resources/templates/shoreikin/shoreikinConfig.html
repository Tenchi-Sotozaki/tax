<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<head>
<title>特別徴収事務交付金照会／登録／編集</title>
</head>

<body>
	<div layout:fragment="content">
		<div class="container-fluid p-4">
			<div
				class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom"
				th:data-is-edit="${configForm.editMode}">

				<h5 class="mb-0 fw-bold text-dark">
					特別徴収事務交付金 <span th:if="${configForm.viewMode}" class="text-muted">-
						照会</span> <span th:if="${configForm.editMode}" class="text-muted">-
						編集</span> <span th:if="${configForm.createMode}" class="text-muted">-
						登録</span>
				</h5>

				<!-- ボタン -->
				<div class="d-flex gap-2" th:if="${configForm.viewMode}">
					<!-- 特別徴収事務交付金交付申請・決定通知ボタン -->
					<a th:href="@{/reports/kofuKetteiTsuchiShinsei}"
						class="btn btn-outline-primary btn-sm"> <i
						class="bi bi-pencil-square me-2"></i>特別徴収事務交付金交付申請・決定通知
					</a>

					<!-- 編集するボタン -->
					<button type="button" class="btn btn-primary btn-sm"
						onclick="editMode()">
						<i class="bi bi-pencil"></i> 編集する
					</button>
				</div>
			</div>

			<!-- 特別徴収義務者情報 -->
			<div th:replace="~{layout/components :: selectedTokugimuInfo}"></div>

			<!-- 成功・エラーメッセージ -->
			<div th:if="${successMessage}"
				class="alert alert-success alert-dismissible fade show" role="alert">
				<span th:text="${successMessage}"></span>
				<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
			</div>
			<div th:if="${errorMessage}"
				class="alert alert-danger alert-dismissible fade show" role="alert">
				<span th:text="${errorMessage}"></span>
				<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
			</div>

			<!-- 統合メインフォーム -->
			<form id="mainForm"
				th:action="${configForm.createMode ? '/accommodation-tax/shoreikin/config/create' : ''}"
				th:object="${configForm}" method="post" novalidate>
				<input type="hidden" th:field="*{shiteiNo}"> <input
					type="hidden" th:field="*{mode}"> <input type="hidden"
					th:field="*{version}">

				<!-- バリデーションエラーサマリー -->
				<div
					th:if="${validationErrors != null and !validationErrors.isEmpty()}"
					class="alert alert-danger alert-dismissible fade show" role="alert">
					<i class="bi bi-exclamation-triangle-fill me-2"></i> 入力内容に <span
						th:text="${validationErrors.size()}"></span> 件のエラーがあります。
					<ul class="mb-0 mt-1">
						<li th:each="err : ${validationErrors}" th:text="${err}"
							class="small"></li>
					</ul>
					<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
				</div>

				<!-- 交付金情報エリア -->
				<div class="card mb-4">
					<div class="card-header">
						<h5 class="mb-0">交付金情報</h5>
					</div>
					<div class="card-body">
						<div class="row g-3">

							<!-- 交付金年度 -->
							<div class="col-md-3">

								<label for="nendo" class="form-label">交付金年度 <span
									class="text-danger">*</span>
								</label> <input type="text" class="form-control" id="nendo"
									th:field="*{nendo}"
									th:readonly="${configForm.viewMode or configForm.editMode}"
									maxlength="4" th:errorclass="is-invalid"
									th:data-initial-value="*{nendo}">

								<div class="invalid-feedback"
									th:if="${#fields.hasErrors('nendo')}" th:errors="*{nendo}"></div>

							</div>

							<!-- 納入税額 -->
							<div class="col-md-3">

								<label for="kofuZeigaku" class="form-label">納入税額 <span
									class="text-danger">*</span>
								</label>

								<div class="input-group">

									<input type="number" class="form-control text-end"
										id="kofuZeigaku" th:field="*{kofuZeigaku}"
										th:readonly="${configForm.viewMode}"
										th:errorclass="is-invalid" step="1" min="0"
										max="99999999999999"
										th:data-initial-value="*{kofuZeigaku}"> <span
										class="input-group-text">円</span>

									<div class="invalid-feedback"
										th:if="${#fields.hasErrors('kofuZeigaku')}"
										th:errors="*{kofuZeigaku}"></div>
								</div>

							</div>

							<!-- 交付率 -->
							<div class="col-md-3">

								<label for="kofuRitsu" class="form-label"> 交付率 </label>

								<div class="input-group">

									<input type="number"
										class="form-control form-control-readonly text-end"
										id="kofuRitsu" th:field="*{kofuRitsu}" readonly
										th:errorclass="is-invalid" step="0.01" min="0"
										max="99999.99" th:data-initial-value="*{kofuRitsu}"> <span
										class="input-group-text">%</span>

									<div class="invalid-feedback"
										th:if="${#fields.hasErrors('kofuRitsu')}"
										th:errors="*{kofuRitsu}"></div>
								</div>

							</div>

							<!-- 交付額 -->
							<div class="col-md-3">

								<label for="kofuGaku" class="form-label"> 交付額 <span
									class="text-danger">*</span>
								</label>

								<div class="input-group">

									<input type="number" class="form-control text-end"
										id="kofuGaku" th:field="*{kofuGaku}"
										th:readonly="${configForm.viewMode}"
										th:errorclass="is-invalid" step="1" min="0"
										max="9999999999999"
										th:data-initial-value="*{kofuGaku}"> <span
										class="input-group-text">円</span>

									<div class="invalid-feedback"
										th:if="${#fields.hasErrors('kofuGaku')}"
										th:errors="*{kofuGaku}"></div>
								</div>

							</div>
						</div>

						<!-- 交付年月日 -->
						<div class="row g-3 mt-2">

							<div class="col-md-3">

								<label for="kofuYmd" class="form-label">交付年月日</label> <input
									type="date" class="form-control" id="kofuYmd"
									th:value="${configForm.kofuYmd != null ? #temporals.format(configForm.kofuYmd, 'yyyy-MM-dd') : ''}"
									name="kofuYmd" th:readonly="${configForm.viewMode}"
									th:data-initial-value="*{kofuYmd}">
							</div>

						</div>

						<!-- 算出ボタン（編集・登録モードのみ） -->
						<div th:if="${configForm.editable}" class="row mt-3">
							<div class="col-12">
								<button type="button" class="btn btn-primary"
									onclick="calculateShoreikin()">
									<i class="bi bi-calculator"></i> 算出
								</button>
								<small class="text-muted ms-2">
									指定年度の賦課情報から納入税額、交付額を自動算出します </small>
							</div>
						</div>
					</div>
				</div>

				<!-- アクションボタン -->
				<div class="d-flex justify-content-center gap-2">

					<a th:href="@{/shoreikin/list}" class="btn btn-outline-primary"
						th:if="${configForm.viewMode}"> <i class="bi bi-arrow-left"></i>
						戻る
					</a> <a href="#" class="btn btn-outline-primary"
						th:unless="${configForm.viewMode}" data-bs-toggle="modal"
						data-bs-target="#backConfirmModal"> <i
						class="bi bi-arrow-left"></i> 戻る
					</a>

					<!-- 登録モード -->
					<div th:if="${configForm.createMode}">
						<button type="button" class="btn btn-success"
							data-bs-toggle="modal" data-bs-target="#createConfirmModal">
							<i class="bi bi-check-circle"></i> 登録する
						</button>
					</div>

					<!-- 編集モード -->
					<div th:if="${configForm.editMode}">
						<button type="button" class="btn btn-success"
							data-bs-toggle="modal" data-bs-target="#updateConfirmModal">
							<i class="bi bi-arrow-repeat"></i> 更新する
						</button>
					</div>

				</div>
			</form>

			<!-- 更新用フォーム（編集モード） -->
			<form th:action="@{/shoreikin/config/update}"
				th:if="${configForm.editMode}" th:object="${configForm}"
				method="post" id="updateForm" style="display: none;">
				<input type="hidden" th:field="*{shiteiNo}"> <input
					type="hidden" th:field="*{nendo}"> <input type="hidden"
					th:field="*{kofuZeigaku}"> <input type="hidden"
					th:field="*{kofuRitsu}"> <input type="hidden"
					th:field="*{kofuGaku}"> <input type="hidden"
					th:value="${configForm.kofuYmd != null ? #temporals.format(configForm.kofuYmd, 'yyyy-MM-dd') : ''}"
					name="kofuYmd"> <input type="hidden" th:field="*{version}">
				<input type="hidden" th:field="*{mode}">
			</form>

			<!-- モード切り替え用共通フォーム -->
			<form th:action="@{/shoreikin/config/switch-mode}"
				th:object="${configForm}" method="post" id="switchModeForm"
				style="display: none;">
				<input type="hidden" id="switchModeField" name="mode" value="">
				<input type="hidden" th:field="*{shiteiNo}"> <input
					type="hidden" th:field="*{nendo}"> <input type="hidden"
					th:field="*{kofuZeigaku}"> <input type="hidden"
					th:field="*{kofuRitsu}"> <input type="hidden"
					th:field="*{kofuGaku}"> <input type="hidden"
					th:value="${configForm.kofuYmd != null ? #temporals.format(configForm.kofuYmd, 'yyyy-MM-dd') : ''}"
					name="kofuYmd"> <input type="hidden" th:field="*{version}">
				<input type="hidden" th:field="*{shisetsuName}"> <input
					type="hidden" th:field="*{name}">
			</form>

			<!-- 算出用フォーム -->
			<form th:action="@{/shoreikin/config/calculate}"
				th:object="${configForm}" method="post" id="calculateForm"
				style="display: none;">
				<input type="hidden" th:field="*{shiteiNo}"> <input
					type="hidden" th:field="*{nendo}"> <input type="hidden"
					th:field="*{kofuRitsu}"> <input type="hidden"
					th:value="${configForm.kofuYmd != null ? #temporals.format(configForm.kofuYmd, 'yyyy-MM-dd') : ''}"
					name="kofuYmd"> <input type="hidden" th:field="*{version}">
				<input type="hidden" th:field="*{mode}"> <input
					type="hidden" th:field="*{shisetsuName}"> <input
					type="hidden" th:field="*{name}">
			</form>

			<!-- 戻る確認モーダル -->
			<div
				th:replace="~{layout/components :: linkConfirmModal('backConfirmModal', '確認', '入力内容が破棄されます。一覧画面に戻りますか？', @{/shoreikin/list}, '戻る')}"></div>
			<!-- 特別徴収義務者指定モーダル -->
			<div th:replace="~{layout/components :: shiteiGassanSearchModal}"></div>

			<!-- 交付率未設定の誘導モーダル。表示要否はサーバ側で判定する -->
			<th:block th:if="${configForm.editable and configForm.kofuRitsu == null}">
				<div
					th:replace="~{layout/components :: linkConfirmModal('kofuRitsuGuideModal', '確認', '交付率が設定されていません。交付率設定画面で登録してください。', @{/admin/kofu-ritsu/list}, '交付率設定へ')}"></div>
			</th:block>

			<!-- 登録確認モーダル -->
			<th:block th:if="${configForm.createMode}">
				<div
					th:replace="~{layout/components :: confirmModal('createConfirmModal', '登録確認', '交付金情報を登録します。よろしいですか？', 'mainForm', 'btn-success', '登録する')}"></div>
			</th:block>

			<!-- 更新確認モーダル -->
			<th:block th:if="${configForm.editMode}">
				<div
					th:replace="~{layout/components :: confirmModal('updateConfirmModal', '更新確認', '交付金情報を更新します。よろしいですか？', 'updateForm', 'btn-success', '更新する')}"></div>
			</th:block>
		</div>

		<th:block layout:fragment="scripts">
			<script th:src="@{/js/shoreikinConfig.js}"></script>
			<script th:src="@{/js/shiteiGassanSearch.js}"></script>
		</th:block>
	</div>
</body>

</html>
