<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>振込先口座照会／登録／編集 - 宿泊税システム</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-12">
                <h2 class="mb-4">振込先口座照会／登録／編集</h2>

                <!-- エラーメッセージ -->
                <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                    <span th:text="${errorMessage}"></span>
                </div>

                <!-- 成功メッセージ -->
                <div th:if="${successMessage}" class="alert alert-success" role="alert">
                    <span th:text="${successMessage}"></span>
                </div>

                <form th:object="${furikomiKozaDto}" method="post" 
                      th:action="${furikomiKozaDto.mode == 'register'} ? @{/shoreikin/furikomiKoza/register} : @{/shoreikin/furikomiKoza/update}">

                    <!-- 特別徴収義務者エリア -->
                    <div class="card mb-4">
                        <div class="card-header">
                            <h5 class="mb-0">特別徴収義務者情報</h5>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-4">
                                    <label class="form-label">指定番号</label>
                                    <input type="text" class="form-control" th:field="*{shiteiNo}" readonly>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">施設名称</label>
                                    <input type="text" class="form-control" th:field="*{shisetsuName}" readonly>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">氏名</label>
                                    <input type="text" class="form-control" th:field="*{shimei}" readonly>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 振込先口座情報エリア -->
                    <div class="card mb-4">
                        <div class="card-header">
                            <h5 class="mb-0">振込先口座情報</h5>
                        </div>
                        <div class="card-body">
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">金融機関コード <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" th:field="*{bankCd}" 
                                           th:readonly="${furikomiKozaDto.mode == 'view'}"
                                           th:classappend="${#fields.hasErrors('bankCd')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('bankCd')}" th:errors="*{bankCd}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">金融機関名 <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" th:field="*{bankName}" 
                                           th:readonly="${furikomiKozaDto.mode == 'view'}"
                                           th:classappend="${#fields.hasErrors('bankName')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('bankName')}" th:errors="*{bankName}"></div>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">支店コード <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" th:field="*{branchCd}" 
                                           th:readonly="${furikomiKozaDto.mode == 'view'}"
                                           th:classappend="${#fields.hasErrors('branchCd')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('branchCd')}" th:errors="*{branchCd}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">支店名 <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" th:field="*{branchName}" 
                                           th:readonly="${furikomiKozaDto.mode == 'view'}"
                                           th:classappend="${#fields.hasErrors('branchName')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('branchName')}" th:errors="*{branchName}"></div>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">預金種目 <span class="text-danger">*</span></label>
                                    <select class="form-select" th:field="*{shumoku}" 
                                            th:disabled="${furikomiKozaDto.mode == 'view'}"
                                            th:classappend="${#fields.hasErrors('shumoku')} ? 'is-invalid' : ''">
                                        <option value="">選択してください</option>
                                        <option value="1">普通</option>
                                        <option value="2">当座</option>
                                    </select>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('shumoku')}" th:errors="*{shumoku}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">口座番号 <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" th:field="*{kozaNo}" 
                                           th:readonly="${furikomiKozaDto.mode == 'view'}"
                                           th:classappend="${#fields.hasErrors('kozaNo')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('kozaNo')}" th:errors="*{kozaNo}"></div>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-12">
                                    <label class="form-label">口座名義 <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" th:field="*{meigi}" 
                                           th:readonly="${furikomiKozaDto.mode == 'view'}"
                                           th:classappend="${#fields.hasErrors('meigi')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('meigi')}" th:errors="*{meigi}"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- ボタンエリア -->
                    <div class="d-flex justify-content-between">
                        <div>
                            <!-- 戻るボタン -->
                            <a href="/shoreikin" class="btn btn-secondary">戻る</a>
                        </div>
                        <div>
                            <!-- 照会画面：編集ボタン -->
                            <a th:if="${furikomiKozaDto.mode == 'view'}" 
                               th:href="@{/shoreikin/furikomiKoza/edit(shiteiNo=${furikomiKozaDto.shiteiNo})}" 
                               class="btn btn-primary">編集する</a>

                            <!-- 登録画面：登録ボタン -->
                            <button th:if="${furikomiKozaDto.mode == 'register'}" 
                                    type="submit" class="btn btn-success">登録する</button>

                            <!-- 編集画面：更新ボタン -->
                            <button th:if="${furikomiKozaDto.mode == 'edit'}" 
                                    type="submit" class="btn btn-primary">更新する</button>
                        </div>
                    </div>

                    <!-- Hidden fields -->
                    <input type="hidden" th:field="*{mode}">
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
