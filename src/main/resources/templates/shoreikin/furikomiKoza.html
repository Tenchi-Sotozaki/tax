<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<head>
	<title>謖ｯ霎ｼ蜈亥哨蠎ｧ辣ｧ莨夲ｼ冗匳骭ｲ・冗ｷｨ髮・/title>
</head>

<body>
	<div layout:fragment="content">
		<div class="container-fluid p-4">
			<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom"
				th:data-is-edit="${kozaForm.editMode}">

				<h5 class="mb-0 fw-bold text-dark">
					謖ｯ霎ｼ蜈亥哨蠎ｧ <span th:if="${kozaForm.viewMode}" class="text-muted">-
						辣ｧ莨・/span> <span th:if="${kozaForm.editMode}" class="text-muted">-
						邱ｨ髮・/span> <span th:if="${kozaForm.createMode}" class="text-muted">-
						逋ｻ骭ｲ</span>
				</h5>

				<div th:if="${kozaForm.viewMode}">
					<button type="button" class="btn btn-primary btn-sm" onclick="editMode()">
						<i class="bi bi-pencil"></i> 邱ｨ髮・☆繧・
					</button>
				</div>
			</div>

			<!-- 迚ｹ蛻･蠕ｴ蜿守ｾｩ蜍呵・ュ蝣ｱ -->
			<div th:replace="~{layout/components :: selectedTokugimuInfo}"></div>

			<!-- 謌仙粥繝ｻ繧ｨ繝ｩ繝ｼ繝｡繝・そ繝ｼ繧ｸ -->
			<div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
				<span th:text="${successMessage}"></span>
				<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
			</div>
			<div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
				<span th:text="${errorMessage}"></span>
				<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
			</div>

			<!-- 邨ｱ蜷医Γ繧､繝ｳ繝輔か繝ｼ繝 -->
			<form th:action="@{${kozaForm.createMode ? '/shoreikin/furikomiKoza/create' : ''}}" th:object="${kozaForm}"
				method="post">
				<input type="hidden" th:field="*{shiteiNo}"> <input type="hidden" th:field="*{mode}"> <input
					type="hidden" th:field="*{version}">


				<!-- 謖ｯ霎ｼ蜈亥哨蠎ｧ諠・ｱ繧ｨ繝ｪ繧｢ -->
				<div class="card mb-4">
					<div class="card-header">
						<h5 class="mb-0">謖ｯ霎ｼ蜈亥哨蠎ｧ諠・ｱ</h5>
					</div>
					<div class="card-body">
						<div class="row g-3">

							<!-- 驥題檮讖滄未繧ｳ繝ｼ繝・-->
							<div class="col-md-3">

								<label for="bankCd" class="form-label">驥題檮讖滄未繧ｳ繝ｼ繝・
									<span class="text-danger">*</span>
								</label>

								<input type="text" class="form-control" id="bankCd" th:field="*{bankCd}"
									th:readonly="${kozaForm.viewMode}" maxlength="4"
									th:classappend="${#fields.hasErrors('bankCd')} ? 'is-invalid' : ''"
									pattern="[0-9]{4}" title="4譯√・謨ｰ蟄励〒蜈･蜉帙＠縺ｦ縺上□縺輔＞" required
									th:data-initial-value="*{bankCd}">

								<div th:if="${#fields.hasErrors('bankCd')}" class="invalid-feedback">
									<span th:errors="*{bankCd}"></span>
								</div>

							</div>

							<!-- 驥題檮讖滄未蜷・-->
							<div class="col-md-3">

								<label for="bankName" class="form-label">
									驥題檮讖滄未蜷・<span class="text-danger">*</span>
								</label>

								<input type="text" class="form-control" id="bankName" th:field="*{bankName}"
									th:readonly="${kozaForm.viewMode}" maxlength="30"
									th:classappend="${#fields.hasErrors('bankName')} ? 'is-invalid' : ''" required
									th:data-initial-value="*{bankName}">

								<div th:if="${#fields.hasErrors('bankName')}" class="invalid-feedback">
									<span th:errors="*{bankName}"></span>
								</div>

							</div>

							<!-- 謾ｯ蠎励さ繝ｼ繝・-->
							<div class="col-md-3">

								<label for="branchCd" class="form-label">
									謾ｯ蠎励さ繝ｼ繝・<span class="text-danger">*</span>
								</label>

								<input type="text" class="form-control" id="branchCd" th:field="*{branchCd}"
									th:readonly="${kozaForm.viewMode}" maxlength="3"
									th:classappend="${#fields.hasErrors('branchCd')} ? 'is-invalid' : ''"
									pattern="[0-9]{3}" title="3譯√・謨ｰ蟄励〒蜈･蜉帙＠縺ｦ縺上□縺輔＞" required
									th:data-initial-value="*{branchCd}">

								<div th:if="${#fields.hasErrors('branchCd')}" class="invalid-feedback">
									<span th:errors="*{branchCd}"></span>
								</div>

							</div>

							<!-- 謾ｯ蠎怜錐 -->
							<div class="col-md-3">

								<label for="branchName" class="form-label">
									謾ｯ蠎怜錐 <span class="text-danger">*</span>
								</label>

								<input type="text" class="form-control" id="branchName" th:field="*{branchName}"
									th:readonly="${kozaForm.viewMode}" maxlength="30"
									th:classappend="${#fields.hasErrors('branchName')} ? 'is-invalid' : ''" required
									th:data-initial-value="*{branchName}">

								<div th:if="${#fields.hasErrors('branchName')}" class="invalid-feedback">
									<span th:errors="*{branchName}"></span>
								</div>

							</div>

						</div>

						<div class="row g-3 mt-2">

							<!-- 鬆宣≡遞ｮ逶ｮ -->
							<div class="col-md-3">

								<label for="shumoku" class="form-label">
									鬆宣≡遞ｮ逶ｮ <span class="text-danger">*</span>
								</label>

								<select class="form-select" id="shumoku" th:field="*{shumoku}"
									th:disabled="${kozaForm.viewMode}"
									th:classappend="${#fields.hasErrors('shumoku')} ? 'is-invalid' : ''" required
									th:data-initial-value="*{shumoku}">
									<option value="">驕ｸ謚槭＠縺ｦ縺上□縺輔＞</option>
									<option value="1">譎ｮ騾・/option>
									<option value="2">蠖灘ｺｧ</option>
								</select>

								<div th:if="${#fields.hasErrors('shumoku')}" class="invalid-feedback">
									<span th:errors="*{shumoku}"></span>
								</div>
							</div>

							<!-- 蜿｣蠎ｧ逡ｪ蜿ｷ -->
							<div class="col-md-3">

								<label for="kozaNo" class="form-label">
									蜿｣蠎ｧ逡ｪ蜿ｷ <span class="text-danger">*</span>
								</label>

								<input type="text" class="form-control" id="kozaNo" th:field="*{kozaNo}"
									th:readonly="${kozaForm.viewMode}" maxlength="7"
									th:classappend="${#fields.hasErrors('kozaNo')} ? 'is-invalid' : ''"
									pattern="[0-9]{7}" title="7譯√・謨ｰ蟄励〒蜈･蜉帙＠縺ｦ縺上□縺輔＞" required
									th:data-initial-value="*{kozaNo}">

								<div th:if="${#fields.hasErrors('kozaNo')}" class="invalid-feedback">
									<span th:errors="*{kozaNo}"></span>
								</div>
							</div>

							<!-- 蜿｣蠎ｧ蜷咲ｾｩ -->
							<div class="col-md-6">

								<label for="meigi" class="form-label">
									蜿｣蠎ｧ蜷咲ｾｩ <span class="text-danger">*</span>
								</label>

								<input type="text" class="form-control" id="meigi" th:field="*{meigi}"
									th:readonly="${kozaForm.viewMode}" maxlength="30"
									th:classappend="${#fields.hasErrors('meigi')} ? 'is-invalid' : ''" required
									th:data-initial-value="*{meigi}">

								<div th:if="${#fields.hasErrors('meigi')}" class="invalid-feedback">
									<span th:errors="*{meigi}"></span>
								</div>
							</div>

						</div>
					</div>
				</div>

				<!-- 繧｢繧ｯ繧ｷ繝ｧ繝ｳ繝懊ち繝ｳ -->
				<div class="d-flex gap-2">

					<!-- 逋ｻ骭ｲ繝｢繝ｼ繝・-->
					<div th:if="${kozaForm.createMode}">
						<button type="submit" class="btn btn-success" onclick="return confirm('謖ｯ霎ｼ蜈亥哨蠎ｧ諠・ｱ繧堤匳骭ｲ縺励∪縺吶°・・)">
							<i class="bi bi-check-circle"></i> 逋ｻ骭ｲ縺吶ｋ
						</button>
					</div>

					<!-- 邱ｨ髮・Δ繝ｼ繝・-->
					<div th:if="${kozaForm.editMode}">
						<button type="button" class="btn btn-success" onclick="updateKoza()">
							<i class="bi bi-arrow-repeat"></i> 譖ｴ譁ｰ縺吶ｋ
						</button>
					</div>

					<a th:href="@{/shoreikin/list}" class="btn btn-secondary" th:if="${kozaForm.viewMode}"> <i
							class="bi bi-arrow-left"></i>
						謌ｻ繧・
					</a> <a th:href="@{/shoreikin/list}" class="btn btn-secondary" th:unless="${kozaForm.viewMode}"
						onclick="return confirm('蜈･蜉帛・螳ｹ縺ｯ遐ｴ譽・＆繧後∪縺吶ゅｈ繧阪＠縺・〒縺吶°・・)"> <i class="bi bi-arrow-left"></i> 謌ｻ繧・
					</a>
				</div>
			</form>

			<!-- 譖ｴ譁ｰ逕ｨ繝輔か繝ｼ繝・育ｷｨ髮・Δ繝ｼ繝会ｼ・-->
			<form th:action="@{/shoreikin/furikomiKoza/update}" th:if="${kozaForm.editMode}" th:object="${kozaForm}"
				method="post" id="updateForm" style="display: none;">
				<input type="hidden" th:field="*{shiteiNo}"> <input type="hidden" th:field="*{name}"> <input
					type="hidden" th:field="*{shisetsuName}"> <input type="hidden" th:field="*{bankCd}"> <input
					type="hidden" th:field="*{bankName}"> <input type="hidden" th:field="*{branchCd}"> <input
					type="hidden" th:field="*{branchName}"> <input type="hidden" th:field="*{shumoku}"> <input
					type="hidden" th:field="*{kozaNo}"> <input type="hidden" th:field="*{meigi}"> <input type="hidden"
					th:field="*{version}"> <input type="hidden" th:field="*{mode}">
			</form>

			<!-- 邱ｨ髮・Δ繝ｼ繝牙・繧頑崛縺育畑繝輔か繝ｼ繝 -->
			<form th:action="@{/shoreikin/furikomiKoza/edit}" th:object="${kozaForm}" method="post" id="editForm"
				style="display: none;">
				<input type="hidden" th:field="*{shiteiNo}"> <input type="hidden" th:field="*{name}"> <input
					type="hidden" th:field="*{shisetsuName}"> <input type="hidden" th:field="*{bankCd}"> <input
					type="hidden" th:field="*{bankName}"> <input type="hidden" th:field="*{branchCd}"> <input
					type="hidden" th:field="*{branchName}"> <input type="hidden" th:field="*{shumoku}"> <input
					type="hidden" th:field="*{kozaNo}"> <input type="hidden" th:field="*{meigi}"> <input type="hidden"
					th:field="*{version}">
			</form>
		</div>

		<!-- 迚ｹ蛻･蠕ｴ蜿守ｾｩ蜍呵・欠螳壹Δ繝ｼ繝繝ｫ -->
		<div th:replace="~{layout/components :: shiteiGassanSearchModal}"></div>
	</div>

	<th:block layout:fragment="scripts">
		<script th:src="@{/js/furikomiKoza.js}"></script>
		<script th:src="@{/js/shiteiGassanSearch.js}"></script>
	</th:block>
</body>

</html>
