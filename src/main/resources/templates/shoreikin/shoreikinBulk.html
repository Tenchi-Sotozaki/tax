<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>特別徴収事務交付金一括算出</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="container-fluid p-4">
            <h2 class="mb-4">特別徴収事務交付金一括算出</h2>

            <!-- 成功・警告・エラーメッセージ -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${warningMessage}" class="alert alert-warning alert-dismissible fade show" role="alert">
                <span th:text="${warningMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- 対象条件エリア -->
            <form th:action="@{/shoreikin/bulk/execute}" th:object="${bulkForm}" method="post">
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">対象条件</h5>
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <!-- 交付金年度 -->
                            <div class="col-md-3">
                                <label for="nendo" class="form-label">交付金年度 <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="nendo" th:field="*{nendo}" 
                                       maxlength="4" required placeholder="例：2026">
                            </div>

                            <!-- 交付率 -->
                            <div class="col-md-3">
                                <label for="kofuRitsu" class="form-label">交付率</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" id="kofuRitsu" 
                                           th:value="${bulkForm.kofuRitsu}" readonly>
                                    <span class="input-group-text">%</span>
                                </div>
                                <input type="hidden" th:field="*{kofuRitsu}">
                            </div>

                            <!-- 対象件数表示 -->
                            <div class="col-md-3" th:if="${bulkForm.nendo != null and !bulkForm.nendo.isEmpty()}">
                                <label class="form-label">対象件数</label>
                                <div class="form-control-plaintext">
                                    <span th:text="${bulkForm.targetCount}" class="fw-bold text-primary"></span> 件
                                </div>
                            </div>
                        </div>

                        <div class="row mt-3">
                            <div class="col-12">
                                <button type="submit" class="btn btn-primary me-2"
                                        onclick="return confirm('交付金を一括算出しますか？')">
                                    <i class="bi bi-calculator"></i> 一括算出実行
                                </button>
                                <a th:href="@{/shoreikin/list}" class="btn btn-secondary">
                                    <i class="bi bi-arrow-left"></i> 戻る
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </form>

            <!-- 処理結果エリア -->
            <div th:if="${bulkForm.executed}" class="card">
                <div class="card-header">
                    <h5 class="mb-0">処理結果</h5>
                </div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <div class="card text-center bg-light">
                                <div class="card-body">
                                    <h6 class="card-title text-muted">対象件数</h6>
                                    <h4 class="card-text text-info" th:text="${bulkForm.targetCount}">0</h4>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="card text-center bg-light">
                                <div class="card-body">
                                    <h6 class="card-title text-muted">処理成功</h6>
                                    <h4 class="card-text text-success" th:text="${bulkForm.successCount}">0</h4>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="card text-center bg-light">
                                <div class="card-body">
                                    <h6 class="card-title text-muted">処理失敗</h6>
                                    <h4 class="card-text text-danger" th:text="${bulkForm.failureCount}">0</h4>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="card text-center bg-light">
                                <div class="card-body">
                                    <h6 class="card-title text-muted">処理率</h6>
                                    <h4 class="card-text text-primary">
                                        <span th:if="${bulkForm.targetCount > 0}"
                                              th:text="${#numbers.formatDecimal((bulkForm.successCount * 100.0) / bulkForm.targetCount, 1, 1)}">0</span>
                                        <span th:if="${bulkForm.targetCount == 0}">0</span>%
                                    </h4>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="mt-3">
                        <div class="alert alert-info">
                            <i class="bi bi-info-circle me-2"></i>
                            <span th:text="${bulkForm.resultMessage}"></span>
                        </div>
                    </div>

                    <div class="mt-3">
                        <a th:href="@{/shoreikin/list}" class="btn btn-success">
                            <i class="bi bi-list-ul"></i> 交付金一覧に戻る
                        </a>
                    </div>
                </div>
            </div>

            <!-- 注意事項 -->
            <div class="card mt-4">
                <div class="card-header">
                    <h6 class="mb-0 text-warning">
                        <i class="bi bi-exclamation-triangle me-2"></i>注意事項
                    </h6>
                </div>
                <div class="card-body">
                    <ul class="mb-0 small text-muted">
                        <li>指定した年度の賦課情報を基に、特別徴収義務者ごとの交付金を算出します。</li>
                        <li>既に交付金が算出済みの義務者は処理対象外となります。</li>
                        <li>交付率は固定値（3%）が適用されます。</li>
                        <li>処理には時間がかかる場合があります。実行後はしばらくお待ちください。</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
