<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">

<head>
<title>特別徴収義務者の選択</title>
</head>

<body>
	<div layout:fragment="content" class="container-fluid p-4">

		<!-- ページヘッダー -->
		<div class="d-flex justify-content-between align-items-center pb-2 mb-3 border-bottom">
			<h5 class="mb-0 fw-bold text-dark">
				<i class="bi bi-people text-primary me-2"></i>
				<span th:text="${targetName}">特別徴収義務者の選択</span>
			</h5>
		</div>

		<div class="card shadow-sm">
			<div class="card-body text-center py-5">
				<i class="bi bi-search fs-1 text-secondary d-block mb-3"></i>
				<p class="mb-4">
					<span th:text="${targetName}">この画面</span>を表示するには、対象の特別徴収義務者を選択してください。
				</p>
				<button type="button" class="btn btn-primary px-4" data-bs-toggle="modal"
					data-bs-target="#shiteiGassanSearchModal">
					<i class="bi bi-search me-1"></i>特別徴収義務者を指定する
				</button>
			</div>
		</div>

		<!-- 特別徴収義務者指定モーダル -->
		<div th:replace="~{layout/components :: shiteiGassanSearchModal}"></div>
	</div>

	<th:block layout:fragment="scripts">
		<script th:src="@{/js/shiteiGassanSearch.js}"></script>
		<script>
			// 画面表示時に指定モーダルを自動で開く。
			// 選択するとセッションに保存されたうえで再読み込みされ、目的の画面へ遷移する。
			document.addEventListener('DOMContentLoaded', function () {
				var modal = document.getElementById('shiteiGassanSearchModal');
				if (modal) {
					new bootstrap.Modal(modal).show();
				}
			});
		</script>
	</th:block>
</body>

</html>
