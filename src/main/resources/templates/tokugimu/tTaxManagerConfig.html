<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">

<head>
	<title th:text="${(isView ?: false) ? '邏咲ｨ守ｮ｡逅・ｺｺ辣ｧ莨・ : ((isEdit ?: false) ? '邏咲ｨ守ｮ｡逅・ｺｺ邱ｨ髮・ : '邏咲ｨ守ｮ｡逅・ｺｺ逋ｻ骭ｲ')}">邏咲ｨ守ｮ｡逅・ｺｺ逋ｻ骭ｲ/邱ｨ髮・/title>
</head>

<body>
	<div layout:fragment="content" class="container-fluid p-4">

		<div
			class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
			<h5 class="mb-0 fw-bold text-dark">
				<i class="bi bi-person-lines-fill me-2 text-primary" th:if="${isView ?: false}"></i> <i
					class="bi bi-person-gear me-2 text-primary" th:unless="${isView ?: false}"></i> <span
					th:text="${(isView ?: false) ? '邏咲ｨ守ｮ｡逅・ｺｺ辣ｧ莨・ : ((isEdit ?: false) ? '邏咲ｨ守ｮ｡逅・ｺｺ邱ｨ髮・ : '邏咲ｨ守ｮ｡逅・ｺｺ逋ｻ骭ｲ')}"></span>
			</h5>

			<a th:href="@{/tax-manager/edit/{id}(id=${taxManagerForm.shiteiNo})}" class="btn btn-primary btn-sm"
				th:if="${isView ?: false}"> <i class="bi bi-pencil-square me-2"></i>邱ｨ髮・☆繧・
			</a>
		</div>

		<!-- 迚ｹ蛻･蠕ｴ蜿守ｾｩ蜍呵・ュ蝣ｱ -->
		<div th:replace="~{layout/components :: selectedTokugimuInfo}"></div>

		<div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
			<i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>
		<div th:if="${infoMessage}" class="alert alert-info alert-dismissible fade show" role="alert">
			<i class="bi bi-info-circle-fill me-2"></i><span th:text="${infoMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>
		<div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
			<i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>

		<form id="taxManagerForm" th:action="@{/tax-manager/save/{id}(id=${taxManagerForm.shiteiNo})}"
			th:object="${taxManagerForm}" method="post">

			<input type="hidden" th:field="*{collectorId}" /> <input type="hidden" th:field="*{edit}" /> <input
				type="hidden" th:field="*{shiteiNo}" /> <input type="hidden" th:field="*{atenaNo}" /> <input
				type="hidden" th:field="*{obligorAtenaNo}" />

			<div th:if="${validationErrors != null and !validationErrors.isEmpty()}"
				class="alert alert-danger alert-dismissible fade show" role="alert">
				<i class="bi bi-exclamation-triangle-fill me-2"></i> 蜈･蜉帛・螳ｹ縺ｫ <span
					th:text="${validationErrors.size()}"></span> 莉ｶ縺ｮ繧ｨ繝ｩ繝ｼ縺後≠繧翫∪縺吶・
				<ul class="mb-0 mt-1">
					<li th:each="err : ${validationErrors}" th:text="${err}" class="small"></li>
				</ul>
				<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
			</div>

			<div th:if="${!(isView ?: false)}" class="mb-3">
				<div id="atenaCheckMessage" class="alert alert-sm p-2 mb-0" style="display: none;"></div>
			</div>

			<div class="card mb-4 shadow-sm">
				<div class="card-header py-3">
					<h5 class="mb-0">
						<i class="bi bi-person-vcard me-2"></i>邏咲ｨ守ｮ｡逅・ｺｺ諠・ｱ
					</h5>
				</div>
				<div class="card-body bg-light-subtle">
					<div class="row g-3">
						<div class="col-md-4" th:if="${!(isView ?: false)}">
							<label for="registrationDate" class="form-label fw-medium">
								逋ｻ骭ｲ譌･ <span class="text-danger">*</span>
							</label> <input type="date" class="form-control" th:field="*{registrationDate}"
								th:readonly="${isView ?: false}" th:data-initial-value="*{registrationDate}"
								th:classappend="${#fields.hasErrors('registrationDate')} ? 'is-invalid'">
							<div class="invalid-feedback" th:if="${#fields.hasErrors('registrationDate')}"
								th:errors="*{registrationDate}"></div>
						</div>

						<div class="col-md-4" th:if="${!(isView ?: false)}">
							<label for="declarationDate" class="form-label fw-medium">
								逕ｳ蜻頑律 <span class="text-danger">*</span>
							</label> <input type="date" class="form-control" th:field="*{declarationDate}"
								th:readonly="${isView ?: false}" th:data-initial-value="*{declarationDate}"
								th:classappend="${#fields.hasErrors('declarationDate')} ? 'is-invalid'">
							<div class="invalid-feedback" th:if="${#fields.hasErrors('declarationDate')}"
								th:errors="*{declarationDate}"></div>
						</div>

						<!-- 辣ｧ莨夂判髱｢縺ｧ縺ｮ陦ｨ遉ｺ -->
						<div class="col-md-4" th:if="${isView ?: false}">
							<label class="form-label fw-medium">逋ｻ骭ｲ譌･</label> <input type="text" class="form-control"
								readonly th:value="*{registrationDate}">
						</div>

						<div class="col-md-4" th:if="${isView ?: false}">
							<label class="form-label fw-medium">逕ｳ蜻頑律</label> <input type="text" class="form-control"
								readonly th:value="*{declarationDate}">
						</div>

						<div class="col-md-4 d-flex align-items-end" th:if="${!(isView ?: false)}">
							<button type="button" class="btn btn-outline-primary" data-bs-toggle="modal"
								data-bs-target="#addressSearchModal">
								<i class="bi bi-search me-1"></i>螳帛錐讀懃ｴ｢
							</button>
						</div>

						<div class="col-md-6">
							<label class="form-label fw-medium">菴乗園(驛ｵ萓ｿ逡ｪ蜿ｷ)</label> <input type="text" class="form-control"
								id="managerYubinNo" th:field="*{managerYubinNo}" readonly
								th:data-initial-value="*{managerYubinNo}"
								th:classappend="${#fields.hasErrors('managerYubinNo')} ? 'is-invalid'">
							<div class="invalid-feedback" th:if="${#fields.hasErrors('managerYubinNo')}"
								th:errors="*{managerYubinNo}"></div>
						</div>

						<div class="col-md-6">
							<label class="form-label fw-medium">菴乗園・域園蝨ｨ蝨ｰ・・/label> <input type="text" class="form-control"
								id="managerAddress" th:field="*{managerAddress}" readonly
								th:classappend="${#fields.hasErrors('managerAddress')} ? 'is-invalid'"
								th:data-initial-value="*{managerAddress}">
							<div class="invalid-feedback" th:if="${#fields.hasErrors('managerAddress')}"
								th:errors="*{managerAddress}"></div>
						</div>

						<div class="col-md-6">
							<label class="form-label fw-medium">豌丞錐</label> <input type="text" class="form-control"
								id="managerName" th:field="*{managerName}" readonly
								th:data-initial-value="*{managerName}"
								th:classappend="${#fields.hasErrors('managerName')} ? 'is-invalid'">
							<div class="invalid-feedback" th:if="${#fields.hasErrors('managerName')}"
								th:errors="*{managerName}"></div>
						</div>

						<div class="col-md-6">
							<label class="form-label fw-medium">縺ｵ繧翫′縺ｪ</label> <input type="text" class="form-control"
								id="managerNameKana" th:field="*{managerNameKana}" readonly
								th:data-initial-value="*{managerNameKana}"
								th:classappend="${#fields.hasErrors('managerNameKana')} ? 'is-invalid'">
							<div class="invalid-feedback" th:if="${#fields.hasErrors('managerNameKana')}"
								th:errors="*{managerNameKana}"></div>
						</div>

						<div class="col-md-6">
							<label class="form-label fw-medium">髮ｻ隧ｱ逡ｪ蜿ｷ</label> <input type="tel" class="form-control"
								id="managerPhone" th:field="*{managerPhone}" readonly
								th:data-initial-value="*{managerPhone}"
								th:classappend="${#fields.hasErrors('managerPhone')} ? 'is-invalid'">
							<div class="invalid-feedback" th:if="${#fields.hasErrors('managerPhone')}"
								th:errors="*{managerPhone}"></div>
						</div>

						<div class="col-md-6 d-flex align-items-end">
							<div class="form-check">
								<input class="form-check-input" type="checkbox" th:field="*{exemptionFlag}"
									id="exemptionFlag" th:disabled="${isView ?: false}"
									th:data-initial-value="*{exemptionFlag}"> <label class="form-check-label fw-medium"
									for="exemptionFlag">驕ｸ莉ｻ蜈埼勁</label>
							</div>
						</div>

						<div class="col-md-12" id="exemptionReasonArea" style="display: none;">
							<label for="exemptionReason" class="form-label fw-medium">驕ｸ莉ｻ蜈埼勁逅・罰
								<span class="text-danger" th:if="${!(isView ?: false)}">*</span>
							</label>
							<textarea class="form-control" id="exemptionReason" rows="3" th:field="*{exemptionReason}"
								th:readonly="${isView ?: false}" th:data-initial-value="*{exemptionReason}"></textarea>
							<div class="invalid-feedback" th:if="${#fields.hasErrors('exemptionReason')}"
								th:errors="*{exemptionReason}"></div>
						</div>
					</div>
				</div>
			</div>

			<div class="d-flex justify-content-center gap-3 py-4 mb-5">
				<button type="submit" class="btn btn-success btn-lg px-5" th:if="${!(isView ?: false)}">
					<i class="bi bi-save me-2"></i> <span th:text="${(isEdit ?: false) ? '譖ｴ譁ｰ縺吶ｋ' : '逋ｻ骭ｲ縺吶ｋ'}"></span>
				</button>

				<!-- 邱ｨ髮・凾縺ｮ縺ｿ蜑企勁繝懊ち繝ｳ繧定｡ｨ遉ｺ -->
				<button type="button" class="btn btn-danger btn-lg px-5"
					th:if="${(isEdit ?: false) and !(isView ?: false)}" data-bs-toggle="modal"
					data-bs-target="#deleteConfirmModal">
					<i class="bi bi-trash me-2"></i>蜑企勁縺吶ｋ
				</button>

				<a th:href="@{/tokugimu/list}" class="btn btn-outline-secondary btn-lg px-4" th:if="${isView ?: false}">
					<i class="bi bi-arrow-left me-2"></i>荳隕ｧ縺ｫ謌ｻ繧・
				</a> <a th:href="@{/tokugimu/list}" class="btn btn-outline-secondary btn-lg px-4"
					th:unless="${isView ?: false}" onclick="return confirm('蜈･蜉帛・螳ｹ縺ｯ遐ｴ譽・＆繧後∪縺吶ゅｈ繧阪＠縺・〒縺吶°・・)"> <i
						class="bi bi-arrow-left me-2"></i>荳隕ｧ縺ｫ謌ｻ繧・

				</a>
			</div>
		</form>

		<div th:replace="~{layout/components :: addressSearchModal}"></div>
		<!-- 迚ｹ蛻･蠕ｴ蜿守ｾｩ蜍呵・欠螳壹Δ繝ｼ繝繝ｫ -->
		<div th:replace="~{layout/components :: shiteiGassanSearchModal}"></div>
	</div>

	<th:block layout:fragment="scripts">
		<script th:src="@{/js/tTaxManagerConfig.js}"></script>
		<script th:src="@{/js/shiteiGassanSearch.js}"></script>
	</th:block>
</body>

</html>
