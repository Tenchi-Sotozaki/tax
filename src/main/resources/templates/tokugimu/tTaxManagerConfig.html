<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">

<head>
<title
	th:text="${(isView ?: false) ? '納税管理人照会' : ((isEdit ?: false) ? '納税管理人編集' : '納税管理人登録')}">納税管理人登録/編集</title>
</head>

<body>
	<div layout:fragment="content" class="container-fluid p-4">

		<div
			class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
			<h5 class="mb-0 fw-bold text-dark">
				<i class="bi bi-person-lines-fill me-2 text-primary"
					th:if="${isView ?: false}"></i> <i
					class="bi bi-person-gear me-2 text-primary"
					th:unless="${isView ?: false}"></i> <span
					th:text="${(isView ?: false) ? '納税管理人照会' : ((isEdit ?: false) ? '納税管理人変更' : '納税管理人登録')}"></span>
			</h5>

			<a th:href="@{/tax-manager/edit}"
				class="btn btn-primary" th:if="${isView ?: false}"> <i
				class="bi bi-pencil-square me-2"></i>変更する
			</a>
		</div>

		<!-- 履歴ナビゲーション（照会画面のみ） -->
		<div
			th:if="${(isView ?: false) and taxManagerForm.maxRno != null and taxManagerForm.maxRno > 1}"
			class="d-flex align-items-center gap-2 mb-3">
			<a
				th:href="@{/tax-manager/view(rno=${taxManagerForm.rno - 1})}"
				class="btn btn-outline-secondary"
				th:classappend="${taxManagerForm.rno <= taxManagerForm.minRno} ? ' disabled'">
				<i class="bi bi-chevron-left"></i> 前の履歴
			</a> <span class="text-muted small">履歴 <span
				th:text="${taxManagerForm.rno}"></span> / <span
				th:text="${taxManagerForm.maxRno}"></span></span> <a
				th:href="@{/tax-manager/view(rno=${taxManagerForm.rno + 1})}"
				class="btn btn-outline-secondary"
				th:classappend="${taxManagerForm.rno >= taxManagerForm.maxRno} ? ' disabled'">
			次の履歴 <i class="bi bi-chevron-right"></i>
			</a>
		</div>

		<!-- 特別徴収義務者情報 -->
		<div th:replace="~{layout/components :: selectedTokugimuInfo}"></div>

		<div th:if="${successMessage}"
			class="alert alert-success alert-dismissible fade show" role="alert">
			<i class="bi bi-check-circle-fill me-2"></i><span
				th:text="${successMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>
		<div th:if="${infoMessage}"
			class="alert alert-info alert-dismissible fade show" role="alert">
			<i class="bi bi-info-circle-fill me-2"></i><span
				th:text="${infoMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>
		<div th:if="${errorMessage}"
			class="alert alert-danger alert-dismissible fade show" role="alert">
			<i class="bi bi-exclamation-triangle-fill me-2"></i><span
				th:text="${errorMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>

		<form id="taxManagerForm"
			th:action="@{/tax-manager/save}"
			th:object="${taxManagerForm}" method="post">

			<input type="hidden" th:field="*{collectorId}" /> 
			<input type="hidden" th:field="*{edit}" />
			<input type="hidden" th:field="*{shiteiNo}" />
			<input type="hidden" th:field="*{atenaNo}" />
			<input type="hidden" th:field="*{obligorAtenaNo}" />
			<input type="hidden" id="sessionObligorAtenaNo" th:value="${selectedShiteiGassan?.atenaNo}" />

			<div
				th:if="${validationErrors != null and !validationErrors.isEmpty()}"
				class="alert alert-danger alert-dismissible fade show" role="alert">
				<i class="bi bi-exclamation-triangle-fill me-2"></i> 入力内容に <span
					th:text="${validationErrors.size()}"></span> 件のエラーがあります。
				<ul class="mb-0 mt-1">
					<li th:each="err : ${validationErrors}" th:text="${err}"
						class="small"></li>
				</ul>
				<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
			</div>

			<div th:if="${!(isView ?: false)}" class="mb-3">
				<div id="atenaCheckMessage" class="alert alert-sm p-2 mb-0"
					style="display: none;"></div>
			</div>

			<div class="card mb-4 shadow-sm">
				<div class="card-header py-3">
					<h5 class="mb-0">
						<i class="bi bi-person-vcard me-2"></i>納税管理人情報
					</h5>
				</div>
				<div class="card-body bg-light-subtle">
					<div class="row g-3">
						<div class="col-md-2" th:if="${!(isView ?: false)}">
							<label for="registrationDate" class="form-label fw-medium">
								登録年月日 <span class="text-danger">*</span>
							</label> <input type="date" class="form-control"
								th:field="*{registrationDate}" th:readonly="${isView ?: false}"
								th:classappend="(${isView ?: false} ? ' form-control-readonly' : '') + (${#fields.hasErrors('registrationDate')} ? ' is-invalid' : '')"
								th:data-initial-value="*{registrationDate}">
							<div class="invalid-feedback"
								th:if="${#fields.hasErrors('registrationDate')}"
								th:errors="*{registrationDate}"></div>
						</div>

						<div class="col-md-2" th:if="${!(isView ?: false)}">
							<label for="declarationDate" class="form-label fw-medium">
								申告年月日 <span class="text-danger">*</span>
							</label> <input type="date" class="form-control"
								th:field="*{declarationDate}" th:readonly="${isView ?: false}"
								th:classappend="(${isView ?: false} ? ' form-control-readonly' : '') + (${#fields.hasErrors('declarationDate')} ? ' is-invalid' : '')"
								th:data-initial-value="*{declarationDate}">
							<div class="invalid-feedback"
								th:if="${#fields.hasErrors('declarationDate')}"
								th:errors="*{declarationDate}"></div>
						</div>

						<!-- 照会画面での表示 -->
						<div class="col-md-2" th:if="${isView ?: false}">
							<label class="form-label fw-medium">登録年月日</label> <input
								type="text" class="form-control form-control-readonly" readonly
								th:value="*{registrationDate}">
						</div>

						<div class="col-md-2" th:if="${isView ?: false}">
							<label class="form-label fw-medium">申告年月日</label> <input
								type="text" class="form-control form-control-readonly" readonly
								th:value="*{declarationDate}">
						</div>
						
						<div class="col-md-2">
							<label class="form-label fw-medium">区分</label> 
							<select class="form-select" th:field="*{kbn}" id="kbn"
								th:disabled="${isView ?: false}" th:data-initial-value="*{kbn}"> 
								<option value="1">承認</option>
								<option value="2">不承認</option>
								<option value="3">選任免除</option>
							</select>
						</div>

						<div class="col-md-4 d-flex align-items-end"
							th:if="${!(isView ?: false)}">
							<button type="button" class="btn btn-primary"
								data-bs-toggle="modal" data-bs-target="#addressSearchModal">
								<i class="bi bi-search me-1"></i>宛名検索
							</button>
						</div>
						
						<div class="col-md-4" th:if="${isView}"></div>
						
						<div class="col-md-2"></div>

						<div class="col-md-2">
							<label class="form-label fw-medium">住所(郵便番号)</label> <input
								type="text" class="form-control form-control-readonly" id="managerYubinNo"
								th:field="*{managerYubinNo}" readonly
								th:data-initial-value="*{managerYubinNo}"
								th:classappend="${#fields.hasErrors('managerYubinNo')} ? 'is-invalid'"
								placeholder="宛名検索モーダルから自動入力">
							<div class="invalid-feedback"
								th:if="${#fields.hasErrors('managerYubinNo')}"
								th:errors="*{managerYubinNo}"></div>
						</div>

						<div class="col-md-6">
							<label class="form-label fw-medium">住所（所在地）</label> <input
								type="text" class="form-control form-control-readonly" id="managerAddress"
								th:field="*{managerAddress}" readonly
								th:classappend="${#fields.hasErrors('managerAddress')} ? 'is-invalid'"
								th:data-initial-value="*{managerAddress}"
								placeholder="宛名検索モーダルから自動入力">
							<div class="invalid-feedback"
								th:if="${#fields.hasErrors('managerAddress')}"
								th:errors="*{managerAddress}"></div>
						</div>
						
						<div class="col-md-4"></div>

						<div class="col-md-4">
							<label class="form-label fw-medium">氏名</label> <input type="text"
								class="form-control form-control-readonly" id="managerName" th:field="*{managerName}"
								readonly th:data-initial-value="*{managerName}"
								th:classappend="${#fields.hasErrors('managerName')} ? 'is-invalid'"
								placeholder="宛名検索モーダルから自動入力">
							<div class="invalid-feedback"
								th:if="${#fields.hasErrors('managerName')}"
								th:errors="*{managerName}"></div>
						</div>

						<div class="col-md-4">
							<label class="form-label fw-medium">ふりがな</label> <input
								type="text" class="form-control form-control-readonly" id="managerNameKana"
								th:field="*{managerNameKana}" readonly
								th:data-initial-value="*{managerNameKana}"
								th:classappend="${#fields.hasErrors('managerNameKana')} ? 'is-invalid'"
								placeholder="宛名検索モーダルから自動入力">
							<div class="invalid-feedback"
								th:if="${#fields.hasErrors('managerNameKana')}"
								th:errors="*{managerNameKana}"></div>
						</div>

						<div class="col-md-4">
							<label class="form-label fw-medium">電話番号</label> <input
								type="tel" class="form-control form-control-readonly" id="managerPhone"
								th:field="*{managerPhone}" readonly
								th:data-initial-value="*{managerPhone}"
								th:classappend="${#fields.hasErrors('managerPhone')} ? 'is-invalid'"
								placeholder="宛名検索モーダルから自動入力">
							<div class="invalid-feedback"
								th:if="${#fields.hasErrors('managerPhone')}"
								th:errors="*{managerPhone}"></div>
						</div>

						<div class="col-md-12" id="reasonArea"
							style="display: none;">
							<label for="reason" class="form-label fw-medium">理由
								<span class="text-danger" th:if="${!(isView ?: false)}">*</span>
							</label>
							<textarea class="form-control" id="reason" rows="3"
								th:field="*{reason}" th:readonly="${isView ?: false}"
								th:classappend="${isView ?: false} ? ' form-control-readonly' : ''"
								th:data-initial-value="*{reason}"></textarea>
							<div class="invalid-feedback"
								th:if="${#fields.hasErrors('reason')}"
								th:errors="*{reason}"></div>
						</div>
					</div>
				</div>
			</div>

			<div class="d-flex justify-content-center gap-3 py-4 mb-5">

				<a href="#"
					class="btn btn-outline-secondary px-4"
					th:if="${(isEdit ?: false) and !(isView ?: false)}"
					data-bs-toggle="modal" data-bs-target="#backConfirmModal"> <i
					class="bi bi-arrow-left me-2"></i>戻る
				</a>

				<!-- 編集時のみ削除ボタンを表示 -->
				<button type="button" class="btn btn-danger px-5"
					th:if="${(isEdit ?: false) and !(isView ?: false)}"
					data-bs-toggle="modal" data-bs-target="#deleteConfirmModal">
					<i class="bi bi-trash me-2"></i>削除する
				</button>

				<button type="submit" class="btn btn-success px-5"
					th:if="${!(isView ?: false)}">
					<i class="bi bi-save me-2"></i> <span
						th:text="${(isEdit ?: false) ? '更新する' : '登録する'}"></span>
				</button>

			</div>
		</form>

		<div th:unless="${isView ?: false}" th:replace="~{layout/components :: linkConfirmModal('backConfirmModal', '確認', '入力内容が破棄されます。よろしいですか？', @{/tax-manager/view}, '戻る')}"></div>

		<div th:replace="~{layout/components :: addressSearchModal}"></div>
		<!-- 特別徴収義務者指定モーダル -->
		<div th:replace="~{layout/components :: shiteiGassanSearchModal}"></div>
		<!-- セッション未設定時にモーダルを自動オープンするフラグ -->
		<div th:if="${showShiteiModal ?: false}" data-show-shitei-modal="true"></div>
	</div>

	<th:block layout:fragment="scripts">
		<script th:src="@{/js/tTaxManagerConfig.js}"></script>
		<script th:src="@{/js/shiteiGassanSearch.js}"></script>
	</th:block>
</body>

</html>
