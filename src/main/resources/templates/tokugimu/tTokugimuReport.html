<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">
<head>
<title>帳票発行</title>
</head>
<body>
	<div layout:fragment="content" class="container-fluid px-4 py-3">

		<!-- ページヘッダー -->
		<div
			class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
			<h5 class="mb-0 fw-bold text-dark">
				<i class="bi bi-printer text-primary me-2"></i>帳票発行
			</h5>
		</div>

		<!-- エラーメッセージ -->
		<div th:if="${errorMessage}"
			class="alert alert-danger alert-dismissible fade show" role="alert">
			<span th:text="${errorMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"
				aria-label="閉じる"></button>
		</div>

		<!-- 特別徴収義務者情報 -->
		<div>
			<div th:replace="~{layout/components :: selectedTokugimuInfo(true)}"></div>
		</div>

		<!-- 帳票ボタン一覧 -->
		<div class="card shadow-sm">
			<div class="card-body">
				<div class="d-grid gap-2" style="max-width: 500px;">
					<button type="button" class="btn btn-outline-primary text-start"
						id="btnReportTokugimuShiteiTsuchi">特別徴収義務者指定通知書</button>
					<button type="button" class="btn btn-outline-primary text-start"
						id="btnReportTokugimuJuriTsuchi">特別徴収義務者申請受理通知書</button>
					<button type="button" class="btn btn-outline-primary text-start"
						id="btnReportNozeiKanrinin">納税管理人承認(不承認)通知書</button>
					<button type="button" class="btn btn-outline-primary text-start"
						id="btnReportNozeiMenjo">納税管理人選任免除認定(不認定)通知書</button>
					<button type="button" class="btn btn-outline-primary text-start"
						id="btnReportTokureiShitei">納入申告書の提出期限等の特例適用者指定通知書</button>
					<button type="button" class="btn btn-outline-primary text-start"
						id="btnReportTokureiTorikeshi">納入申告書の提出期限等の特例適用者指定取消通知書</button>
					<button type="button" class="btn btn-outline-primary text-start"
						id="btnReportNonyusho">納入書</button>
					<button type="button" class="btn btn-outline-primary text-start"
						id="btnReportKanpu">宿泊税還付・納入義務の免除決定通知書</button>
					<button type="button" class="btn btn-outline-primary text-start"
						id="btnReportKosei">宿泊税更正・決定通知書</button>
					<button type="button" class="btn btn-outline-primary text-start"
						id="btnReportGassan">合算申告納入承認通知書</button>
					<button type="button" class="btn btn-outline-primary text-start"
						id="btnReportShoreikinKetteiTsuchiShinsei">交付金決定通知書・交付申請書</button>
				</div>
			</div>
		</div>
		<!-- 特別徴収義務者指定モーダル -->
		<div th:replace="~{layout/components :: shiteiGassanSearchModal}"></div>

	</div>

	<th:block layout:fragment="scripts">
		<!-- 指定番号をJavaScriptで取得できるように隠し要素として配置 -->
		<span id="shiteiNoData" style="display: none;" th:text="${shiteiNo}"></span>
		<script th:src="@{/js/tTokugimuReport.js}"></script>
		<script th:src="@{/js/shiteiGassanSearch.js}"></script>
	</th:block>

</body>
</html>
