<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">

<head>
<title
	th:text="${(isView ?: false) ? '適用納税周期照会' : ((isEdit ?: false) ? '適用納税周期編集' : '適用納税周期登録')}">適用納税周期登録/編集</title>
</head>

<body>
	<div layout:fragment="content" class="container-fluid p-4">

		<div
			class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
			<h5 class="mb-0 fw-bold text-dark">
				<i class="bi bi-calendar-check me-2 text-success"></i> <span
					th:text="${(isView ?: false) ? '適用納税周期照会' : ((isEdit ?: false) ? '適用納税周期編集' : '適用納税周期登録')}"></span>
			</h5>
			<a
				th:href="@{/tekiyo-nozei-shuki/edit/{id}(id=${tekiyoNozeiShukiForm.shiteiNo})}"
				class="btn btn-primary btn-sm" th:if="${isView ?: false}"> <i
				class="bi bi-pencil-square me-2"></i>編集する
			</a>
		</div>

		<div th:replace="~{layout/components :: selectedTokugimuInfo}"></div>

		<div th:if="${successMessage}"
			class="alert alert-success alert-dismissible fade show" role="alert">
			<i class="bi bi-check-circle-fill me-2"></i><span
				th:text="${successMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>
		<div th:if="${infoMessage}"
			class="alert alert-info alert-dismissible fade show" role="alert">
			<i class="bi bi-info-circle-fill me-2"></i><span
				th:text="${infoMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>
		<div th:if="${errorMessage}"
			class="alert alert-danger alert-dismissible fade show" role="alert">
			<i class="bi bi-exclamation-triangle-fill me-2"></i><span
				th:text="${errorMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>

		<form
			th:action="@{/tekiyo-nozei-shuki/save/{id}(id=${tekiyoNozeiShukiForm.shiteiNo})}"
			th:object="${tekiyoNozeiShukiForm}" method="post">

			<input type="hidden" th:field="*{shiteiNo}" /> <input type="hidden"
				th:field="*{edit}" />

			<div class="card mb-4 shadow-sm">
				<div class="card-header py-3">
					<h5 class="mb-0">
						<i class="bi bi-calendar3 me-2"></i>納税周期情報
					</h5>
				</div>
				<div class="card-body bg-light-subtle">
					<div class="row g-3">

						<div class="col-md-4">
							<label class="form-label fw-medium"> 納税周期 <span
								class="text-danger" th:if="${!(isView ?: false)}">*</span>
							</label> <select class="form-select" th:field="*{seq}"
								th:disabled="${isView ?: false}" th:data-initial-value="*{seq}">
								<option value="">-- 選択してください --</option>
								<option th:each="opt : ${nozeiShukiOptions}"
									th:value="${opt.seq}" th:text="${opt.label}"></option>
							</select>
						</div>

						<div class="col-md-4">
							<label class="form-label fw-medium"> 適用開始年月日 <span
								class="text-danger" th:if="${!(isView ?: false)}">*</span>
							</label> <input th:if="${!(isView ?: false)}" type="date"
								class="form-control" th:field="*{tekiyoStYmd}"
								th:data-initial-value="*{tekiyoStYmd}"> <input
								th:if="${isView ?: false}" type="text" class="form-control"
								readonly th:value="*{tekiyoStYmd}">
						</div>

						<div class="col-md-4">
							<label class="form-label fw-medium">適用終了年月日</label> <input
								th:if="${!(isView ?: false)}" type="date" class="form-control"
								th:field="*{tekiyoEdYmd}" th:data-initial-value="*{tekiyoEdYmd}">
							<input th:if="${isView ?: false}" type="text"
								class="form-control" readonly th:value="*{tekiyoEdYmd}">

						</div>

					</div>
				</div>
			</div>

			<div class="d-flex justify-content-center gap-3 py-4 mb-5">
				<button type="submit" class="btn btn-primary btn-lg px-5"
					th:if="${!(isView ?: false)}">
					<i class="bi bi-save me-2"></i> <span
						th:text="${(isEdit ?: false) ? '更新する' : '登録する'}"></span>
				</button>

				<a th:href="@{/tokugimu/list}"
					class="btn btn-outline-secondary btn-lg px-4"
					th:if="${isView ?: false}"> <i class="bi bi-arrow-left me-2"></i>一覧に戻る
				</a> <a th:href="@{/tokugimu/list}"
					class="btn btn-outline-secondary btn-lg px-4"
					th:unless="${isView ?: false}"
					onclick="return confirm('入力内容は破棄されます。よろしいですか？')"> <i
					class="bi bi-arrow-left me-2"></i>一覧に戻る
				</a>
			</div>
		</form>

		<!-- 特別徴収義務者指定モーダル -->
		<div th:replace="~{layout/components :: shiteiGassanSearchModal}"></div>
	</div>
	<th:block layout:fragment="scripts">
		<script th:src="@{/js/tekiyoNozeiShuki.js}"></script>
		<script th:src="@{/js/shitei_gassan_search.js}"></script>
	</th:block>
</body>
</html>
