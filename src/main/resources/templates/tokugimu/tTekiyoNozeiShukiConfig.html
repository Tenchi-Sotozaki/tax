<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">

<head>
<title
	th:text="${(isView ?: false) ? '適用納税周期照会' : ((isEdit ?: false) ? '適用納税周期編集' : '適用納税周期登録')}">適用納税周期登録/編集
</title>
</head>

<body>
	<div layout:fragment="content" class="container-fluid p-4">

		<div
			class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
			<h5 class="mb-0 fw-bold text-dark">
				<i class="bi bi-calendar-check me-2 text-success"></i> <span
					th:text="${(isView ?: false) ? '適用納税周期照会' : ((isEdit ?: false) ? '適用納税周期編集' : '適用納税周期登録')}"></span>
			</h5>
			<a
				th:href="@{/tekiyo-nozei-shuki/edit/{id}(id=${tekiyoNozeiShukiForm.shiteiNo})}"
				class="btn btn-primary" th:if="${isView ?: false}"> <i
				class="bi bi-pencil-square me-2"></i>編集する
			</a>
		</div>

		<div th:replace="~{layout/components :: selectedTokugimuInfo(${isView})}"></div>

		<div th:if="${successMessage}"
			class="alert alert-success alert-dismissible fade show" role="alert">
			<i class="bi bi-check-circle-fill me-2"></i><span
				th:text="${successMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>
		<div th:if="${infoMessage}"
			class="alert alert-info alert-dismissible fade show" role="alert">
			<i class="bi bi-info-circle-fill me-2"></i><span
				th:text="${infoMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>
		<div th:if="${errorMessage}"
			class="alert alert-danger alert-dismissible fade show" role="alert">
			<i class="bi bi-exclamation-triangle-fill me-2"></i><span
				th:text="${errorMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>

		<form
			th:action="@{/tekiyo-nozei-shuki/save/{id}(id=${tekiyoNozeiShukiForm.shiteiNo})}"
			th:object="${tekiyoNozeiShukiForm}" method="post">

			<input type="hidden" th:field="*{shiteiNo}" /> <input type="hidden"
				th:field="*{edit}" />

			<div class="card mb-4 shadow-sm" th:if="${!(isView ?: false)}">
				<div class="card-header py-3">
					<h5 class="mb-0">
						<i class="bi bi-calendar3 me-2"></i>納税周期情報
					</h5>
				</div>
				<div class="card-body bg-light-subtle">
					<div class="row g-3">

						<div class="col-md-4">
							<label class="form-label fw-medium"> 適用開始年月 <span
								class="text-danger" th:if="${!(isView ?: false)}">*</span>
							</label> <input th:if="${!(isView ?: false)}" type="month"
								class="form-control" th:field="*{tekiyoStMonth}"
								th:data-initial-value="*{tekiyoStMonth}"> <input
								th:if="${isView ?: false}" type="text" class="form-control"
								readonly th:value="${tekiyoNozeiShukiForm.tekiyoStMonth != null ? tekiyoNozeiShukiForm.tekiyoStMonth.substring(0,4) + '年' + tekiyoNozeiShukiForm.tekiyoStMonth.substring(5) + '月' : ''}">
						</div>

						<div class="col-md-4">
							<label class="form-label fw-medium">適用終了年月</label> <input
								th:if="${!(isView ?: false)}" type="month" class="form-control"
								th:field="*{tekiyoEdMonth}" th:data-initial-value="*{tekiyoEdMonth}">
							<input th:if="${isView ?: false}" type="text"
								class="form-control" readonly th:value="${tekiyoNozeiShukiForm.tekiyoEdMonth != null ? tekiyoNozeiShukiForm.tekiyoEdMonth.substring(0,4) + '年' + tekiyoNozeiShukiForm.tekiyoEdMonth.substring(5) + '月' : ''}">
						</div>

						<div class="col-md-4">
							<label class="form-label fw-medium"> 納税周期 <span
								class="text-danger" th:if="${!(isView ?: false)}">*</span>
							</label> <select class="form-select" th:field="*{seq}"
								th:disabled="${isView ?: false}" th:data-initial-value="*{seq}">
								<option value="">-- 選択してください --</option>
								<option th:each="opt : ${nozeiShukiOptions}"
									th:value="${opt.seq}" th:text="${opt.label}"></option>
							</select>
						</div>

					</div>
				</div>
			</div>

			<!-- 適用納税周期一覧（照会時のみ） -->
			<div
				th:if="${(isView ?: false) and tekiyoNozeiShukiForm.histories != null and !tekiyoNozeiShukiForm.histories.isEmpty()}"
				class="card mb-4 shadow-sm">
				<div class="card-header py-3">
					<h5 class="mb-0">
						<i class="bi bi-clock-history me-2"></i>適用納税周期一覧
					</h5>
				</div>
				<div class="card-body p-0">
					<table class="table table-bordered table-sm align-middle mb-0">
						<thead class="table-light text-center">
							<tr>
								<th style="width: 15%;">連番</th>
								<th style="width: 30%;">適用開始年月</th>
								<th style="width: 30%;">適用終了年月</th>
								<th style="width: 25%;">納税周期</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="history : ${tekiyoNozeiShukiForm.histories}">
								<td class="text-center" th:text="${history.idx}"></td>
								<td class="text-center" th:text="${history.tekiyoStMonth}"></td>
								<td class="text-center" th:text="${history.tekiyoEdMonth}"></td>
								<td class="text-center" th:text="${history.shukiLabel}"></td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>

			<div class="d-flex justify-content-center gap-3 py-4 mb-5">
				<!-- 一覧に戻るボタン（照会時のみ表示） -->
				<a th:href="@{/tokugimu/list}" class="btn btn-outline-secondary btn-lg px-4" th:if="${isView ?: false}">
					<i class="bi bi-arrow-left me-2"></i>一覧に戻る
				</a>
				
				<!-- 照会に戻るボタン（編集・登録時） -->
				<a href="#" class="btn btn-outline-secondary btn-lg px-4" th:unless="${isView ?: false}" data-bs-toggle="modal"
					data-bs-target="#backConfirmModal">
					<i class="bi bi-arrow-left me-2"></i>照会に戻る
				</a>
				
				<!-- 登録/更新ボタン修正 -->
				<button type="submit" class="btn btn-success px-5" th:if="${!(isView ?: false)}">
					<i class="bi bi-save me-2"></i> <span th:text="${(isEdit ?: false) ? '更新する' : '登録する'}"></span>
				</button>
				
				<!-- 削除ボタン（編集時のみ表示） -->
				<a href="#" class="btn btn-danger btn-lg px-4" th:if="${(isEdit ?: false) and !(isView ?: false)}"
					data-bs-toggle="modal" data-bs-target="#deleteConfirmModal">
					<i class="bi bi-trash me-2"></i>削除する
				</a>
			</div>
		</form>

		<div th:if="${(isEdit ?: false) and !(isView ?: false)}" th:replace="~{layout/components :: linkConfirmModal('deleteConfirmModal', '削除確認', '削除してもよろしいですか？', @{/tekiyo-nozei-shuki/delete/{id}(id=${tekiyoNozeiShukiForm.shiteiNo})}, '削除する')}"></div>
		<div th:unless="${isView ?: false}" th:replace="~{layout/components :: linkConfirmModal('backConfirmModal', '確認', '入力内容が破棄されます。よろしいですか？', @{/tekiyo-nozei-shuki/view/{id}(id=${tekiyoNozeiShukiForm.shiteiNo})}, '照会に戻る')}"></div>

		<!-- 特別徴収義務者指定モーダル -->
		<div th:replace="~{layout/components :: shiteiGassanSearchModal}"></div>
	</div>
	<th:block layout:fragment="scripts">
		<script th:src="@{/js/tekiyoNozeiShuki.js}"></script>
		<script th:src="@{/js/shiteiGassanSearch.js}"></script>
	</th:block>
</body>

</html>
