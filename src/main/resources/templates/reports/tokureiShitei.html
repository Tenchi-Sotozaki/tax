<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">

<head>
	<title>納入申告書の提出期限等の特例適用者指定通知書</title>
</head>

<body>
	<div layout:fragment="content" class="container-fluid px-4 py-3">
		<div class="container-fluid">
			<div class="row">
				<div class="col-12">
					<div
						class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
						<h5 class="mb-0 fw-bold text-dark">
							<i class="bi bi-file-earmark-text text-primary me-2"></i>納入申告書の提出期限等の特例適用者指定通知書
						</h5>
					</div>

					<!-- 帳票発行エラー表示エリア -->
					<div th:replace="~{layout/components :: reportErrorAlert}"></div>

					<form id="tsuchiForm" th:object="${dto}" method="post"
						onsubmit="return validateForm()" novalidate>
						<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
						
						<!-- 特別徴収義務者情報エリア -->
						<div th:replace="~{layout/components :: selectedTokugimuInfo}"></div>
						
						<!-- エラーメッセージ -->
						<div th:replace="~{layout/components :: reportErrorAlert}"></div>

						<!-- 通知書情報エリア -->
						<div class="card mb-4">
							<div class="card-header">
								<h5 class="mb-0">内容</h5>
							</div>
							<div class="card-body">
								<div class="row g-3">
									<div class="col-md-2">
										<label for="hakkoYmd" class="form-label">発行年月日 <span
												class="text-danger">*</span></label>
										<input type="date" class="form-control" id="hakkoYmd" th:field="*{hakkoYmd}">
									</div>
									<div class="col-md-2">
										<label for="tekiyoYmd" class="form-label">適用年月 <span
												class="text-danger">*</span></label>
										<input type="date" class="form-control" id="tekiyoYmd" th:field="*{tekiyoYmd}">
									</div>
								</div>
								<div class="row g-3 mt-2">
									<div class="col-md-1">
										<label class="form-label">区分 <span class="text-danger">*</span></label>
										<select class="form-select" id="shonin" th:field="*{shonin}" onchange="toggleBikoState()">
											<option value="承認">承認</option>
											<option value="不承認">不承認</option>
										</select>
									</div>
								</div>
								<div class="row g-3 mt-2" id="riyuArea">
									<div class="col-12">
										<label for="riyu" class="form-label">不承認理由</label>
										<textarea class="form-control" id="riyu" th:field="*{riyu}" rows="3"
											placeholder="不承認理由を入力してください"
											th:disabled="${dto.shonin == '承認'}"></textarea>
									</div>
								</div>
							</div>
						</div>

						<input type="hidden" th:field="*{city}">
						<input type="hidden" th:field="*{jorei}">
						<input type="hidden" th:field="*{tokuJusho}">
						<input type="hidden" th:field="*{shisetsuJusho}">
						<input type="hidden" th:field="*{koin}">

						<!-- アクションボタン -->
						<div class="d-flex justify-content-center gap-2">
							<button type="submit" class="btn btn-primary"
								th:formaction="@{/reports/tokureiShitei/pdf}"
								onclick="hideErrorMessage()">
								<i class="bi bi-file-earmark-pdf me-1"></i> PDF
							</button>
							<button type="submit" class="btn btn-outline-primary"
								th:formaction="@{/reports/tokureiShitei/preview}" formtarget="_blank"
								onclick="hideErrorMessage()">
								<i class="bi bi-eye me-1"></i> プレビュー
							</button>
							<button type="submit" class="btn btn-primary"
								th:formaction="@{/reports/tokureiShitei/print}" formtarget="_blank"
								onclick="hideErrorMessage()">
								<i class="bi bi-printer me-1"></i> 印刷
							</button>
							<a th:href="@{/tokugimu/report}" class="btn btn-outline-secondary">
								<i class="bi bi-arrow-left me-1"></i> 戻る
							</a>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>

	<th:block layout:fragment="scripts">
		<script th:src="@{/js/tokureiShitei.js}"></script>
		<script th:src="@{/js/reportForm.js}"></script>
	</th:block>
</body>

</html>
