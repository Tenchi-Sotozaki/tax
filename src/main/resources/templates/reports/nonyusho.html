<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">

<head>
	<title>納入書発行</title>
	<link th:href="@{/css/nonyusho.css}" rel="stylesheet">
</head>

<body>
	<div layout:fragment="content" class="container-fluid px-4 py-3">
		<div class="container-fluid">
			<div class="row">
				<div class="col-12">
					<div
						class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
						<h5 class="mb-0 fw-bold text-dark">
							<i class="bi bi-file-earmark-ruled text-primary me-2"></i>納入書発行
						</h5>
					</div>

					<form id="nonyushoForm" method="post">
						<input type="hidden" id="shiteiNo" name="shiteiNo" th:value="${shiteiNo}" />
						<input type="hidden" id="tokuName" name="tokuName" th:value="${tokuName}">
						<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
						<input type="hidden" id="tokuYubinNo" name="tokuYubinNo" th:value="${tokuYubinNo}" />
						<input type="hidden" id="tokuJusho" name="tokuJusho" th:value="${tokuJusho}" />
						
						<!-- 特別徴収義務者情報 -->
						<div th:replace="~{layout/components :: selectedTokugimuInfo}"></div>
						
						<!-- 納入書情報エリア -->
						<div class="card mb-4">
							<div class="card-header">
								<h5 class="mb-0">納入書情報</h5>
							</div>
							<div class="card-body">
								<div class="row g-3">
									<div class="col-md-4">
										<label for="nendo" class="form-label">年度 <span
												class="text-danger">*</span></label>
										<div class="nendo-wrapper">
											<input type="text" class="form-control nendo-input" id="nendo" name="nendo" value="2026" required>
											<div class="nendo-display" id="nendoDisplay">年度を入力してください</div>
										</div>
									</div>
									<div class="col-md-4">
										<label for="taishoYm" class="form-label">対象年月 <span
												class="text-danger">*</span></label> <input type="month"
											class="form-control" id="taishoYm" name="taishoYm" required>
									</div>
								</div>
							</div>
						</div>

						<!-- アクションボタン -->
						<div class="d-flex gap-2">
							<!-- PDF発行 -->
							<button type="button" onclick="submitReport('pdf')" class="btn btn-primary">
								<i class="bi bi-file-earmark-pdf me-1"></i> PDF
							</button>
							
							<!-- プレビュー -->
							<button type="button" onclick="submitReport('preview')" class="btn btn-outline-primary">
								<i class="bi bi-eye me-1"></i> プレビュー
							</button>
						    
						    <!-- 印刷 -->
							<button type="button" class="btn btn-primary" onclick="printReport()">
								<i class="bi bi-printer me-1"></i> 印刷
							</button>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>

	<th:block layout:fragment="scripts">
		<script th:src="@{/js/nonyusho.js}"></script>
	</th:block>
</body>

</html>
