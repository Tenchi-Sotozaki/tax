<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">
<head>
    <title>納入申告書の提出期限等の特例適用者指定取消通知書</title>
</head>
<body>
	<div layout:fragment="content" class="container-fluid px-4 py-3">
        <div class="container-fluid">
            <div class="row">
                <div class="col-12">
                    <h2 class="mb-4">
                        <i class="bi bi-file-earmark-text text-primary me-2"></i>納入申告書の提出期限等の特例適用者指定取消通知書
                    </h2>
                    
                    <form id="tsuchiForm" th:object="${dto}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <!-- 特別徴収義務者情報エリア -->
                        <div class="card mb-4">
                            <div class="card-header">
                                <h5 class="mb-0">特別徴収義務者情報</h5>
                            </div>
                            <div class="card-body">
                                <div class="row g-3">
                                    <div class="col-md-4">
                                        <label class="form-label">指定番号</label>
                                        <input type="text" class="form-control" th:field="*{shiteiNo}" readonly>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">施設名称</label>
                                        <input type="text" class="form-control" th:field="*{shisetsuName}" readonly>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">特別徴収義務者名</label>
                                        <input type="text" class="form-control" th:field="*{tokuName}" readonly>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 通知書情報エリア -->
                        <div class="card mb-4">
                            <div class="card-header">
                                <h5 class="mb-0">通知書情報</h5>
                            </div>
                            <div class="card-body">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label for="hakkoYmd" class="form-label">発行日 <span class="text-danger">*</span></label>
                                        <input type="date" class="form-control" id="hakkoYmd" th:field="*{hakkoYmd}" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="tekiyoYmd" class="form-label">適用年月日 <span class="text-danger">*</span></label>
                                        <input type="date" class="form-control" id="tekiyoYmd" th:field="*{tekiyoYmd}" required>
                                    </div>
                                </div>
                                <div class="row g-3 mt-2">
                                    <div class="col-12">
                                        <label for="riyu" class="form-label">取消理由 <span class="text-danger">*</span></label>
                                        <textarea class="form-control" id="riyu" th:field="*{riyu}" rows="3" required 
                                            placeholder="取消理由を入力してください"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <input type="hidden" th:field="*{city}">
                        <input type="hidden" th:field="*{jorei}">
                        <input type="hidden" th:field="*{tokuJusho}">
                        <input type="hidden" th:field="*{shisetsuJusho}">
                        
                        <!-- アクションボタン -->
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-primary" onclick="generatePdf()">
                                <i class="bi bi-file-earmark-pdf me-1"></i> PDF
                            </button>
                            <button type="button" class="btn btn-info" onclick="preview()">
                                <i class="bi bi-eye me-1"></i> プレビュー
                            </button>
                            <button type="button" class="btn btn-secondary" onclick="print()">
                                <i class="bi bi-printer me-1"></i> 印刷
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <th:block layout:fragment="scripts">
        <script th:src="@{/js/tokureiShiteiCancel.js}"></script>
    </th:block>
</body>
</html>
