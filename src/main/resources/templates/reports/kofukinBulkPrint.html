<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">

<head>
	<title>交付金帳票一括発行</title>
</head>

<body>
	<div layout:fragment="content" class="container-fluid p-4">

		<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
			<h5 class="mb-0 fw-bold text-dark">
				<i class="bi bi-printer me-2 text-primary"></i>交付金帳票一括発行
			</h5>
		</div>

		<div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
			<span th:text="${successMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>
		<div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
			<span th:text="${errorMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>

		<form id="bulkPrintForm" th:action="@{/reports/kofukinBulkPrint/pdf}" th:object="${form}" method="post">

			<div class="card shadow-sm mb-4">
				<div class="card-header py-3">
					<h5 class="mb-0"><i class="bi bi-sliders me-2"></i>発行条件</h5>
				</div>
				<div class="card-body bg-light-subtle">
					<div class="row g-3">

						<!-- 発行年月日 -->
						<div class="col-md-3">
							<label for="hakkoYmd" class="form-label fw-medium">
								発行年月日 <span class="text-danger">*</span>
							</label>
							<input type="date" class="form-control" id="hakkoYmd" th:field="*{hakkoYmd}"
								th:errorclass="is-invalid">
							<div class="invalid-feedback" th:if="${#fields.hasErrors('hakkoYmd')}" th:errors="*{hakkoYmd}"></div>
						</div>

						<!-- 交付金年度 -->
						<div class="col-md-3">
							<label for="nendo" class="form-label fw-medium">
								交付金年度 <span class="text-danger">*</span>
							</label>
							<input type="text" class="form-control" id="nendo" th:field="*{nendo}"
								th:errorclass="is-invalid" maxlength="4" placeholder="例：2026">
							<div class="invalid-feedback" th:if="${#fields.hasErrors('nendo')}" th:errors="*{nendo}"></div>
						</div>

					</div>

					<!-- 発行対象帳票 -->
					<div class="row g-3 mt-1">
						<div class="col-12">
							<label class="form-label fw-medium">発行対象帳票</label>
							<div class="d-flex gap-4">
								<div class="form-check">
									<input class="form-check-input" type="checkbox" id="kofuShinsei"
										th:field="*{kofuShinsei}">
									<label class="form-check-label" for="kofuShinsei">
										交付金申請書
									</label>
								</div>
								<div class="form-check">
									<input class="form-check-input" type="checkbox" id="kofuKetteiTsuchi"
										th:field="*{kofuKetteiTsuchi}">
									<label class="form-check-label" for="kofuKetteiTsuchi">
										交付金決定通知書
									</label>
								</div>
							</div>
						</div>
					</div>

				</div>
			</div>

			<!-- アクションボタン -->
			<div class="d-flex justify-content-center gap-3 py-4 mb-5">

				<button type="submit" form="bulkPrintForm" formaction="/reports/kofukinBulkPrint/pdf"
					class="btn btn-primary btn-lg px-4">
					<i class="bi bi-file-earmark-pdf me-2"></i>PDF
				</button>

				<button type="submit" form="bulkPrintForm" formaction="/reports/kofukinBulkPrint/preview"
					class="btn btn-outline-primary btn-lg px-4">
					<i class="bi bi-eye me-2"></i>プレビュー
				</button>

				<button type="submit" form="bulkPrintForm" formaction="/reports/kofukinBulkPrint/print"
					class="btn btn-outline-secondary btn-lg px-4">
					<i class="bi bi-printer me-2"></i>印刷
				</button>

				<a th:href="@{/shoreikin/list}" class="btn btn-outline-secondary btn-lg px-4">
					<i class="bi bi-arrow-left me-2"></i>一覧に戻る
				</a>

			</div>

		</form>

	</div>
</body>
</html>
