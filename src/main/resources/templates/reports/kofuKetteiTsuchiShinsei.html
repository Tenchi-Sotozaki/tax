<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">

<head>
	<title>宿泊税特別徴収事務交付金決定通知書・交付申請書</title>
</head>

<body>
	<div layout:fragment="content" class="container-fluid px-4 py-3">
		<div class="container-fluid">
			<div class="row">
				<div class="col-12">
					<div
						class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
						<h5 class="mb-0 fw-bold text-dark">
							<i class="bi bi-file-earmark-text text-primary me-2"></i>宿泊税特別徴収事務交付金決定通知書・交付申請書
						</h5>
					</div>

					<form id="kofuForm" th:object="${dto}" method="post">
						<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
						
						<!-- 特別徴収義務者指定モーダルの読み込み -->
						<div th:replace="~{layout/components :: shiteiGassanSearchModal}"></div>
						
						<!-- 特別徴収義務者エリア -->
						<div th:replace="~{layout/components :: selectedTokugimuInfo}"></div>
						
						<!-- 帳票発行エラー表示エリア -->
						<div th:replace="~{layout/components :: reportErrorAlert}"></div>
						
						<!-- 内容エリア -->
						<div class="card mb-4">
							<div class="card-header">
								<h5 class="mb-0">内容</h5>
							</div>
							<div class="card-body">
								<!-- 年度・発行年月日入力 -->
								<div class="row g-3">
									<div class="col-md-1">
										<label class="form-label">年度</label> <span class="text-danger">*</span>
										<input type="text" class="form-control" th:field="*{nendo}" id="nendoInput" placeholder="年度を入力">
									</div>

									<div class="col-md-2">
										<label class="form-label">発行年月日</label> <span class="text-danger">*</span>
										<input type="date" class="form-control" th:field="*{hakkoYmd}" id="hakkoYmdInput" onchange="updateDisplayDate()">
									</div>
								</div>

								<!-- 印刷対象 -->
								<label class="form-label fw-bold mt-3">印刷対象</label>
								<div class="form-check mb-2">
									<input type="checkbox" class="form-check-input" th:field="*{ketteiTsuchi}">
									<label class="form-check-label" th:for="${#ids.prev('ketteiTsuchi')}">決定通知書</label>
								</div>
								<div class="form-check">
									<input type="checkbox" class="form-check-input" th:field="*{shinsei}">
									<label class="form-check-label" th:for="${#ids.prev('shinsei')}">交付申請書</label>
								</div>
							</div>
						</div>

						<input type="hidden" th:field="*{tokuName}">
						<input type="hidden" th:field="*{shisetsuName}">
						<input type="hidden" th:field="*{shisetsuJusho}">
						<input type="hidden" th:field="*{shiteiNo}">
						<input type="hidden" th:field="*{cityName}"> 
						<input type="hidden" th:field="*{jorei}"> 
						<input type="hidden" th:field="*{hakkoYoshiki}">
						<input type="hidden" th:field="*{nonyugaku}">
						<input type="hidden" th:field="*{kofugaku}">
						<input type="hidden" th:field="*{kofuJoken}">
						<input type="hidden" th:field="*{koin}">

						<!-- アクションボタン -->
						<div class="d-flex justify-content-center gap-2">
							<a th:href="@{/tokugimu/report}" class="btn btn-outline-secondary">
								<i class="bi bi-arrow-left me-1"></i> 戻る
							</a>
							<button type="button" class="btn btn-primary" onclick="generatePdf()">
								<i class="bi bi-file-earmark-pdf me-1"></i> PDF
							</button>
							<button type="button" class="btn btn-outline-primary" onclick="preview()">
								<i class="bi bi-eye me-1"></i> プレビュー
							</button>
							<button type="button" class="btn btn-primary" onclick="printReport()">
								<i class="bi bi-printer me-1"></i> 印刷
							</button>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>

	<th:block layout:fragment="scripts">
		<script th:src="@{/js/kofuKetteiTsuchiShinsei.js}"></script>
		<script th:src="@{/js/shiteiGassanSearch.js}"></script>
		<script th:src="@{/js/reportForm.js}"></script>
	</th:block>
</body>

</html>
