<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">

<head>
	<title>納税管理人承認(不承認)通知書</title>
</head>

<body>
	<div layout:fragment="content" class="container-fluid px-4 py-3">
		<div class="container-fluid">
			<div class="row">
				<div class="col-12">
					<div
						class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
						<h5 class="mb-0 fw-bold text-dark">
							<i class="bi bi-file-earmark-text text-primary me-2"></i>納税管理人承認(不承認)通知書
						</h5>
					</div>

					<!-- 帳票発行エラー表示エリア -->
					<div th:replace="~{layout/components :: reportErrorAlert}"></div>

					<form id="tsuchiForm" th:object="${dto}" method="post"
						onsubmit="return validateForm()">
						<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
						<!-- 特別徴収義務者情報エリア -->
						<div th:replace="~{layout/components :: selectedTokugimuInfo}"></div>

						<!-- 納税管理人情報エリア -->
						<div class="card mb-4">
							<div class="card-header">
								<h5 class="mb-0">納税管理人情報</h5>
							</div>
							<div class="card-body">
								<div class="row g-3">
									
									<!-- 承認・不承認 -->
									<div class="col-md-1">
										<label class="form-label">区分</label>
										<input th:if="*{kbn} == 1" type="text" class="form-control" value="承認" readonly>
										<input th:if="*{kbn} == 2" type="text" class="form-control" value="不承認" readonly>
									</div>
									
									<div class="col-md-5">
										<label class="form-label">納税管理人名</label> <input type="text" class="form-control"
											th:field="*{nozeiKanriName}" readonly>
									</div>
									<div class="col-md-6">
										<label class="form-label">納税管理人住所</label> <input type="text"
											class="form-control" th:field="*{nozeiKanriJusho}" readonly>
									</div>
								</div>
							</div>
						</div>

						<!-- 内容エリア -->
						<div class="card mb-4">
							<div class="card-header">
								<h5 class="mb-0">内容</h5>
							</div>
							<div class="card-body">
								<div class="row g-3">
									<div class="col-md-6">
										<label for="hakkoYmd" class="form-label">発行年月日 <span
												class="text-danger">*</span></label> <input type="date"
											class="form-control" id="hakkoYmd" th:field="*{hakkoYmd}" required>
									</div>
								</div>
							</div>
						</div>

						<input type="hidden" th:field="*{shisetsuName}">
						<input type="hidden" th:field="*{tokuName}">
						<input type="hidden" th:field="*{tokuYubin}">
						<input type="hidden" th:field="*{tokuJusho}">
						<input type="hidden" th:field="*{shisetsuYubin}">
						<input type="hidden" th:field="*{shisetsuJusho}">
						<input type="hidden" th:field="*{kbn}">
						<input type="hidden" th:field="*{cityName}"> <input type="hidden" th:field="*{jorei}">
						<input type="hidden" th:field="*{koin}">
						<input type="hidden" th:field="*{riyu}">

						<!-- アクションボタン -->
						<div class="d-flex justify-content-center gap-2">
							<button type="submit" class="btn btn-primary"
								th:formaction="@{/reports/nozeiKanrininShoninTsuchi/pdf}">
								<i class="bi bi-file-earmark-pdf me-1"></i> PDF
							</button>
							<button type="submit" class="btn btn-outline-primary"
								th:formaction="@{/reports/nozeiKanrininShoninTsuchi/preview}" formtarget="_blank">
								<i class="bi bi-eye me-1"></i> プレビュー
							</button>
							<button type="submit" class="btn btn-primary"
								th:formaction="@{/reports/nozeiKanrininShoninTsuchi/print}" formtarget="_blank">
								<i class="bi bi-printer me-1"></i> 印刷
							</button>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>

	<th:block layout:fragment="scripts">
		<script th:src="@{/js/nozeiKanrininShoninTsuchi.js}"></script>
		<script th:src="@{/js/reportForm.js}"></script>
	</th:block>
</body>

</html>
