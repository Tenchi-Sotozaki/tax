<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">

<head>
	<title>宿泊税特別徴収事務交付金交付決定通知書</title>
</head>

<body>
	<div layout:fragment="content" class="container-fluid px-4 py-3">
		<div class="container-fluid">
			<div class="row">
				<div class="col-12">
					<div
						class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
						<h5 class="mb-0 fw-bold text-dark">
							<i class="bi bi-file-earmark-text text-primary me-2"></i>宿泊税特別徴収事務交付金交付決定通知書
						</h5>
					</div>

					<!-- 帳票発行エラー表示エリア -->
					<div th:replace="~{layout/components :: reportErrorAlert}"></div>

					<form id="kofuKetteiForm" th:object="${dto}" method="post"
						onsubmit="return validateForm()">
						<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

						<!-- 特別徴収義務者エリア -->
						<div class="card mb-4">
							<div class="card-header">
								<h5 class="mb-0">特別徴収義務者</h5>
							</div>
							<div class="card-body">
								<div class="row g-3">
									<div class="col-md-12">
										<input type="text" class="form-control" th:field="*{tokugimuName}" readonly>
									</div>
								</div>
							</div>
						</div>

						<!-- 発行年月日エリア -->
						<div class="card mb-4">
							<div class="card-header">
								<h5 class="mb-0">発行年月日</h5>
							</div>
							<div class="card-body">
								<div class="row g-3">
									<div class="col-md-6">
										<label class="form-label">発行年月日</label>
										<input type="date" class="form-control" th:field="*{hakkoYmd}"
											onchange="updateDisplayDate()">
									</div>
								</div>
							</div>
						</div>

						<!-- 対象施設エリア -->
						<div class="card mb-4">
							<div class="card-header">
								<h5 class="mb-0">対象施設</h5>
							</div>
							<div class="card-body">
								<div class="row g-3">
									<div class="col-md-6">
										<label class="form-label">指定番号</label>
										<input type="text" class="form-control" th:field="*{shiteiNo}" readonly>
									</div>
									<div class="col-md-6">
										<label class="form-label">施設名称</label>
										<input type="text" class="form-control" th:field="*{shisetsuName}" readonly>
									</div>
								</div>
								<div class="row g-3 mt-2">
									<div class="col-md-12">
										<label class="form-label">施設住所</label>
										<input type="text" class="form-control" th:field="*{shisetsuJusho}" readonly>
									</div>
								</div>
							</div>
						</div>

						<input type="hidden" th:field="*{hakkoYoshiki}">
						<input type="hidden" th:field="*{cityName}">
						<input type="hidden" th:field="*{hakkoJorei}">
						<input type="hidden" th:field="*{kofugaku}">
						<input type="hidden" th:field="*{kofuYmd}">
						<input type="hidden" th:field="*{koin}">

						<!-- アクションボタン -->
						<div class="d-flex justify-content-center gap-2">
							<button type="submit" class="btn btn-primary"
								th:formaction="@{/reports/kofuKetteiTsuchi/pdf}">
								<i class="bi bi-file-earmark-pdf me-1"></i> PDF
							</button>
							<button type="submit" class="btn btn-outline-primary"
								th:formaction="@{/reports/kofuKetteiTsuchi/preview}" formtarget="_blank">
								<i class="bi bi-eye me-1"></i> プレビュー
							</button>
							<button type="submit" class="btn btn-primary"
								th:formaction="@{/reports/kofuKetteiTsuchi/print}" formtarget="_blank">
								<i class="bi bi-printer me-1"></i> 印刷
							</button>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>

	<th:block layout:fragment="scripts">
		<script th:src="@{/js/kofuKetteiTsuchi.js}"></script>
		<script th:src="@{/js/reportForm.js}"></script>
	</th:block>
</body>

</html>
