<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">

<head>
	<title>徴収不能額の還付又は納入義務の免除決定通知書</title>
</head>

<body>
	<div layout:fragment="content" class="container-fluid px-4 py-3">
		<div class="container-fluid">
			<div class="row">
				<div class="col-12">
					<div
						class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
						<h5 class="mb-0 fw-bold text-dark">
							<i class="bi bi-file-earmark-text text-primary me-2"></i>徴収不能額の還付又は納入義務の免除決定通知書
						</h5>
					</div>

					<!-- 帳票発行エラー表示エリア -->
					<div th:replace="~{layout/components :: reportErrorAlert}"></div>

					<form id="tsuchiForm" th:object="${dto}" method="post"
						onsubmit="return validateForm()">
						<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

						<!-- 特別徴収義務者情報エリア -->
						<div th:replace="~{layout/components :: selectedTokugimuInfo}"></div>

						<!-- 通知書情報エリア -->
						<div class="card mb-4">
							<div class="card-header">
								<h5 class="mb-0">内容</h5>
							</div>
							<div class="card-body">

								<div class="row g-3">
									<!-- 申請の区分 -->
									<div class="col-md-2">
										<label for="shinseiKbn" class="form-label">申請の区分 <span class="text-danger">*</span></label>
										<select class="form-select" id="shinseiKbn" th:field="*{shinsei_kbn}" required>
											<option value="1">還付</option>
											<option value="2">納入義務の免除</option>
										</select>
									</div>
								</div>

								<div class="row g-3 mt-2">
									<div class="col-md-2">
										<label for="hakkoYmd" class="form-label">発行年月日 <span
												class="text-danger">*</span></label>
										<input type="date" class="form-control" id="hakkoYmd" th:field="*{hakkoYmd}"
											required>
									</div>
									<div class="col-md-2">
										<label for="juriYmd" class="form-label">申請受理年月日 <span
												class="text-danger">*</span></label>
										<input type="date" class="form-control" id="juriYmd" th:field="*{juriYmd}"
											required>
									</div>
									<div class="col-md-2">
										<label for="shinseiYm" class="form-label">対象年月 <span
												class="text-danger">*</span></label>
										<input type="month" class="form-control" id="shinseiYm" th:field="*{shinseiYm}"
											required>
									</div>
								</div>
								<div class="row g-3 mt-2">
									<div class="col-md-3">
										<label for="zeigaku" class="form-label">申請した税額 <span
												class="text-danger">*</span></label>
										<div class="input-group">
											<input type="number" class="form-control" id="zeigaku" th:field="*{zeigaku}"
												min="0" step="1" placeholder="0" required>
											<span class="input-group-text">円</span>
										</div>
									</div>
									<div class="col-md-3">
										<label for="kanpuMenjoGaku" class="form-label">還付又は納入義務の免除を決定した額 <span
												class="text-danger">*</span></label>
										<div class="input-group">
											<input type="number" class="form-control" id="kanpuMenjoGaku"
												th:field="*{kanpuMenjoGaku}" min="0" step="1" placeholder="0" required>
											<span class="input-group-text">円</span>
										</div>
									</div>
								</div>
								
								<!-- 決定の内容 -->
								<div class="row g-3 mt-2">
									<div class="col-md-2">
										<label for="ketteiNaiyou" class="form-label">決定の内容 <span class="text-danger">*</span></label>
										<select class="form-select" id="ketteiNaiyou" th:field="*{kettei_naiyou}" required>
											<option value="1">申請額どおり承認する</option>
											<option value="2">一部承認する</option>
											<option value="3">不承認</option>
										</select>
									</div>
								</div>
								
								<div class="row g-3 mt-2">
									<div class="col-12">
										<label for="riyu" class="form-label">一部承認または不承認と決定した理由</label>
										<textarea class="form-control" id="riyu" th:field="*{riyu}" rows="3"
											placeholder="理由を入力してください"></textarea>
									</div>
								</div>
								<div class="row g-3 mt-2">
									<div class="col-12">
										<label for="biko" class="form-label">備考</label>
										<textarea class="form-control" id="biko" th:field="*{biko}" rows="3"
											placeholder="備考を入力してください"></textarea>
									</div>
								</div>
							</div>
						</div>

						<input type="hidden" th:field="*{cityName}">
						<input type="hidden" th:field="*{jorei}">
						<input type="hidden" th:field="*{koin}">
						<input type="hidden" th:field="*{tokuName}">
						<input type="hidden" th:field="*{tokuYubin}">
						<input type="hidden" th:field="*{tokuJusho}">
						<input type="hidden" th:field="*{shisetsuYubin}">
						<input type="hidden" th:field="*{shisetsuJusho}">
						<input type="hidden" th:field="*{shisetsuName}">

						<!-- アクションボタン -->
						<div class="d-flex justify-content-center gap-2">
							<button type="submit" class="btn btn-primary"
								th:formaction="@{/kanpuMenjoTsuchi/generatePdf}">
								<i class="bi bi-file-earmark-pdf me-1"></i> PDF
							</button>
							<button type="submit" class="btn btn-outline-primary"
								th:formaction="@{/kanpuMenjoTsuchi/preview}" formtarget="_blank">
								<i class="bi bi-eye me-1"></i> プレビュー
							</button>
							<button type="submit" class="btn btn-primary"
								th:formaction="@{/kanpuMenjoTsuchi/print}" formtarget="_blank">
								<i class="bi bi-printer me-1"></i> 印刷
							</button>
							<a th:href="@{/tokugimu/report}" class="btn btn-outline-secondary">
								<i class="bi bi-arrow-left me-1"></i> 戻る
							</a>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>

	<th:block layout:fragment="scripts">
		<script th:src="@{/js/kanpuMenjoTsuchi.js}"></script>
		<script th:src="@{/js/reportForm.js}"></script>
	</th:block>
</body>

</html>
