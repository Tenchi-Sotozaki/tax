<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">
<head>
<title>宿泊税更正・決定通知書</title>
</head>
<body>
	<div layout:fragment="content" class="container-fluid px-4 py-3">
		<div class="container-fluid">
			<div class="row">
				<div class="col-12">
					<h2 class="mb-4">
						<i class="bi bi-file-earmark-text text-primary me-2"></i>宿泊税更正・決定通知書
					</h2>

					<form id="koseiKetteiForm" method="post">
						<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
						<input type="hidden" name="shiteiNo" th:value="${dto.shitei_no}" />

						<!-- 対象施設エリア -->
						<div class="card mb-4">
							<div class="card-header">
								<h5 class="mb-0">対象施設</h5>
							</div>
							<div class="card-body">
								<div class="row g-3">
									<div class="col-md-6">
										<label class="form-label">指定番号</label>
										<input type="text" class="form-control" th:value="${dto.shitei_no}" readonly>
									</div>
									<div class="col-md-6">
										<label class="form-label">施設名称</label>
										<input type="text" class="form-control" th:value="${dto.shisetsu_name}" readonly>
									</div>
								</div>
								<div class="row g-3 mt-2">
									<div class="col-md-12">
										<label class="form-label">施設住所</label>
										<input type="text" class="form-control" th:value="${dto.shisetsu_jusho}" readonly>
									</div>
								</div>
							</div>
						</div>

						<!-- 対象月選択エリア -->
						<div class="card mb-4">
							<div class="card-header">
								<h5 class="mb-0">対象月(3ヵ月間まで出力可能)</h5>
							</div>
							<div class="card-body">
								<div class="row g-3 align-items-end">

									<!-- 対象月１（必須） -->
									<div class="col-md-3">
										<label class="form-label fw-bold">
											対象月１<span class="badge bg-danger ms-1">必須</span>
										</label>
										<select id="b1Ym" name="b1Ym" class="form-select" required>
											<option value="">--- 選択してください ---</option>
											<option th:each="ym : ${taishoYmList}"
													th:value="${ym}"
													th:text="${#strings.substring(ym,0,4) + '年' + #strings.substring(ym,4,6) + '月'}">
											</option>
										</select>
									</div>

									<!-- 対象月２（任意・チェックで有効化） -->
									<div class="col-md-3" id="b2Container" style="display:none;">
										<div class="form-check mb-1">
											<input class="form-check-input" type="checkbox" id="b2Check" checked>
											<label class="form-check-label fw-bold" for="b2Check">
												対象月２をPDFに含める
											</label>
										</div>
										<div class="form-control bg-light" id="b2YmBox">
											<span id="b2YmDisplay" class="text-dark"></span>
										</div>
										<input type="hidden" id="b2Ym" name="b2Ym" />
									</div>

									<!-- 対象月３（任意・対象月２チェック時のみ選択可） -->
									<div class="col-md-3" id="b3Container" style="display:none;">
										<div class="form-check mb-1">
											<input class="form-check-input" type="checkbox" id="b3Check" checked>
											<label class="form-check-label fw-bold" for="b3Check">
												対象月３をPDFに含める
											</label>
										</div>
										<div class="form-control bg-light" id="b3YmBox">
											<span id="b3YmDisplay" class="text-dark"></span>
										</div>
										<input type="hidden" id="b3Ym" name="b3Ym" />
									</div>

								</div>
							</div>
						</div>

						<!-- アクションボタン -->
						<div class="d-flex gap-2">
							<button type="button" class="btn btn-primary" onclick="generatePdf()">
								<i class="bi bi-file-earmark-pdf me-1"></i> PDF
							</button>
							<button type="button" class="btn btn-info" onclick="previewPdf()">
								<i class="bi bi-eye me-1"></i> プレビュー
							</button>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>

	<th:block layout:fragment="scripts">
		<script th:inline="javascript">
			const ctxPath = /*[[@{/}]]*/ '/';
			const taishoYmList = /*[[${taishoYmList}]]*/ [];

			function generatePdf() {
				if (!document.getElementById('b1Ym').value) {
					alert('対象月１を選択してください。');
					return;
				}
				const form = document.getElementById('koseiKetteiForm');
				form.action = ctxPath + 'reports/koseiKetteiTsuchi/pdf';
				form.target = '_blank';
				form.submit();
			}

			function previewPdf() {
				if (!document.getElementById('b1Ym').value) {
					alert('対象月１を選択してください。');
					return;
				}
				const form = document.getElementById('koseiKetteiForm');
				form.action = ctxPath + 'reports/koseiKetteiTsuchi/preview';
				form.target = '_blank';
				form.submit();
			}

			function addMonths(ym, n) {
				const year  = parseInt(ym.substring(0, 4));
				const month = parseInt(ym.substring(4, 6)) - 1;
				const d = new Date(year, month + n, 1);
				const m = String(d.getMonth() + 1).padStart(2, '0');
				return `${d.getFullYear()}${m}`;
			}

			function toLabel(ym) {
				return `${ym.substring(0, 4)}年${ym.substring(4, 6)}月`;
			}

			/** b3の表示・値をb2チェック状態と連動して更新 */
			function updateB3(b1, b2Checked) {
				const b3Ym        = b1 ? addMonths(b1, 2) : '';
				const b3Exists    = b3Ym && taishoYmList.includes(b3Ym);
				const b3Container = document.getElementById('b3Container');
				const b3Check     = document.getElementById('b3Check');
				const b3Display   = document.getElementById('b3YmDisplay');
				const b3Input     = document.getElementById('b3Ym');

				if (b3Exists && b2Checked) {
					// b2がONかつb3データあり → b3を表示・有効
					b3Container.style.display = '';
					b3Check.disabled  = false;
					b3Display.textContent = toLabel(b3Ym);
					if (b3Check.checked) {
						b3Input.value = b3Ym;
					}
				} else {
					// b2がOFF または b3データなし → b3を非表示
					b3Container.style.display = 'none';
					b3Check.checked  = false;
					b3Input.value    = '';
				}
			}

			/** 対象月１変更時 */
			document.getElementById('b1Ym').addEventListener('change', function () {
				const b1 = this.value;

				// b2処理
				const b2Ym        = b1 ? addMonths(b1, 1) : '';
				const b2Exists    = b2Ym && taishoYmList.includes(b2Ym);
				const b2Container = document.getElementById('b2Container');
				const b2Check     = document.getElementById('b2Check');
				const b2Display   = document.getElementById('b2YmDisplay');
				const b2Input     = document.getElementById('b2Ym');

				if (b2Exists) {
					b2Container.style.display = '';
					b2Check.checked       = true;
					b2Display.textContent = toLabel(b2Ym);
					b2Input.value         = b2Ym;
				} else {
					b2Container.style.display = 'none';
					b2Check.checked  = false;
					b2Input.value    = '';
				}

				// b3処理
				updateB3(b1, b2Exists && b2Check.checked);
			});

			/** 対象月２チェック変更時 */
			document.getElementById('b2Check').addEventListener('change', function () {
				const b1     = document.getElementById('b1Ym').value;
				const b2Ym   = addMonths(b1, 1);
				const b2Input = document.getElementById('b2Ym');

				b2Input.value = this.checked ? b2Ym : '';

				// b2OFFならb3も連動してOFF・非表示
				updateB3(b1, this.checked);
			});

			/** 対象月３チェック変更時 */
			document.getElementById('b3Check').addEventListener('change', function () {
				const b1     = document.getElementById('b1Ym').value;
				const b3Ym   = addMonths(b1, 2);
				const b3Input = document.getElementById('b3Ym');

				b3Input.value = this.checked ? b3Ym : '';
			});
		</script>
	</th:block>
</body>
</html>
