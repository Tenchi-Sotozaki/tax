<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">
<head>
<title>宿泊税更正・決定通知書</title>
</head>
<body>
	<div layout:fragment="content" class="container-fluid px-4 py-3">
		<div class="container-fluid">
			<div class="row">
				<div class="col-12">
					<h2 class="mb-4">
						<i class="bi bi-file-earmark-text text-primary me-2"></i>宿泊税更正・決定通知書
					</h2>

					<form id="koseiKetteiForm" method="post">
						<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
						<input type="hidden" name="shiteiNo" th:value="${dto.shitei_no}" />

						<!-- 対象施設エリア -->
						<div class="card mb-4">
							<div class="card-header">
								<h5 class="mb-0">対象施設</h5>
							</div>
							<div class="card-body">
								<div class="row g-3">
									<div class="col-md-6">
										<label class="form-label">指定番号</label>
										<input type="text" class="form-control" th:value="${dto.shitei_no}" readonly>
									</div>
									<div class="col-md-6">
										<label class="form-label">施設名称</label>
										<input type="text" class="form-control" th:value="${dto.shisetsu_name}" readonly>
									</div>
								</div>
								<div class="row g-3 mt-2">
									<div class="col-md-12">
										<label class="form-label">施設住所</label>
										<input type="text" class="form-control" th:value="${dto.shisetsu_jusho}" readonly>
									</div>
								</div>
							</div>
						</div>

						<!-- 対象月選択エリア -->
						<div class="card mb-4">
							<div class="card-header">
								<h5 class="mb-0">対象月</h5>
							</div>
							<div class="card-body">
								<div class="row g-3 align-items-center">
									<div class="col-md-3">
										<label class="form-label">b1（必須）<span class="badge bg-danger ms-1">必須</span></label>
										<select id="b1Ym" name="b1Ym" class="form-select" required>
											<option value="">--- 選択してください ---</option>
											<option th:each="ym : ${taishoYmList}"
													th:value="${ym}"
													th:text="${#strings.substring(ym,0,4) + '年' + #strings.substring(ym,4,6) + '月'}">
											</option>
										</select>
									</div>
									<div class="col-md-3">
										<label class="form-label">b2（自動）</label>
										<div class="form-control bg-light">
											<span id="b2YmDisplay" style="display:none;"></span>
											<span id="b2YmEmpty" class="text-muted">-</span>
										</div>
										<input type="hidden" id="b2Ym" name="b2Ym" />
									</div>
									<div class="col-md-3">
										<label class="form-label">b3（自動）</label>
										<div class="form-control bg-light">
											<span id="b3YmDisplay" style="display:none;"></span>
											<span id="b3YmEmpty" class="text-muted">-</span>
										</div>
										<input type="hidden" id="b3Ym" name="b3Ym" />
									</div>
								</div>
							</div>
						</div>

						<!-- アクションボタン -->
						<div class="d-flex gap-2">
							<button type="button" class="btn btn-primary" onclick="generatePdf()">
								<i class="bi bi-file-earmark-pdf me-1"></i> PDF
							</button>
							<button type="button" class="btn btn-info" onclick="previewPdf()">
								<i class="bi bi-eye me-1"></i> プレビュー
							</button>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>

	<th:block layout:fragment="scripts">
		<script th:inline="javascript">
			const ctxPath = /*[[@{/}]]*/ '/';
			const taishoYmList = /*[[${taishoYmList}]]*/ [];

			function generatePdf() {
				if (!document.getElementById('b1Ym').value) {
					alert('対象月（b1）を選択してください。');
					return;
				}
				const form = document.getElementById('koseiKetteiForm');
				form.action = ctxPath + 'reports/koseiKetteiTsuchi/pdf';
				form.target = '_blank';
				form.submit();
			}

			function previewPdf() {
				if (!document.getElementById('b1Ym').value) {
					alert('対象月（b1）を選択してください。');
					return;
				}
				const form = document.getElementById('koseiKetteiForm');
				form.action = ctxPath + 'reports/koseiKetteiTsuchi/preview';
				form.target = '_blank';
				form.submit();
			}

			function addMonths(ym, n) {
				const year  = parseInt(ym.substring(0, 4));
				const month = parseInt(ym.substring(4, 6)) - 1;
				const d = new Date(year, month + n, 1);
				const m = String(d.getMonth() + 1).padStart(2, '0');
				return `${d.getFullYear()}${m}`;
			}

			function toLabel(ym) {
				return `${ym.substring(0, 4)}年${ym.substring(4, 6)}月`;
			}

			document.getElementById('b1Ym').addEventListener('change', function () {
				const b1 = this.value;
				['b2', 'b3'].forEach((id, i) => {
					const disp  = document.getElementById(id + 'YmDisplay');
					const empty = document.getElementById(id + 'YmEmpty');
					const inp   = document.getElementById(id + 'Ym');
					if (b1 && taishoYmList.includes(addMonths(b1, i + 1))) {
						const ym       = addMonths(b1, i + 1);
						inp.value      = ym;
						disp.textContent   = toLabel(ym) + '（自動）';
						disp.style.display = '';
						empty.style.display = 'none';
					} else {
						inp.value          = '';
						disp.style.display = 'none';
						empty.style.display = '';
					}
				});
			});
		</script>
	</th:block>
</body>
</html>
