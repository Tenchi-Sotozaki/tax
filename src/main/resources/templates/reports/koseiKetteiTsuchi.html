<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">

<head>
<meta charset="UTF-8">
<title>宿泊税更正・決定通知書</title>
</head>

<body>
	<div layout:fragment="content" class="container-fluid px-4 py-3">
		<div class="container-fluid">
			<div class="row">
				<div class="col-12">
					<div
						class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
						<h5 class="mb-0 fw-bold text-dark">
							<i class="bi bi-file-earmark-text text-primary me-2"></i>宿泊税更正・決定通知書
						</h5>
					</div>

					<div id="appConfig" th:data-ctx-path="@{/}"
						th:data-taisho-ym-list="${taishoYmList}" style="display: none;">
					</div>

					<!-- 帳票発行エラー表示エリア -->
					<div th:replace="~{layout/components :: reportErrorAlert}"></div>

					<form id="koseiKetteiForm" method="post">

						<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
						<input type="hidden" name="shiteiNo" th:value="${selectedShiteiGassan?.shiteiNo}" />
						<input type="hidden" name="koin" th:value="${dto.koin}">

						<!-- 特別徴収義務者情報エリア -->
						<div th:replace="~{layout/components :: selectedTokugimuInfo}"></div>

						<!-- 内容エリア -->
						<div class="card mb-4">
							<div class="card-header">
								<h5 class="mb-0">内容</h5>
							</div>
							<div class="card-body">
								<!-- 発行区分 -->
								<div class="row g-3">
									<div class="col-md-3">
										<label for="henkoKbn" class="form-label fw-bold">発行区分 <span
											class="text-danger">*</span></label>
										<select id="henkoKbn" name="henkoKbn" class="form-select" required>
											<option value="2">更正</option>
											<option value="3">決定</option>
										</select>
									</div>
								</div>

								<!-- 対象月 -->
								<label class="form-label fw-bold mt-3">対象月(最大3ヵ月間まで出力可能)</label>
								<div class="row g-3 align-items-end">


									<!-- 対象月１-->
									<div class="col-md-3">
										<label class="form-label fw-bold"> 対象月1 <span
											class="text-danger">*</span>
										</label> <select id="b1Ym" name="b1Ym" class="form-select" required>

											<option value="">--- 選択してください ---</option>
											<option th:each="ym : ${taishoYmList}" th:value="${ym}"
												th:text="${#strings.substring(ym,0,4) + '年' + #strings.substring(ym,4,6) + '月'}">
											</option>
										</select>
									</div>

									<!-- 対象月２（任意)チェックで有効化！-->
									<div class="col-md-3" id="b2Container" style="display: none;">

										<div class="form-check mb-1">
											<input class="form-check-input" type="checkbox" id="b2Check"
												checked> <label class="form-check-label fw-bold"
												for="b2Check"> 対象月２をPDFに含める </label>
										</div>
										<div class="form-control bg-light" id="b2YmBox">
											<span id="b2YmDisplay" class="text-dark"></span>
										</div>
										<input type="hidden" id="b2Ym" name="b2Ym" />
									</div>


									<!-- 対象月３（任意)対象月２チェック時のみ選択可-->
									<div class="col-md-3" id="b3Container" style="display: none;">

										<div class="form-check mb-1">
											<input class="form-check-input" type="checkbox" id="b3Check"
												checked> <label class="form-check-label fw-bold"
												for="b3Check"> 対象月３をPDFに含める </label>
										</div>
										<div class="form-control bg-light" id="b3YmBox">
											<span id="b3YmDisplay" class="text-dark"></span>
										</div>
										<input type="hidden" id="b3Ym" name="b3Ym" />
									</div>

								</div>
							</div>
						</div>

						<!-- アクションボタン -->
						<div class="d-flex justify-content-center gap-2">
							<button type="submit" class="btn btn-primary"
								th:formaction="@{/reports/koseiKetteiTsuchi/pdf}">
								<i class="bi bi-file-earmark-pdf me-1"></i> PDF
							</button>
							<button type="submit" class="btn btn-outline-primary"
								th:formaction="@{/reports/koseiKetteiTsuchi/preview}" formtarget="_blank">
								<i class="bi bi-eye me-1"></i> プレビュー
							</button>
							<button type="submit" class="btn btn-primary"
								th:formaction="@{/reports/koseiKetteiTsuchi/print}" formtarget="_blank">
								<i class="bi bi-printer me-1"></i> 印刷
							</button>
							<a th:href="@{/tokugimu/report}" class="btn btn-outline-secondary">
								<i class="bi bi-arrow-left me-1"></i> 戻る
							</a>
						</div>
					</form>
				</div>
			</div>
		</div>
		<!-- 特別徴収義務者指定モーダル -->
		<div th:replace="~{layout/components :: shiteiGassanSearchModal}"></div>
	</div>

	<th:block layout:fragment="scripts">
		<script th:src="@{/js/koseiKetteiTsuchi.js}"></script>
		<script th:src="@{/js/shiteiGassanSearch.js}"></script>
		<script th:src="@{/js/reportForm.js}"></script>
	</th:block>
</body>

</html>
