<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">

<head>
	<title>合算申告納入承認通知書</title>
</head>

<body>
	<div layout:fragment="content" class="container-fluid px-4 py-3">
		<div class="container-fluid">
			<div class="row">
				<div class="col-12">
					<div
						class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
						<h5 class="mb-0 fw-bold text-dark">
							<i class="bi bi-file-earmark-text text-primary me-2"></i>合算申告納入承認通知書
						</h5>
					</div>

					<!-- 帳票発行エラー表示エリア -->
					<div th:replace="~{layout/components :: reportErrorAlert}"></div>

					<form id="tsuchiForm" th:object="${dto}" method="post"
						onsubmit="return validateForm()">
						<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
						<input type="hidden" name="shiteiNo" th:value="${selectedShiteiGassan?.shiteiNo}" />
						<!-- 特別徴収義務者情報エリア -->
						<div th:replace="~{layout/components :: selectedTokugimuInfo}"></div>

						<!-- 内容エリア -->
						<div class="card mb-4">
							<div class="card-header">
								<h5 class="mb-0">内容</h5>
							</div>
							<div class="card-body">
								<div class="row g-3">
									<div class="col-md-6">
										<label for="hakkoYmd" class="form-label">発行年月日 <span
												class="text-danger">*</span></label>
										<input type="date" class="form-control" id="hakkoYmd" th:field="*{hakkoYmd}"
											required>
									</div>
									<div class="col-md-6">
										<label for="tekiyoStYmd" class="form-label">適用開始年月</label>
										<input type="date" class="form-control" id="tekiyoStYmd"
											th:field="*{tekiyoStYmd}" readonly>
									</div>
								</div>
								<div class="row g-3 mt-2">
									<div class="col-12">
										<label for="biko" class="form-label">備考</label>
										<textarea class="form-control" id="biko" th:field="*{biko}" rows="3"
											placeholder="備考を入力してください"></textarea>
									</div>
								</div>
							</div>
						</div>

						<input type="hidden" th:field="*{tokuName}">
						<input type="hidden" th:field="*{tokuJusho}">
						<input type="hidden" th:field="*{gassanShiteiNo}">
						<input type="hidden" th:field="*{city}">
						<input type="hidden" th:field="*{jorei}">
						<input type="hidden" th:field="*{koin}">
						<input type="hidden" th:field="*{nonyuKigen}">

						<!-- アクションボタン -->
						<div class="d-flex justify-content-center gap-2">
							<a th:href="@{/tokugimu/report}" class="btn btn-outline-secondary">
								<i class="bi bi-arrow-left me-1"></i> 戻る
							</a>
							<button type="submit" class="btn btn-primary" th:formaction="@{/reports/gassanNonyuTsuchi/preview}"
								formtarget="_blank">
								<i class="bi bi-eye me-1"></i> プレビュー
							</button>
							<button type="submit" class="btn btn-primary" th:formaction="@{/reports/gassanNonyuTsuchi/pdf}">
								<i class="bi bi-file-earmark-pdf me-1"></i> PDF
							</button>
							<button type="submit" class="btn btn-primary" th:formaction="@{/reports/gassanNonyuTsuchi/print}" formtarget="_blank">
								<i class="bi bi-printer me-1"></i> 印刷
							</button>
						</div>
					</form>
				</div>
			</div>
		</div>
		<!-- 特別徴収義務者指定モーダル -->
		<div th:replace="~{layout/components :: shiteiGassanSearchModal}"></div>
	</div>

	<th:block layout:fragment="scripts">
		<script th:src="@{/js/gassanNonyuTsuchi.js}"></script>
		<script th:src="@{/js/reportForm.js}"></script>
	</th:block>
</body>

</html>
