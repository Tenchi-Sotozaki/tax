<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">

<head>
	<title>帳票ログ照会</title>
	<link rel="stylesheet" th:href="@{/css/tokugimu-daicho.css}">
</head>

<body>
	<div layout:fragment="content" class="container-fluid p-4">

		<div
			class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
			<h5 class="mb-0 fw-bold text-dark">
				<i class="bi bi-file-earmark-text me-2 text-primary"></i>帳票ログ照会
			</h5>
		</div>

		<!-- ======== 検索条件 ======== -->
		<div class="accordion mb-3 shadow-sm" id="searchAccordion">
			<div class="accordion-item border">
				<h2 class="accordion-header">
					<button class="accordion-button py-2 fw-semibold" th:classappend="${searched == true} ? 'collapsed' : ''" type="button" data-bs-toggle="collapse"
						data-bs-target="#searchPanel">
						<i class="bi bi-funnel me-2"></i>検索条件
					</button>
				</h2>
			</div>
			<div id="searchPanel" class="accordion-collapse collapse" th:classappend="${searched != true} ? 'show' : ''">
				<div class="accordion-body pt-3 pb-2 px-3">
					<form th:action="@{/log/rpt-log/search}" th:object="${form}" method="post" id="searchForm">
						<input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}"
							th:value="${_csrf.token}" />

						<div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-2 mb-2">

							<!-- 印刷日時 FROM -->
							<div class="col">
								<label class="form-label form-label-sm fw-medium mb-1">印刷日時（FROM） <span class="text-danger">*</span></label>
								<input type="datetime-local" class="form-control form-control-sm" id="opeDtFrom"
									th:field="*{opeDtFrom}" th:classappend="${#fields.hasErrors('opeDtFrom')} ? 'is-invalid' : ''">
								<div class="invalid-feedback" th:if="${#fields.hasErrors('opeDtFrom')}" th:errors="*{opeDtFrom}"></div>
							</div>

							<!-- 印刷日時 TO -->
							<div class="col">
								<label class="form-label form-label-sm fw-medium mb-1">印刷日時（TO） <span class="text-danger">*</span></label>
								<input type="datetime-local" class="form-control form-control-sm" id="opeDtTo"
									th:field="*{opeDtTo}" th:classappend="${#fields.hasErrors('opeDtTo')} ? 'is-invalid' : ''">
								<div class="invalid-feedback" th:if="${#fields.hasErrors('opeDtTo')}" th:errors="*{opeDtTo}"></div>
							</div>

							<!-- 帳票名 -->
							<div class="col">
								<label class="form-label form-label-sm fw-medium mb-1">帳票名</label>
								<select class="form-select form-select-sm" th:field="*{rptId}">
									<option value="">-- 選択してください --</option>
									<option th:each="r : ${reports}" th:value="${r.rptId}" th:text="${r.rptName}">
									</option>
								</select>
							</div>

							<!-- 操作 -->
							<div class="col">
								<label class="form-label form-label-sm fw-medium mb-1">操作</label>
								<select class="form-select form-select-sm" th:field="*{sousa}">
									<option value="">-- 選択してください --</option>
									<option value="1">PDF</option>
									<option value="2">プレビュー</option>
									<option value="3">印刷</option>
								</select>
							</div>

							<!-- 印刷者 -->
							<div class="col">
								<label class="form-label form-label-sm fw-medium mb-1">印刷者</label>
								<input type="text" class="form-control form-control-sm" th:field="*{opeUser}"
									placeholder="前方一致">
							</div>

							<!-- 指定番号 -->
							<div class="col">
								<label class="form-label form-label-sm fw-medium mb-1">指定番号</label>
								<input type="text" class="form-control form-control-sm" th:field="*{shiteiNo}"
									placeholder="完全一致">
							</div>

						</div>

						<div class="d-flex justify-content-end gap-2 pt-1 border-top">
							<button type="button" class="btn btn-outline-secondary btn-sm" id="resetBtn">
								<i class="bi bi-arrow-counterclockwise me-1"></i>検索条件初期化
							</button>
							<button type="submit" class="btn btn-primary btn-sm px-4">
								<i class="bi bi-search me-1"></i>検索する
							</button>
						</div>
					</form>
				</div>
			</div>
		</div>

		<th:block th:if="${searched}">

		<!-- ======== 件数・ページネーション ======== -->
		<div class="d-flex justify-content-between align-items-center mb-2">
			<span class="text-muted small">検索結果：<span id="totalCount" th:text="${items.size()}">0</span> 件</span>
			<nav>
				<ul class="pagination pagination-sm mb-0" id="pagination" data-pagination-rows=".log-row"></ul>
			</nav>
			<div class="d-flex align-items-center gap-2">
				<label class="form-label form-label-sm fw-medium mb-0">表示件数</label>
				<select id="pageSizeSelect" class="form-select form-select-sm" style="width: auto;">
					<option value="10" selected>10件</option>
					<option value="50">50件</option>
					<option value="100">100件</option>
				</select>
			</div>
		</div>

		<!-- ======== 一覧テーブル ======== -->
		<div class="card shadow-sm mb-2">
			<div class="card-body p-0">
			<div class="table-scroll" style="max-height: 70vh;">
				<table class="table table-bordered table-hover table-sm align-middle mb-0 sticky-table">
					<thead class="table-primary">
						<tr>
							<th style="width: 80px;">No.</th>
							<th style="width: 200px;">帳票名</th>
							<th style="width: 100px;">操作</th>
							<th style="width: 120px;">印刷者</th>
							<th style="width: 170px;">印刷日時</th>
							<th style="width: 120px;">指定番号</th>
						</tr>
					</thead>
					<tbody>
						<tr th:if="${items.isEmpty()}">
							<td colspan="6" class="text-center text-muted py-4">該当するログが見つかりません</td>
						</tr>
						<tr class="log-row" th:each="item, stat : ${items}">
							<td th:text="${stat.count}"></td>
							<td th:text="${item.rptName}"></td>
							<td th:text="${item.sousaName}"></td>
							<td th:text="${item.opeUser}"></td>
							<td th:text="${#temporals.format(item.opeDt, 'yyyy/MM/dd HH:mm:ss')}"></td>
							<td th:text="${item.shiteiNo}"></td>
						</tr>
					</tbody>
				</table>
			</div>
			</div>
		</div>

		</th:block>

	</div>

	<th:block layout:fragment="scripts">
		<script th:src="@{/js/rptLogView.js}"></script>
	</th:block>
</body>

</html>
