<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">

<head>
	<title>蜷育ｮ礼筏蜻顔匳骭ｲ/邱ｨ髮・辣ｧ莨・/title>
</head>

<body>
	<div layout:fragment="content" class="container-fluid p-4"
		th:with="formAction=${isEdit} ? '/gassan/edit/' + ${editId} : '/gassan/registration'"
		th:data-is-edit="${isEdit}" th:data-show-shitei-modal="${showShiteiModal}">

		<!-- 繝壹・繧ｸ繝倥ャ繝繝ｼ -->
		<div class="d-flex justify-content-between align-items-center pt-3 pb-2 mb-3 border-bottom">
			<h5 class="mb-0 fw-bold text-dark">
				<i class="bi bi-file-earmark-text me-2 text-primary"></i> <span
					th:text="${isView} ? '蜷育ｮ礼筏蜻・辣ｧ莨・ : (${isEdit} ? '蜷育ｮ礼筏蜻・邱ｨ髮・ : '蜷育ｮ礼筏蜻・譁ｰ隕冗匳骭ｲ')"></span>
			</h5>
			<th:block th:if="${isView}">
				<a th:href="@{/gassan/edit/{id}(id=${editId})}" class="btn btn-primary btn-sm"> <i
						class="bi bi-pencil-square me-2"></i>邱ｨ髮・☆繧・
				</a>
			</th:block>
		</div>

		<!-- 迚ｹ蛻･蠕ｴ蜿守ｾｩ蜍呵・ュ蝣ｱ -->
		<div th:replace="~{layout/components :: selectedTokugimuInfo}"></div>

		<!-- 繧ｨ繝ｩ繝ｼ繝｡繝・そ繝ｼ繧ｸ -->
		<div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
			<i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${errorMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>

		<form id="gassanForm" th:action="@{${formAction}}" th:object="${GassanForm}" method="post">
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" /> <input type="hidden"
				th:field="*{atenaNo}"> <input type="hidden" th:field="*{fromShiteiNo}"> <input th:if="${isEdit}"
				type="hidden" th:field="*{gassanShiteiNo}">

			<!-- 繝舌Μ繝・・繧ｷ繝ｧ繝ｳ繧ｨ繝ｩ繝ｼ繧ｵ繝槭Μ繝ｼ -->
			<div th:if="${validationErrors != null and !validationErrors.isEmpty()}"
				class="alert alert-danger alert-dismissible fade show" role="alert">
				<i class="bi bi-exclamation-triangle-fill me-2"></i>蜈･蜉帛・螳ｹ縺ｫ <span
					th:text="${validationErrors.size()}"></span> 莉ｶ縺ｮ繧ｨ繝ｩ繝ｼ縺後≠繧翫∪縺吶・
				<ul class="mb-0 mt-1">
					<li th:each="err : ${validationErrors}" th:text="${err}" class="small"></li>
				</ul>
				<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
			</div>

			<!-- ===== 逕ｳ蜻頑ュ蝣ｱ繧ｨ繝ｪ繧｢ ===== -->
			<div class="card mb-4 shadow-sm">
				<div class="card-header py-3">
					<h5 class="mb-0">
						<i class="bi bi-info-circle me-2"></i>逕ｳ蜻頑ュ蝣ｱ
					</h5>
				</div>
				<div class="card-body bg-light-subtle">
					<div class="row g-3">

						<!-- 逋ｻ骭ｲ譌･ -->
						<div class="col-md-3">
							<label th:for="!${isView} ? 'torokuYmd' : 'torokuYmdView'" class="form-label fw-medium"> 逋ｻ骭ｲ譌･
								<span class="text-danger" th:if="!${isView}">*</span>
							</label>
							<input th:if="!${isView}" type="date" class="form-control" id="torokuYmd"
								th:field="*{torokuYmd}" th:errorclass="is-invalid" th:data-initial-value="*{torokuYmd}">
							<input th:if="${isView}" type="text" class="form-control" id="torokuYmdView" readonly
								th:value="*{torokuYmd}">
							<div class="invalid-feedback" th:if="${#fields.hasErrors('torokuYmd')}"
								th:errors="*{torokuYmd}"></div>
						</div>

						<!-- 逕ｳ蜻頑律 -->
						<div class="col-md-3">
							<label th:for="!${isView} ? 'shinkokuYmd' : 'shinkokuYmdView'" class="form-label fw-medium">
								逕ｳ蜻頑律 <span class="text-danger" th:if="!${isView}">*</span>
							</label>
							<input th:if="!${isView}" type="date" class="form-control" id="shinkokuYmd"
								th:field="*{shinkokuYmd}" th:errorclass="is-invalid"
								th:data-initial-value="*{shinkokuYmd}">
							<input th:if="${isView}" type="text" class="form-control" id="shinkokuYmdView" readonly
								th:value="*{shinkokuYmd}">
							<div class="invalid-feedback" th:if="${#fields.hasErrors('shinkokuYmd')}"
								th:errors="*{shinkokuYmd}"></div>
						</div>

						<!-- 螳帛錐諠・ｱ・医そ繝・す繝ｧ繝ｳ縺九ｉ蜿門ｾ暦ｼ・-->
						<div class="col-md-6">
							<label class="form-label fw-medium">螳帛錐</label>
							<input type="text" class="form-control bg-light" th:value="*{atenaName}" readonly>
						</div>

						<!-- 蜷育ｮ玲欠螳夂分蜿ｷ・育ｷｨ髮・・辣ｧ莨壹・縺ｿ・・-->
						<div th:if="${isEdit or isView}" class="col-md-4">
							<label class="form-label fw-medium">蜷育ｮ玲欠螳夂分蜿ｷ</label>
							<input type="text" class="form-control bg-light" th:value="*{gassanShiteiNo}" readonly
								th:data-initial-value="*{gassanShiteiNo}">
						</div>

						<!-- 驕ｩ逕ｨ譎よ悄(FROM) -->
						<div class="col-md-4">
							<label th:for="!${isView} ? 'tekiyoStYmd' : 'tekiyoStYmdView'" class="form-label fw-medium">
								驕ｩ逕ｨ譎よ悄(FROM) <span class="text-danger" th:if="!${isView}">*</span>
							</label>
							<input th:if="!${isView}" type="date" class="form-control" id="tekiyoStYmd"
								th:field="*{tekiyoStYmd}" th:errorclass="is-invalid"
								th:data-initial-value="*{tekiyoStYmd}">
							<input th:if="${isView}" type="text" class="form-control" id="tekiyoStYmdView" readonly
								th:value="*{tekiyoStYmd}">
							<div class="invalid-feedback" th:if="${#fields.hasErrors('tekiyoStYmd')}"
								th:errors="*{tekiyoStYmd}"></div>
						</div>

						<!-- 驕ｩ逕ｨ譎よ悄(TO) -->
						<div class="col-md-4">
							<label th:for="!${isView} ? 'tekiyoEdYmd' : 'tekiyoEdYmdView'" class="form-label fw-medium">
								驕ｩ逕ｨ譎よ悄(TO)
							</label>
							<input th:if="!${isView}" type="date" class="form-control" id="tekiyoEdYmd"
								th:field="*{tekiyoEdYmd}" th:errorclass="is-invalid"
								th:data-initial-value="*{tekiyoEdYmd}">
							<input th:if="${isView}" type="text" class="form-control" id="tekiyoEdYmdView" readonly
								th:value="*{tekiyoEdYmd}">
							<div class="invalid-feedback" th:if="${#fields.hasErrors('tekiyoEdYmd')}"
								th:errors="*{tekiyoEdYmd}"></div>
						</div>

					</div>
				</div>
			</div>

			<!-- ===== 蠕ｴ蜿守ｾｩ蜍呵・ｸ隕ｧ繧ｨ繝ｪ繧｢ ===== -->
			<div class="card mb-4 shadow-sm">
				<div class="card-header py-3">
					<h5 class="mb-0">
						<i class="bi bi-building me-2"></i>蠕ｴ蜿守ｾｩ蜍呵・ｸ隕ｧ <span th:if="!${isView}"
							class="badge bg-danger ms-2 fs-6">蠢・茨ｼ・莉ｶ莉･荳企∈謚橸ｼ・/span>
					</h5>
				</div>
				<div class="card-body p-0">

					<!-- 繝舌Μ繝・・繧ｷ繝ｧ繝ｳ繧ｨ繝ｩ繝ｼ -->
					<div th:if="${#fields.hasErrors('shiteiNoList')}" class="alert alert-danger py-2 mx-3 mt-3 mb-3">
						<i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:errors="*{shiteiNoList}"></span>
					</div>

					<table class="table table-bordered table-hover table-sm align-middle mb-0">
						<thead class="table-light">
							<tr>
								<th style="width: 60px" class="text-center"></th>
								<th style="width: 80px" class="text-center">莉｣陦ｨ譁ｽ險ｭ</th>
								<th>蠕ｴ蜿守ｾｩ蜍呵・錐</th>
								<th>譁ｽ險ｭ蜷・/th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="facility, stat : *{facilityList}"
								th:classappend="${facility.checked} ? 'table-primary' : ''">
								<td class="text-center">
									<!-- 逋ｻ骭ｲ繝ｻ邱ｨ髮・凾・壹メ繧ｧ繝・け繝懊ャ繧ｯ繧ｹ --> <input th:if="!${isView}" type="checkbox"
										class="form-check-input facility-check" th:name="'shiteiNoList'"
										th:value="${facility.shiteiNo}" th:checked="${facility.checked}"
										th:disabled="${facility.disabled}">
									<!-- 辣ｧ莨壽凾・壹メ繧ｧ繝・け貂医∩繧｢繧､繧ｳ繝ｳ -->
									<i th:if="${isView} and ${facility.checked}"
										class="bi bi-check-circle-fill text-primary fs-5"></i> <i
										th:if="${isView} and !${facility.checked}"
										class="bi bi-circle text-muted fs-5"></i>
								</td>
								<td class="text-center">
									<!-- 莉｣陦ｨ譁ｽ險ｭ繝√ぉ繝・け繝懊ャ繧ｯ繧ｹ --> <input th:if="!${isView}" type="radio"
										class="form-check-input daihyo-radio" name="daihyoShiteiNo"
										th:value="${facility.shiteiNo}" th:checked="${facility.daihyo}"
										th:disabled="${facility.disabled or !facility.checked}"> <!-- 辣ｧ莨壽凾・壻ｻ｣陦ｨ譁ｽ險ｭ繧｢繧､繧ｳ繝ｳ -->
									<i th:if="${isView} and ${facility.daihyo}"
										class="bi bi-check-circle-fill text-success fs-5"></i>
								</td>
								<td th:text="${facility.choshuGimushaName}"></td>
								<td>
									<span th:text="${facility.shisetsuName}"></span>
									<span th:if="${facility.disabled}" class="badge bg-warning text-dark ms-2"
										th:text="'蜷育ｮ玲欠螳壽ｸ・' + ${facility.gassanShiteiNo} + ')'"></span>
								</td>
							</tr>
							<tr th:if="${#lists.isEmpty(GassanForm.facilityList)}">
								<td colspan="4" class="text-center text-muted py-4"><i
										class="bi bi-inbox fs-2 d-block mb-2 text-secondary"></i>
									蟇ｾ雎｡譁ｽ險ｭ縺瑚ｦ九▽縺九ｊ縺ｾ縺帙ｓ縺ｧ縺励◆縲・/td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>

			<!-- ===== 繧｢繧ｯ繧ｷ繝ｧ繝ｳ繝懊ち繝ｳ ===== -->
			<div class="d-flex justify-content-center gap-3 py-4 mb-5">
				<th:block th:if="!${isView}">
					<button type="button" id="openConfirmModalBtn" class="btn btn-success btn-lg px-5">
						<i th:class="${isEdit} ? 'bi bi-pencil-square me-2' : 'bi bi-save me-2'"></i>
						<span th:text="${isEdit} ? '譖ｴ譁ｰ縺吶ｋ' : '逋ｻ骭ｲ縺吶ｋ'"></span>
					</button>
				</th:block>

				<a th:href="@{/gassan/list}" class="btn btn-outline-secondary btn-lg px-4" th:if="${isView ?: false}">
					<i class="bi bi-arrow-left me-2"></i>荳隕ｧ縺ｫ謌ｻ繧・
				</a> <a th:href="@{/gassan/list}" class="btn btn-outline-secondary btn-lg px-4"
					th:unless="${isView ?: false}" onclick="return confirm('蜈･蜉帛・螳ｹ縺ｯ遐ｴ譽・＆繧後∪縺吶ゅｈ繧阪＠縺・〒縺吶°・・)"> <i
						class="bi bi-arrow-left me-2"></i>荳隕ｧ縺ｫ謌ｻ繧・
				</a>
			</div>
		</form>

		<!-- 遒ｺ隱阪Δ繝ｼ繝繝ｫ -->
		<div th:if="!${isView}"
			th:replace="~{layout/components :: confirmModal('registerModal', ${isEdit} ? '譖ｴ譁ｰ遒ｺ隱・ : '逋ｻ骭ｲ遒ｺ隱・, ${isEdit} ? '縺薙・蜀・ｮｹ縺ｧ譖ｴ譁ｰ縺励∪縺吶ゅｈ繧阪＠縺・〒縺吶°・・ : '縺薙・蜀・ｮｹ縺ｧ逋ｻ骭ｲ縺励∪縺吶ゅｈ繧阪＠縺・〒縺吶°・・, 'gassanForm', ${isEdit} ? 'btn-success' : 'btn-primary', ${isEdit} ? '譖ｴ譁ｰ' : '逋ｻ骭ｲ')}">
		</div>

		<!-- 迚ｹ蛻･蠕ｴ蜿守ｾｩ蜍呵・欠螳壹Δ繝ｼ繝繝ｫ -->
		<div th:replace="~{layout/components :: shiteiGassanSearchModal}"></div>

	</div>

	<th:block layout:fragment="scripts">
		<script th:src="@{/js/shiteiGassanSearch.js}"></script>
		<script th:src="@{/js/tGassanConfig.js}"></script>
	</th:block>
</body>

</html>
