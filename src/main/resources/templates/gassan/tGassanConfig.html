<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">

<head>
<title>合算申請登録/編集/照会</title>
</head>

<body>
	<div layout:fragment="content" class="container-fluid p-4"
		th:with="formAction=${isEdit} ? '/gassan/edit' : '/gassan/registration'"
		th:data-is-edit="${isEdit}"
		th:data-editable="${editable ?: true}"
		th:data-show-address-modal="${showAddressModal}">

		<div class="pb-2 mb-3 border-bottom sticky-top shadow-sm pt-3"
			style="z-index: 1020; top: -1rem; background-color: #f8f9fa;">
			<!-- 1段目：タイトル / 編集するボタン（照会のみ） -->
			<div
				class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center gap-2">
				<h5 class="mb-0 fw-bold text-dark">
					<i class="bi bi-file-earmark-text me-2 text-primary"></i> <span
						id="pageTitleSpan"
						th:text="${isView} ? '合算申請 照会' : (${isEdit} ? '合算申請 編集' : '合算申請 新規登録')"></span>
				</h5>
				<th:block th:if="${isView}">
					<a th:href="@{/gassan/edit}" class="btn btn-primary ms-auto"
						th:classappend="${editId == null} ? 'disabled' : ''"
						th:attr="aria-disabled=${editId == null}"> <i
						class="bi bi-pencil-square me-2"></i>編集する
					</a>
				</th:block>
			</div>
		</div>
		<!-- 2段目：合算情報表示（登録以外、または再登録時） -->
		<div id="sessionInfoArea"
			th:classappend="${isEdit} or ${isView} ? '' : 'd-none'">
			<div
				th:replace="~{layout/components :: selectedTokugimuInfo(${isView})}"></div>
		</div>


		<!-- 履歴ナビゲーション（照会画面のみ） -->
		<div
			th:if="${isView and GassanForm.maxRno != null and GassanForm.maxRno > 1}"
			class="d-flex align-items-center gap-2 mb-3">
			<a
				th:href="@{/gassan/view-form(rno=${GassanForm.rno - 1})}"
				class="btn btn-outline-secondary"
				th:classappend="${GassanForm.rno <= GassanForm.minRno} ? ' disabled'">
				<i class="bi bi-chevron-left"></i> 前の履歴
			</a> <span class="text-muted small">履歴 <span
				th:text="${GassanForm.rno}"></span> / <span
				th:text="${GassanForm.maxRno}"></span></span> <a
				th:href="@{/gassan/view-form(rno=${GassanForm.rno + 1})}"
				class="btn btn-outline-secondary"
				th:classappend="${GassanForm.rno >= GassanForm.maxRno} ? ' disabled'">
				次の履歴 <i class="bi bi-chevron-right"></i>
			</a>
		</div>



		<!-- エラーメッセージ -->
		<div th:if="${errorMessage}"
			class="alert alert-danger alert-dismissible fade show" role="alert">
			<i class="bi bi-exclamation-triangle-fill me-2"></i> <span
				th:text="${errorMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>

		<form id="gassanForm" th:action="@{${formAction}}"
			th:object="${GassanForm}" method="post">
			<input type="hidden" th:name="${_csrf.parameterName}"
				th:value="${_csrf.token}" /> <input type="hidden"
				th:field="*{atenaNo}"> <input type="hidden"
				th:field="*{fromShiteiNo}"> <input th:if="${isEdit}"
				type="hidden" th:field="*{gassanShiteiNo}">

			<!-- バリデーションエラーサマリー -->
			<div
				th:if="${validationErrors != null and !validationErrors.isEmpty()}"
				class="alert alert-danger alert-dismissible fade show" role="alert">
				<i class="bi bi-exclamation-triangle-fill me-2"></i>入力内容に <span
					th:text="${validationErrors.size()}"></span> 件のエラーがあります。
				<ul class="mb-0 mt-1">
					<li th:each="err : ${validationErrors}" th:text="${err}"
						class="small"></li>
				</ul>
				<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
			</div>

			<!-- ===== 申告情報エリア ===== -->
			<div class="card mb-4 shadow-sm">
				<div class="card-header py-3">
					<h5 class="mb-0">
						<i class="bi bi-info-circle me-2"></i>申告情報
					</h5>
				</div>
				<div class="card-body bg-light-subtle">
					<div class="row g-3">

						<!-- 登録日 -->
						<div class="col-md-3">
							<label
								th:for="!${isView} and ${editable ?: true} ? 'torokuYmd' : 'torokuYmdView'"
								class="form-label fw-medium"> 登録年月日 <span
								class="text-danger" th:if="!${isView} and ${editable ?: true}">*</span>
							</label> <input th:if="!${isView} and ${editable ?: true}" type="date"
								class="form-control" id="torokuYmd" th:field="*{torokuYmd}"
								th:errorclass="is-invalid" th:data-initial-value="*{torokuYmd}">
							<input th:if="${isView} or !${editable ?: true}" type="text"
								class="form-control form-control-readonly" id="torokuYmdView"
								readonly
								th:value="*{torokuYmd != null ? #temporals.format(torokuYmd, 'yyyy/MM/dd') : ''}">
							<div class="invalid-feedback"
								th:if="${#fields.hasErrors('torokuYmd')}"
								th:errors="*{torokuYmd}"></div>
						</div>

						<!-- 申告日 -->
						<div class="col-md-3">
							<label
								th:for="!${isView} and ${editable ?: true} ? 'shinkokuYmd' : 'shinkokuYmdView'"
								class="form-label fw-medium"> 申告年月日 <span
								class="text-danger" th:if="!${isView} and ${editable ?: true}">*</span>
							</label> <input th:if="!${isView} and ${editable ?: true}" type="date"
								class="form-control" id="shinkokuYmd" th:field="*{shinkokuYmd}"
								th:errorclass="is-invalid"
								th:data-initial-value="*{shinkokuYmd}"> <input
								th:if="${isView} or !${editable ?: true}" type="text"
								class="form-control form-control-readonly" id="shinkokuYmdView"
								readonly
								th:value="*{shinkokuYmd != null ? #temporals.format(shinkokuYmd, 'yyyy/MM/dd') : ''}">
							<div class="invalid-feedback"
								th:if="${#fields.hasErrors('shinkokuYmd')}"
								th:errors="*{shinkokuYmd}"></div>
						</div>

						<!-- 改行 -->
						<div th:if="${isEdit or isView}" class="w-100 d-none d-md-block"></div>

						<!-- 適用開始年月 -->
						<div class="col-md-3">
							<label
								th:for="!${isView} and ${editable ?: true} ? 'tekiyoStYmd' : 'tekiyoStYmdView'"
								class="form-label fw-medium"> 適用開始年月 <span
								class="text-danger" th:if="!${isView} and ${editable ?: true}">*</span>
							</label>
							<!-- 登録時：入力可 -->
							<input th:if="!${isView} and !${isEdit}" type="month"
								class="form-control" id="tekiyoStYmd" name="tekiyoStYmd"
								th:value="*{tekiyoStYmd != null ? #temporals.format(tekiyoStYmd, 'yyyy-MM') : ''}"
								th:errorclass="is-invalid"
								th:data-initial-value="*{tekiyoStYmd != null ? #temporals.format(tekiyoStYmd, 'yyyy-MM') : ''}">
							<!-- 編集時：editable かつ未来日のみ入力可 -->
							<input
								th:if="${isEdit} and ${editable ?: true} and ${tekiyoStYmdEditable}"
								type="month" class="form-control" id="tekiyoStYmd"
								name="tekiyoStYmd"
								th:value="*{tekiyoStYmd != null ? #temporals.format(tekiyoStYmd, 'yyyy-MM') : ''}"
								th:errorclass="is-invalid"
								th:data-initial-value="*{tekiyoStYmd != null ? #temporals.format(tekiyoStYmd, 'yyyy-MM') : ''}">
							<!-- 編集時：過去日 or 編集不可は読み取り専用 -->
							<input
								th:if="${isEdit} and (!${editable ?: true} or !${tekiyoStYmdEditable})"
								type="text" class="form-control form-control-readonly" readonly
								th:value="*{tekiyoStYmd != null ? #temporals.format(tekiyoStYmd, 'yyyy/MM') : ''}">
							<!-- 照会時 -->
							<input th:if="${isView}" type="text"
								class="form-control form-control-readonly" id="tekiyoStYmdView"
								readonly
								th:value="*{tekiyoStYmd != null ? #temporals.format(tekiyoStYmd, 'yyyy/MM') : ''}">
							<div class="invalid-feedback"
								th:if="${#fields.hasErrors('tekiyoStYmd')}"
								th:errors="*{tekiyoStYmd}"></div>
						</div>

						<!-- 適用終了年月 -->
						<div class="col-md-3">
							<label
								th:for="!${isView} and ${editable ?: true} ? 'tekiyoEdYmd' : 'tekiyoEdYmdView'"
								class="form-label fw-medium"> 適用終了年月 </label> <input
								th:if="!${isView} and ${editable ?: true}" type="month"
								class="form-control" id="tekiyoEdYmd" name="tekiyoEdYmd"
								th:value="*{tekiyoEdYmd != null ? #temporals.format(tekiyoEdYmd, 'yyyy-MM') : ''}"
								th:errorclass="is-invalid"
								th:data-initial-value="*{tekiyoEdYmd != null ? #temporals.format(tekiyoEdYmd, 'yyyy-MM') : ''}">
							<input th:if="${isView} or !${editable ?: true}" type="text"
								class="form-control form-control-readonly" id="tekiyoEdYmdView"
								readonly
								th:value="*{tekiyoEdYmd != null ? #temporals.format(tekiyoEdYmd, 'yyyy/MM') : ''}">
							<div class="invalid-feedback"
								th:if="${#fields.hasErrors('tekiyoEdYmd')}"
								th:errors="*{tekiyoEdYmd}"></div>
						</div>

					</div>
				</div>
			</div>

			<!-- ===== 徴収義務者一覧エリア ===== -->
			<div class="card mb-4 shadow-sm">
				<div class="card-header py-3">
					<h5 class="mb-0 d-flex align-items-center">
						<div>
							<i class="bi bi-building me-2"></i>特別徴収義務者一覧 <span
								th:if="!${isView}" class="badge bg-danger ms-2 fs-6">2件以上選択必須</span>
						</div>

						<!-- 宛名検索 -->
						<button th:if="!${isView} and !${isEdit}" type="button"
							class="btn btn-primary ms-auto" data-bs-toggle="modal"
							data-bs-target="#addressSearchModal">
							<i class="bi bi-search me-1"></i>宛名検索
						</button>
					</h5>
				</div>
				<div class="card-body p-0">

					<!-- バリデーションエラー -->
					<div th:if="${#fields.hasErrors('shiteiNoList')}"
						class="alert alert-danger py-2 mx-3 mt-3 mb-3">
						<i class="bi bi-exclamation-triangle-fill me-1"></i> <span
							th:errors="*{shiteiNoList}"></span>
					</div>

					<table
						class="table table-bordered table-hover table-sm align-middle mb-0"
						th:classappend="${isEdit} or ${isView} ? 'table-readonly' : ''"
						style="table-layout: fixed;">
						<thead class="table-light">
							<tr>
								<th style="width: 60px" class="text-center"></th>
								<th style="width: 80px" class="text-center">代表指定</th>

								<th style="width: 120px" class="text-center">指定番号</th>
								<th style="width: calc(( 100% - 260px)/2)" class="text-center">特別徴収義務者名</th>
								<th style="width: calc(( 100% - 260px)/2)" class="text-center">施設名称</th>

							</tr>
						</thead>
						<tbody>
							<tr th:each="facility, stat : *{facilityList}"
								th:classappend="${facility.checked} ? 'table-primary' : ''">
								<td class="text-center">
									<!-- 編集時：checked な施設を hidden で送信 --> <input
									th:if="${isEdit} and ${facility.checked}" type="hidden"
									th:name="'shiteiNoList'" th:value="${facility.shiteiNo}">
									<!-- 登録時：チェックボックス --> <input th:if="!${isView} and !${isEdit}"
									type="checkbox" class="form-check-input facility-check"
									th:name="'shiteiNoList'" th:value="${facility.shiteiNo}"
									th:checked="${facility.checked}"
									th:disabled="${facility.disabled}"> <!-- 編集・照会時：チェック済みアイコン -->
									<i th:if="(${isView} or ${isEdit}) and ${facility.checked}"
									class="bi bi-check-circle-fill text-primary fs-5"></i> <i
									th:if="(${isView} or ${isEdit}) and !${facility.checked}"
									class="bi bi-circle text-muted fs-5"></i>
								</td>
								<td class="text-center">
									<!-- 編集時：daihyoShiteiNo を hidden で送信 --> <input
									th:if="${isEdit} and ${facility.daihyo}" type="hidden"
									name="daihyoShiteiNo" th:value="${facility.shiteiNo}">
									<!-- 登録時：代表指定ラジオボタン --> <input
									th:if="!${isView} and !${isEdit}" type="radio"
									class="form-check-input daihyo-radio" name="daihyoShiteiNo"
									th:value="${facility.shiteiNo}" th:checked="${facility.daihyo}"
									th:disabled="${facility.disabled or !facility.checked}">

									<!-- 編集・照会時：代表指定アイコン --> <i
									th:if="(${isView} or ${isEdit}) and ${facility.daihyo}"
									class="bi bi-check-circle-fill text-success fs-5"></i>
								</td>

								<!-- 指定番号 -->
								<td th:text="${facility.shiteiNo}"></td>

								<td th:text="${facility.choshuGimushaName}"></td>

								<td><span th:text="${facility.shisetsuName}"></span> <span
									th:if="${facility.disabled}"
									class="badge bg-warning text-dark ms-2"
									th:text="'合算指定済(' + ${facility.gassanShiteiNo} + ')'"></span></td>
							</tr>
							<tr th:if="${#lists.isEmpty(GassanForm.facilityList)}">
								<td colspan="5" class="text-center text-muted py-4"><i
									class="bi bi-inbox fs-2 d-block mb-2 text-secondary"></i>対象施設が見つかりませんでした
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>

			<!-- ===== アクションボタン ===== -->
			<div class="d-flex justify-content-center gap-3 py-4 mb-5">
				<a th:href="@{/gassan/list}" class="btn btn-outline-secondary px-4"
					th:if="${isView ?: false}"> <i class="bi bi-arrow-left me-2"></i>一覧に戻る
				</a> <a href="#" class="btn btn-outline-secondary px-4"
					th:unless="${isView ?: false}" data-bs-toggle="modal"
					data-bs-target="#backConfirmModal"> <i
					class="bi bi-arrow-left me-2"></i>一覧に戻る
				</a>

				<!-- 削除ボタン -->
				<th:block th:if="${!isView and isEdit}">
					<button type="button" id="openDeleteModalBtn"
						class="btn btn-danger px-5"
						th:disabled="${GassanForm.gassanShiteiNo == null or #strings.isEmpty(GassanForm.gassanShiteiNo)}">
						<span>削除する</span>
					</button>
				</th:block>

				<th:block th:if="!${isView} and (${editable ?: true} or !${isEdit})">
					<button type="button" id="openConfirmModalBtn"
						class="btn btn-success px-5">
						<i
							th:class="${isEdit} ? 'bi bi-pencil-square me-2' : 'bi bi-save me-2'"></i>
						<span th:text="${isEdit} ? '更新する' : '登録する'"></span>
					</button>
				</th:block>

			</div>
		</form>

		<!-- 確認モーダル -->
		<div th:if="!${isView}"
			th:replace="~{layout/components :: confirmModal('registerModal', ${isEdit} ? '更新確認' : '登録確認', 
			${isEdit} ? '合算申請を更新します。よろしいですか？' : '合算申請を登録します。よろしいですか？', 'gassanForm', 
			'btn-success', ${isEdit} ? '更新する' : '登録する')}">
		</div>

		<div th:unless="${isView ?: false}"
			th:replace="~{layout/components :: linkConfirmModal('backConfirmModal', '確認', '入力内容が破棄されます。よろしいですか？', @{/gassan/list}, '一覧に戻る')}"></div>

		<!-- 宛名検索モーダル -->
		<div th:replace="~{layout/components :: addressSearchModal}"></div>

		<!-- 特別徴収義務者指定モーダル -->
		<div th:replace="~{layout/components :: shiteiGassanSearchModal}"></div>

		<!-- 削除確認モーダル -->
		<div th:if="!${isView} && ${isEdit}"
			th:replace="~{layout/components :: confirmModal('deleteModal', '削除確認', 
			'合算申請を削除します。よろしいですか？', 'deleteForm', 
			'btn-danger', '削除する')}">
		</div>

		<!-- 削除用フォーム -->
		<form id="deleteForm" th:action="@{/gassan/delete}" method="post"
			style="display: none;">
			<input type="hidden" th:name="${_csrf.parameterName}"
				th:value="${_csrf.token}" /> <input type="hidden"
				name="gassanShiteiNo" th:value="${GassanForm.gassanShiteiNo}" />
		</form>

		<!-- すでに登録されている場合の確認用モーダル -->
		<div class="modal fade" id="alreadyRegisteredModal" tabindex="-1"
			aria-hidden="true">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title">確認</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal"
							aria-label="閉じる"></button>
					</div>
					<div class="modal-body">この宛名はすでに合算申請に登録されています。照会画面に遷移しますか？</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary"
							data-bs-dismiss="modal" id="alreadyRegisteredNoBtn">いいえ</button>
						<button type="button" class="btn btn-primary"
							id="alreadyRegisteredYesBtn">はい</button>
					</div>
				</div>
			</div>
		</div>

	</div>

	<th:block layout:fragment="scripts">
		<script th:src="@{/js/shiteiGassanSearch.js}"></script>
		<script th:src="@{/js/tGassanConfig.js}"></script>
	</th:block>
</body>

</html>
