<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">
<head>
<title>蜷育ｮ礼筏蜻頑ュ蝣ｱ邂｡逅・床蟶ｳ</title>
<link rel="stylesheet" th:href="@{/css/gassanDaicho.css}">
</head>
<body>
	<div layout:fragment="content" class="container-fluid px-4 py-3">

		<!-- 繝壹・繧ｸ繝倥ャ繝繝ｼ -->
		<div
			class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
			<h5 class="mb-0 fw-bold text-dark">
				<i class="bi bi-file-earmark-text text-primary me-2"></i>蜷育ｮ礼筏蜻頑ュ蝣ｱ邂｡逅・床蟶ｳ
			</h5>
			<span class="text-muted small"> 讀懃ｴ｢邨先棡: <strong
				th:text="${items.totalElements}">0</strong> 莉ｶ
			</span>
		</div>

		<!-- 繝輔Λ繝・す繝･繝｡繝・そ繝ｼ繧ｸ -->
		<div th:if="${successMessage}"
			class="alert alert-success alert-dismissible fade show py-2 mb-3"
			role="alert">
			<i class="bi bi-check-circle-fill me-2"></i> <span
				th:text="${successMessage}"></span>
			<button type="button" class="btn-close btn-sm"
				data-bs-dismiss="alert"></button>
		</div>

		<div th:if="${errorMessage}"
			class="alert alert-danger alert-dismissible fade show py-2 mb-3"
			role="alert">
			<i class="bi bi-exclamation-triangle-fill me-2"></i> <span
				th:text="${errorMessage}"></span>
			<button type="button" class="btn-close btn-sm"
				data-bs-dismiss="alert"></button>
		</div>

		<!-- 謚ｽ蜃ｺ譚｡莉ｶ・医い繧ｳ繝ｼ繝・ぅ繧ｪ繝ｳ・・-->
		<div class="accordion mb-3 shadow-sm" id="searchAccordion">
			<div class="accordion-item border">
				<h2 class="accordion-header">
					<button class="accordion-button py-2 fw-semibold" type="button"
						data-bs-toggle="collapse" data-bs-target="#searchPanel">
						<i class="bi bi-funnel me-2 text-primary"></i>謚ｽ蜃ｺ譚｡莉ｶ
					</button>
				</h2>
				<div id="searchPanel" class="accordion-collapse collapse show">
					<div class="accordion-body pt-3 pb-2 px-3">
						<form th:action="@{/gassan/list}" th:object="${searchForm}"
							method="get">
							<div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-2 mb-2">
								<div class="col">
									<label class="form-label form-label-sm fw-medium mb-1">蜷育ｮ玲欠螳夂分蜿ｷ</label>
									<input type="text" class="form-control form-control-sm"
										th:field="*{gassanShiteiNo}" placeholder="蜷育ｮ玲欠螳夂分蜿ｷ">
								</div>
								<div class="col">
									<label class="form-label form-label-sm fw-medium mb-1">莉｣陦ｨ謖・ｮ夂分蜿ｷ</label>
									<input type="text" class="form-control form-control-sm"
										th:field="*{shiteiNo}" placeholder="莉｣陦ｨ謖・ｮ夂分蜿ｷ">
								</div>
								<div class="col">
									<div class="d-flex align-items-center gap-2 mb-1" style="white-space: nowrap;">
										<label class="form-label form-label-sm fw-medium mb-0">豌丞錐/蜷咲ｧｰ</label>
										<div class="form-check form-check-inline me-0">
											<input class="form-check-input" type="radio" name="nameMatchType" value="prefix" id="namePrefix" th:checked="${searchForm.nameMatchType == 'prefix'}">
											<label class="form-check-label small" for="namePrefix">蜑肴婿</label>
										</div>
										<div class="form-check form-check-inline me-0">
											<input class="form-check-input" type="radio" name="nameMatchType" value="partial" id="namePartial" th:checked="${searchForm.nameMatchType == null or searchForm.nameMatchType == 'partial'}">
											<label class="form-check-label small" for="namePartial">驛ｨ蛻・/label>
										</div>
										<div class="form-check form-check-inline me-0">
											<input class="form-check-input" type="radio" name="nameMatchType" value="exact" id="nameExact" th:checked="${searchForm.nameMatchType == 'exact'}">
											<label class="form-check-label small" for="nameExact">螳悟・</label>
										</div>
									</div>
									<input type="text" class="form-control form-control-sm"
										th:field="*{name}" placeholder="豌丞錐縺ｾ縺溘・蜷咲ｧｰ">
								</div>
							</div>
							<div class="d-flex justify-content-end gap-2 pt-1 border-top">
								<a th:href="@{/gassan/list}"
									class="btn btn-outline-secondary btn-sm"> <i
									class="bi bi-arrow-counterclockwise me-1"></i>繝ｪ繧ｻ繝・ヨ
								</a>
								<button type="submit" class="btn btn-primary btn-sm px-4">
									<i class="bi bi-search me-1"></i>讀懃ｴ｢縺吶ｋ
								</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>

		<!-- 繝・・繝ｫ繝舌・・医・繧ｿ繝ｳ繧ｨ繝ｪ繧｢・・-->
		<div class="card shadow-sm mb-3">
			<div class="card-body py-2 px-3">
				<div class="d-flex flex-wrap align-items-center gap-1"
					style="row-gap: 0.4rem;">
					<div class="d-flex flex-wrap gap-1">
						<button type="button" id="btnView"
							class="btn btn-outline-primary btn-sm">
							<i class="bi bi-eye me-1"></i>辣ｧ莨・
						</button>
					</div>
				</div>
			</div>
		</div>

		<!-- 陦ｨ遉ｺ莉ｶ謨ｰ驕ｸ謚槭・繝ｫ繝繧ｦ繝ｳ -->
		<div class="d-flex justify-content-end align-items-center mb-1">
			<label class="form-label form-label-sm mb-0 me-2">陦ｨ遉ｺ莉ｶ謨ｰ</label>
			<select class="form-select form-select-sm" style="width: auto;" onchange="location.href=this.value">
				<option th:each="s : ${#arrays.toArray({5, 10, 20})}"
					th:value="@{/gassan/list(page=0, pageSize=${s}, gassanShiteiNo=${searchForm.gassanShiteiNo}, shiteiNo=${searchForm.shiteiNo}, name=${searchForm.name})}"
					th:text="${s}" th:selected="${s == searchForm.pageSize}">
				</option>
			</select>
		</div>

		<!-- 荳隕ｧ繝・・繝悶Ν -->
		<div class="card shadow-sm">
			<div class="card-body p-0">
				<div class="table-scroll">
					<table
						class="table table-bordered table-hover table-sm align-middle mb-0 sticky-table">
						<thead class="table-primary">
							<tr>
								<th style="width: 40px" class="text-center"></th>
								<th style="min-width: 120px">蜷育ｮ玲欠螳夂分蜿ｷ</th>
								<th style="min-width: 140px">莉｣陦ｨ譁ｽ險ｭ</th>
								<th style="min-width: 100px">謖・ｮ夂分蜿ｷ</th>
								<th style="min-width: 140px">豌丞錐/蜷咲ｧｰ</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="item : ${items.content}">
								<td class="text-center"><input type="checkbox"
									class="form-check-input row-select"
									th:data-gassan-shitei-no="${item.gassanShiteiNo}"></td>
								<td class="fw-bold text-primary" th:text="${item.gassanShiteiNo}"></td>
								<td th:text="${item.daihyoShisetsuName}"></td>
								<td th:text="${item.shiteiNo}"></td>
								<td th:text="${item.name}"></td>
							</tr>
							<tr th:if="${items.totalElements == 0}">
								<td colspan="5" class="text-center text-muted py-5"><i
									class="bi bi-inbox fs-2 d-block mb-2 text-secondary"></i>
									隧ｲ蠖薙☆繧九ョ繝ｼ繧ｿ縺瑚ｦ九▽縺九ｊ縺ｾ縺帙ｓ縺ｧ縺励◆縲・/td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
			<div class="card-footer bg-white py-2 border-top">
				<!-- 繝壹・繧ｸ驕ｸ謚・-->
				<nav>
					<ul class="pagination pagination-sm justify-content-center mb-0">
						<li class="page-item" th:classappend="${items.first} ? 'disabled'">
							<a class="page-link"
								th:href="@{/gassan/list(page=${items.number - 1}, 
								pageSize=${searchForm.pageSize}, 
								gassanShiteiNo=${searchForm.gassanShiteiNo}, 
								shiteiNo=${searchForm.shiteiNo}, 
								name=${searchForm.name})}">
								蜑阪∈
							</a>
						</li>
						<li class="page-item active" th:if="${items.totalPages == 0}">
							<a class="page-link" href="#">1</a>
						</li>
						<li class="page-item" th:if="${items.totalPages > 0}" th:each="i : ${#numbers.sequence(0, items.totalPages - 1)}"
							th:classappend="${i == items.number} ? 'active'">
							<a class="page-link"
								th:href="@{/gassan/list(page=${i}, 
								pageSize=${searchForm.pageSize}, 
								gassanShiteiNo=${searchForm.gassanShiteiNo}, 
								shiteiNo=${searchForm.shiteiNo}, 
								name=${searchForm.name})}"
								th:text="${i + 1}">
								1
							</a>
						</li>
						<li class="page-item" th:classappend="${items.last} ? 'disabled'">
							<a class="page-link"
								th:href="@{/gassan/list(page=${items.number + 1}, 
								pageSize=${searchForm.pageSize}, 
								gassanShiteiNo=${searchForm.gassanShiteiNo}, 
								shiteiNo=${searchForm.shiteiNo}, 
								name=${searchForm.name})}">
								谺｡縺ｸ
							</a>
						</li>
					</ul>
				</nav>
			</div>
		</div>
	</div>

	<th:block layout:fragment="scripts">
		<script th:src="@{/js/tGassanDaicho.js}"></script>
	</th:block>
</body>
</html>
