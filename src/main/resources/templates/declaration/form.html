<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}"
      lang="ja">
<head>
    <title>螳ｿ豕顔ｨ取ュ蝣ｱ逋ｻ骭ｲ/邱ｨ髮・/title>
</head>

<body>
<div layout:fragment="content">

    <!-- 繝壹・繧ｸ繝倥ャ繝繝ｼ -->
    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <h4 class="fw-bold mb-1">
                <i class="bi bi-pencil-square me-2 text-primary"></i>螳ｿ豕顔ｨ取ュ蝣ｱ逋ｻ骭ｲ/邱ｨ髮・
            </h4>
            <p class="text-muted small mb-0">螳ｿ豕顔ｨ弱・逕ｳ蜻頑ュ蝣ｱ繧貞・蜉帙＠縺ｦ縺上□縺輔＞縲・span class="text-danger">窶ｻ</span> 縺ｯ蠢・磯・岼縺ｧ縺吶・/p>
        </div>
        <span class="badge bg-primary-subtle text-primary border border-primary-subtle px-3 py-2 fs-6" id="modeLabel">
            <i class="bi bi-plus-circle me-1"></i>譁ｰ隕冗匳骭ｲ
        </span>
    </div>

    <!-- 繧｢繝ｩ繝ｼ繝医お繝ｪ繧｢ -->
    <div id="alertArea"></div>

    <form id="declarationForm" novalidate>

        <!-- 蝓ｺ譛ｬ諠・ｱ -->
        <div class="card mb-4 shadow-sm">
            <div class="card-header d-flex align-items-center gap-2 bg-primary text-white py-3">
                <i class="bi bi-info-circle-fill"></i>
                <span class="fw-semibold">蝓ｺ譛ｬ諠・ｱ</span>
            </div>
            <div class="card-body bg-light-subtle">
                <div class="row g-3">

                    <div class="col-md-4">
                        <label for="collectorId" class="form-label required-label fw-medium">迚ｹ蛻･蠕ｴ蜿守ｾｩ蜍呵・D</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-person-badge text-secondary"></i></span>
                            <input type="text" class="form-control" id="collectorId" name="collectorId"
                                   maxlength="20" placeholder="萓具ｼ咾0001" required>
                        </div>
                        <div class="invalid-feedback"></div>
                    </div>

                    <div class="col-md-4">
                        <label for="facilityId" class="form-label required-label fw-medium">螳ｿ豕頑命險ｭID</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-building text-secondary"></i></span>
                            <input type="text" class="form-control" id="facilityId" name="facilityId"
                                   maxlength="20" placeholder="萓具ｼ哥0001" required>
                        </div>
                        <div class="invalid-feedback"></div>
                    </div>

                    <div class="col-md-4">
                        <label for="paymentYearMonth" class="form-label required-label fw-medium">邏榊・蟷ｴ譛・/label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-calendar3 text-secondary"></i></span>
                            <input type="text" class="form-control" id="paymentYearMonth" name="paymentYearMonth"
                                   maxlength="6" placeholder="萓具ｼ・02504" required pattern="\d{6}">
                            <span class="input-group-text bg-white text-muted small">YYYYMM</span>
                        </div>
                        <div class="invalid-feedback"></div>
                    </div>

                    <div class="col-md-4">
                        <label for="totalNights" class="form-label required-label fw-medium">邱丞ｮｿ豕頑焚</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-moon-stars text-secondary"></i></span>
                            <input type="number" class="form-control" id="totalNights" name="totalNights"
                                   min="0" required>
                            <span class="input-group-text bg-white">豕・/span>
                        </div>
                        <div class="invalid-feedback"></div>
                    </div>

                    <div class="col-md-4">
                        <label for="exemptNights" class="form-label required-label fw-medium">隱ｲ遞主ｯｾ雎｡螟門ｮｿ豕頑焚</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-slash-circle text-secondary"></i></span>
                            <input type="number" class="form-control" id="exemptNights" name="exemptNights"
                                   min="0" required>
                            <span class="input-group-text bg-white">豕・/span>
                        </div>
                        <div class="invalid-feedback"></div>
                    </div>

                </div>
            </div>
        </div>

        <!-- 遞主玄蛻・・邏ｰ -->
        <div class="card mb-4 shadow-sm">
            <div class="card-header d-flex align-items-center gap-2 bg-primary text-white py-3">
                <i class="bi bi-table"></i>
                <span class="fw-semibold">遞主玄蛻・挨螳ｿ豕頑焚</span>
            </div>
            <div class="card-body p-0">
                <table class="table table-bordered table-hover align-middle mb-0" id="detailTable">
                    <thead class="table-primary text-center">
                        <tr>
                            <th class="py-3" style="width:35%">遞主玄蛻・/th>
                            <th class="py-3" style="width:20%">險ｭ螳夂ｨ朱｡搾ｼ亥・/豕奇ｼ・/th>
                            <th class="py-3" style="width:25%">隱ｲ遞主ｯｾ雎｡螳ｿ豕頑焚・域ｳ奇ｼ・/th>
                            <th class="py-3" style="width:20%">蟆剰ｨ茨ｼ亥・・・/th>
                        </tr>
                    </thead>
                    <tbody id="detailTableBody">
                        <!-- JavaScript縺ｧ蜍慕噪逕滓・ -->
                    </tbody>
                    <tfoot class="table-light">
                        <tr>
                            <td colspan="3" class="text-end pe-4 fw-bold py-3">
                                <i class="bi bi-calculator me-1 text-primary"></i>邏榊・蜷郁ｨ磯≡鬘・
                            </td>
                            <td class="text-end pe-4 py-3" id="totalPaymentAmount">0 蜀・/td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>

        <!-- 繝懊ち繝ｳ -->
        <div class="d-flex justify-content-end gap-2 pb-3">
            <button type="button" class="btn btn-outline-secondary px-4" id="clearBtn">
                <i class="bi bi-arrow-counterclockwise me-1"></i>繧ｯ繝ｪ繧｢
            </button>
            <button type="submit" class="btn btn-primary px-4" id="submitBtn">
                <i class="bi bi-save me-1"></i>逋ｻ骭ｲ
            </button>
        </div>

    </form>

    <!-- 遒ｺ隱阪Δ繝ｼ繝繝ｫ -->
    <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title"><i class="bi bi-check2-square me-2"></i>逋ｻ骭ｲ遒ｺ隱・/h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted small mb-3">莉･荳九・蜀・ｮｹ縺ｧ逋ｻ骭ｲ縺励∪縺吶ゅｈ繧阪＠縺・〒縺吶°・・/p>
                    <dl class="row small bg-light rounded p-3 mb-0" id="confirmContent"></dl>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                        <i class="bi bi-x-lg me-1"></i>繧ｭ繝｣繝ｳ繧ｻ繝ｫ
                    </button>
                    <button type="button" class="btn btn-primary" id="confirmSubmitBtn">
                        <i class="bi bi-check-lg me-1"></i>遒ｺ螳・
                    </button>
                </div>
            </div>
        </div>
    </div>

</div>

<th:block layout:fragment="scripts">
    <script th:src="@{/js/tDeclarationForm.js}"></script>
</th:block>
</body>
</html>
