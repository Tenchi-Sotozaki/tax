<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>入力内容に誤りがあります - 宿泊税LGWAN-ASPシステム</title>
	<link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
	<link rel="stylesheet" th:href="@{/css/bootstrap-icons-complete.css}">
</head>

<body class="bg-light d-flex align-items-center justify-content-center vh-100">
	<div class="text-center">
		<i class="bi bi-exclamation-circle text-warning" style="font-size: 4rem;"></i>
		<h2 class="mt-3">入力内容に誤りがあります</h2>
		<p class="text-muted mt-2">入力内容をご確認のうえ、前の画面からやり直してください。</p>
		<div class="mt-3">
			<button type="button" class="btn btn-primary" onclick="history.back()">
				<i class="bi bi-arrow-left me-1"></i>前の画面に戻る
			</button>
			<a th:href="@{/tokugimu/list}" class="btn btn-outline-secondary ms-2">
				<i class="bi bi-house me-1"></i>トップへ戻る
			</a>
		</div>
	</div>
</body>

</html>
