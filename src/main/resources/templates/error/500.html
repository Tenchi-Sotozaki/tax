<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>システムエラー - 宿泊税LGWAN-ASPシステム</title>
	<link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
	<link rel="stylesheet" th:href="@{/css/bootstrap-icons-complete.css}">
</head>

<body class="bg-light d-flex align-items-center justify-content-center vh-100">
	<div class="text-center">
		<i class="bi bi-exclamation-triangle text-danger" style="font-size: 4rem;"></i>
		<h2 class="mt-3">システムエラーが発生しました</h2>
		<p class="text-muted mt-2">予期しないエラーが発生しました。<br>管理者にお問い合わせください。</p>
		
		<button type="button" class="btn btn-outline-secondary mt-3" onclick="goBack();">
			<i class="bi bi-arrow-left me-1"></i>前の画面へ戻る
		</button>
	</div>

	<!-- 遷移元に戻る処理 -->
	<script>
		function goBack() {
			// 履歴やリファラーがある場合は前の画面に戻り、なければトップへ遷移する
			if (document.referrer && document.referrer !== window.location.href) {
				history.back();
			} else {
				window.location.href = '/accommodation-tax/top';
			}
		}
	</script>
</body>

</html>
