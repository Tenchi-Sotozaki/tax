<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}" lang="ja">
<head>
<title>アクセス権限エラー</title>
</head>
<body>
	<div layout:fragment="content" class="container-fluid p-4">
		<div class="d-flex justify-content-center align-items-center" style="min-height: 60vh;">
			<div class="text-center">
				<i class="bi bi-shield-x text-danger" style="font-size: 4rem;"></i>
				<h2 class="mt-3">アクセス権限がありません</h2>
				<p class="text-muted mt-2">この画面を表示する権限がありません。<br>管理者にお問い合わせください。</p>
				<a th:href="@{/tokugimu/list}" class="btn btn-primary mt-3">
					<i class="bi bi-house me-1"></i>トップへ戻る
				</a>
			</div>
		</div>
	</div>
</body>
</html>
