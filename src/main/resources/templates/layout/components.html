<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<body>

	<!--
  確認モーダル フラグメント
  引数:
    modalId  - モーダルのHTML id属性値
    title    - モーダルのタイトル
    message  - モーダルの本文メッセージ
    formId   - 送信対象フォームのHTML id属性値
    btnClass - 実行ボタンのBootstrapクラス（例: btn-primary, btn-danger）
    btnLabel - 実行ボタンのラベル（例: 登録する, 削除する）

  使用例（登録確認）:
    <div th:replace="~{layout/components :: confirmModal('myModal','登録確認','登録します。よろしいですか？','myForm','btn-primary','登録する')}"></div>

  使用例（削除確認）:
    <div th:replace="~{layout/components :: confirmModal('deleteModal','削除確認','削除します。よろしいですか？','deleteForm-1','btn-danger','削除する')}"></div>
-->
	<div
		th:fragment="confirmModal(modalId, title, message, formId, btnClass, btnLabel)"
		class="modal fade" th:id="${modalId}" tabindex="-1"
		data-bs-backdrop="static" data-bs-keyboard="false"
		th:aria-labelledby="${modalId + 'Label'}" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content shadow">
				<div class="modal-header"
					th:classappend="${btnClass == 'btn-danger'} ? 'bg-danger text-white' : 'bg-primary text-white'">
					<h5 class="modal-title" th:id="${modalId + 'Label'}">
						<i
							th:class="${btnClass == 'btn-danger'} ? 'bi bi-exclamation-triangle me-2' : 'bi bi-check2-square me-2'"></i>
						<span th:text="${title}">確認</span>
					</h5>
					<button type="button" class="btn-close btn-close-white"
						data-bs-dismiss="modal" aria-label="閉じる"></button>
				</div>
				<div class="modal-body">
					<p class="mb-0" th:text="${message}">よろしいですか？</p>
				</div>
				<div class="modal-footer justify-content-center">
					<button type="button" class="btn btn-outline-secondary"
						data-bs-dismiss="modal">
						<i class="bi bi-x-lg me-1"></i>キャンセル
					</button>
					<button type="button" class="btn" th:classappend="${btnClass}"
						th:data-form-id="${formId}"
						onclick="
							const formId = this.dataset.formId;
							const form = document.getElementById(formId);
							if (form) {
								form.requestSubmit();
							} else {
								console.error('フォームが見つかりません:', formId);
							}
						">
						<i
							th:class="${btnClass == 'btn-danger'} ? 'bi bi-trash me-1' : 'bi bi-check-lg me-1'"></i>
						<span th:text="${btnLabel}">実行</span>
					</button>
				</div>
			</div>
		</div>
	</div>


	<!--
  宛名検索モーダル フラグメント
  使用例:
    <div th:replace="~{layout/components :: addressSearchModal}"></div>
-->
	<div th:fragment="addressSearchModal" id="addressSearchModal"
		class="modal fade" tabindex="-1" data-bs-backdrop="static"
		data-bs-keyboard="false" aria-labelledby="addressSearchModalLabel"
		aria-hidden="true">
		<div
			class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable" style="max-width: 940px;">
			<div class="modal-content shadow">
				<div class="modal-header bg-primary text-white">
					<h5 class="modal-title" id="addressSearchModalLabel">
						<i class="bi bi-search me-2"></i>宛名検索
					</h5>
					<button type="button" class="btn-close btn-close-white"
						data-bs-dismiss="modal" aria-label="閉じる"></button>
				</div>
				<div class="modal-body">
					<!-- 検索条件 -->
					<div class="row g-2 mb-3">
						<div class="col-md-4">
							<label class="form-label form-label-sm fw-medium mb-1">宛名番号</label>
							<input type="text" id="addrSearchNo" class="form-control form-control-sm" placeholder="宛名番号">
						</div>
						<div class="col-md-4">
							<div class="d-flex align-items-center mb-1">
								<label class="form-label form-label-sm fw-medium me-1 mb-0">氏名/名称</label>
								<div class="form-check form-check-inline mb-0 me-2">
									<input class="form-check-input" type="radio" name="addrSearchNameMatchType" id="addrNamePrefix" value="prefix">
									<label class="form-check-label small" for="addrNamePrefix">前方</label>
								</div>
								<div class="form-check form-check-inline mb-0 me-2">
									<input class="form-check-input" type="radio" name="addrSearchNameMatchType" id="addrNamePartial" value="partial" checked>
									<label class="form-check-label small" for="addrNamePartial">部分</label>
								</div>
								<div class="form-check form-check-inline mb-0 me-2">
									<input class="form-check-input" type="radio" name="addrSearchNameMatchType" id="addrNameExact" value="exact">
									<label class="form-check-label small" for="addrNameExact">完全</label>
								</div>
							</div>
							<input type="text" id="addrSearchName" class="form-control form-control-sm" placeholder="氏名/名称">
						</div>
						<div class="col-md-4">
							<div class="d-flex align-items-center mb-1">
								<label class="form-label form-label-sm fw-medium me-1 mb-0">住所</label>
								<div class="form-check form-check-inline mb-0 me-2">
									<input class="form-check-input" type="radio" name="addrSearchAddressMatchType" id="addrAddressPrefix" value="prefix">
									<label class="form-check-label small" for="addrAddressPrefix">前方</label>
								</div>
								<div class="form-check form-check-inline mb-0 me-2">
									<input class="form-check-input" type="radio" name="addrSearchAddressMatchType" id="addrAddressPartial" value="partial" checked>
									<label class="form-check-label small" for="addrAddressPartial">部分</label>
								</div>
								<div class="form-check form-check-inline mb-0 me-2">
									<input class="form-check-input" type="radio" name="addrSearchAddressMatchType" id="addrAddressExact" value="exact">
									<label class="form-check-label small" for="addrAddressExact">完全</label>
								</div>
							</div>
							<input type="text" id="addrSearchAddress" class="form-control form-control-sm" placeholder="住所">
						</div>
						<div class="col-md-4">
							<label class="form-label form-label-sm fw-medium mb-1">電話番号</label>
							<input type="tel" id="addrSearchPhone" class="form-control form-control-sm" placeholder="電話番号">
						</div>
						<div class="col-md-4">
							<label class="form-label form-label-sm fw-medium mb-1">個人番号</label>
							<input type="text" id="addrSearchKojinNo" class="form-control form-control-sm" placeholder="個人番号">
						</div>
						<div class="col-md-4">
							<label class="form-label form-label-sm fw-medium mb-1">法人番号</label>
							<input type="text" id="addrSearchHojinNo" class="form-control form-control-sm" placeholder="法人番号">
						</div>
					</div>
					<div class="d-flex justify-content-end mb-3">
						<button type="button" id="addrSearchBtn"
							class="btn btn-primary btn-sm px-4">
							<i class="bi bi-search me-1"></i>検索
						</button>
					</div>
					<!-- 検索結果 -->
					<div id="addrSearchResult">
						<p class="text-muted text-center small">検索条件を入力して検索してください。</p>
					</div>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-outline-secondary btn-sm px-4"
						data-bs-dismiss="modal">
						<i class="bi bi-x-lg me-1"></i>閉じる
					</button>
				</div>
			</div>
		</div>
	</div>

	<!--
  特別徴収義務者情報表示 フラグメント（セッションから取得）
  使用例:
    <div th:replace="~{layout/components :: selectedTokugimuInfo}"></div>
-->
	<div th:fragment="selectedTokugimuInfo"
		class="mt-2 mb-2 ps-3 d-flex align-items-center">
		<span class="fw-semibold flex-shrink-0">指定番号：</span>
		<span class="tokugimu-info-value me-4"
			style="display:inline-block; width:5em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; vertical-align:middle;"
			data-bs-toggle="tooltip" data-bs-placement="bottom"
			th:attr="title=${selectedShiteiGassan?.gassanShiteiNo != null ? selectedShiteiGassan.gassanShiteiNo : selectedShiteiGassan?.shiteiNo}"
			th:text="${selectedShiteiGassan?.gassanShiteiNo != null ? selectedShiteiGassan.gassanShiteiNo : selectedShiteiGassan?.shiteiNo}"></span>
		<span class="fw-semibold flex-shrink-0">氏名：</span>
		<span class="tokugimu-info-value me-4"
			style="display:inline-block; width:12em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; vertical-align:middle;"
			data-bs-toggle="tooltip" data-bs-placement="bottom"
			th:attr="title=${selectedShiteiGassan?.name}"
			th:text="${selectedShiteiGassan?.name}"></span>
		<span class="fw-semibold flex-shrink-0">施設名称：</span>
		<span class="tokugimu-info-value me-2"
			style="display:inline-block; width:20em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; vertical-align:middle;"
			data-bs-toggle="tooltip" data-bs-placement="bottom"
			th:attr="title=${selectedShiteiGassan?.shisetsuName}"
			th:text="${selectedShiteiGassan?.shisetsuName}"></span>
		<button type="button" class="btn btn-outline-primary btn-sm flex-shrink-0"
			data-bs-toggle="modal" data-bs-target="#shiteiGassanSearchModal">
			<i class="bi bi-search me-1"></i>特別徴収義務者指定
		</button>
	</div>

	<!--
  帳票発行エラー表示 フラグメント
  帳票の作成に失敗した場合にJavaScriptからメッセージを差し込む領域
  使用例:
    <div th:replace="~{layout/components :: reportErrorAlert}"></div>
-->
	<div th:fragment="reportErrorAlert" id="reportError"
		class="alert alert-danger d-none" role="alert">
		<i class="bi bi-exclamation-triangle-fill me-2"></i><span
			id="reportErrorText"></span>
	</div>

	<!--
  特別徴収義務者指定モーダル フラグメント
  使用例:
    <div th:replace="~{layout/components :: shiteiGassanSearchModal}"></div>
-->
	<div th:fragment="shiteiGassanSearchModal" id="shiteiGassanSearchModal"
		class="modal fade" tabindex="-1" data-bs-backdrop="static"
		data-bs-keyboard="false"
		aria-labelledby="shiteiGassanSearchModalLabel" aria-hidden="true">
		<div
			class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
			<div class="modal-content shadow">
				<div class="modal-header bg-primary text-white">
					<h5 class="modal-title" id="shiteiGassanSearchModalLabel">
						<i class="bi bi-search me-2"></i>特別徴収義務者指定
					</h5>
					<button type="button" class="btn-close btn-outline-primary"
						data-bs-dismiss="modal" aria-label="閉じる"></button>
				</div>
				<div class="modal-body">
					<!-- 検索条件 -->
					<div class="row g-2 mb-3">
						<!-- 1行目 -->
						<div class="col-md-6">
							<label class="form-label form-label-sm fw-medium mb-1">指定番号</label>
							<input type="text" id="sgSearchShiteiNo"
								class="form-control form-control-sm" placeholder="指定番号">
						</div>
						<div class="col-md-6">
							<label class="form-label form-label-sm fw-medium mb-1">合算指定番号</label>
							<input type="text" id="sgSearchGassanShiteiNo"
								class="form-control form-control-sm" placeholder="合算指定番号">
						</div>
						<!-- 2行目 -->
						<div class="col-md-6">
							<div class="d-flex align-items-center mb-1">
								<label class="form-label form-label-sm fw-medium me-3 mb-0">氏名/名称</label>
								<div class="form-check form-check-inline mb-0">
									<input class="form-check-input" type="radio"
										name="sgSearchNameMatchType" id="sgNamePrefix" value="prefix">
									<label class="form-check-label small" for="sgNamePrefix">前方</label>
								</div>
								<div class="form-check form-check-inline mb-0">
									<input class="form-check-input" type="radio"
										name="sgSearchNameMatchType" id="sgNamePartial"
										value="partial" checked> <label
										class="form-check-label small" for="sgNamePartial">部分</label>
								</div>
								<div class="form-check form-check-inline mb-0">
									<input class="form-check-input" type="radio"
										name="sgSearchNameMatchType" id="sgNameExact" value="exact">
									<label class="form-check-label small" for="sgNameExact">完全</label>
								</div>
							</div>
							<input type="text" id="sgSearchName"
								class="form-control form-control-sm" placeholder="氏名/名称">
						</div>
						<div class="col-md-6">
							<div class="d-flex align-items-center mb-1">
								<label class="form-label form-label-sm fw-medium me-3 mb-0">施設名称</label>
								<div class="form-check form-check-inline mb-0">
									<input class="form-check-input" type="radio"
										name="sgSearchShisetsuNameMatchType" id="sgShisetsuPrefix"
										value="prefix"> <label class="form-check-label small"
										for="sgShisetsuPrefix">前方</label>
								</div>
								<div class="form-check form-check-inline mb-0">
									<input class="form-check-input" type="radio"
										name="sgSearchShisetsuNameMatchType" id="sgShisetsuPartial"
										value="partial" checked> <label
										class="form-check-label small" for="sgShisetsuPartial">部分</label>
								</div>
								<div class="form-check form-check-inline mb-0">
									<input class="form-check-input" type="radio"
										name="sgSearchShisetsuNameMatchType" id="sgShisetsuExact"
										value="exact"> <label class="form-check-label small"
										for="sgShisetsuExact">完全</label>
								</div>
							</div>
							<input type="text" id="sgSearchShisetsuName"
								class="form-control form-control-sm" placeholder="施設名称">
						</div>
						<!-- 3行目 -->
						<div class="col-md-6">
							<label class="form-label form-label-sm fw-medium mb-1">個人番号</label>
							<input type="text" id="sgSearchKojinNo"
								class="form-control form-control-sm" placeholder="個人番号">
						</div>
						<div class="col-md-6">
							<label class="form-label form-label-sm fw-medium mb-1">法人番号</label>
							<input type="text" id="sgSearchHojinNo"
								class="form-control form-control-sm" placeholder="法人番号">
						</div>
					</div>
					<div class="d-flex justify-content-end mb-3">
						<button type="button" id="sgSearchBtn"
							class="btn btn-primary btn-sm px-4">
							<i class="bi bi-search me-1"></i>検索する
						</button>
					</div>
					<!-- 検索結果 -->
					<div id="sgSearchResult">
						<p class="text-muted text-center small">検索条件を入力して検索してください。</p>
					</div>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-outline-primary"
						data-bs-dismiss="modal">
						<i class="bi bi-x-lg me-1"></i>閉じる
					</button>
				</div>
			</div>
		</div>
	</div>

</body>
</html>
