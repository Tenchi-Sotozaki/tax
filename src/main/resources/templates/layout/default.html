<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title layout:title-pattern="$CONTENT_TITLE - 宿泊税申告システム">宿泊税申告システム</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/bootstrap-icons-complete.css}">
    <link rel="stylesheet" th:href="@{/css/accommodation-tax.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid px-4">
        <span class="navbar-brand fw-bold fs-5">
            <i class="bi bi-building me-2"></i>宿泊税申告システム
        </span>
        <div class="ms-auto d-flex align-items-center gap-3">
            <span class="text-white-50 small">
                <i class="bi bi-person-circle me-1"></i>
                <span th:text="${#authentication?.name}">ユーザー</span>
            </span>
            <form th:action="@{/logout}" method="post" class="mb-0">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-outline-light">
                    <i class="bi bi-box-arrow-right me-1"></i>ログアウト
                </button>
            </form>
        </div>
    </div>
</nav>

<main class="container-fluid py-4 px-4">
    <div layout:fragment="content"></div>
</main>

<footer class="footer mt-auto py-2 bg-light border-top">
    <div class="container-fluid text-center text-muted small">
        宿泊税LGWAN-ASPシステム
    </div>
</footer>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
