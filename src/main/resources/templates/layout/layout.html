<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- CSRFトークン（CSRF保護が有効な場合のみ） -->
<meta name="_csrf" th:if="${_csrf}" th:content="${_csrf.token}" />
<meta name="_csrf_header" th:if="${_csrf}"
	th:content="${_csrf.headerName}" />
<title layout:title-pattern="$CONTENT_TITLE - 宿泊税LGWAN-ASPシステム">宿泊税LGWAN-ASPシステム</title>
<link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
<link rel="stylesheet" th:href="@{/css/bootstrap-icons-complete.css}">
<link rel="stylesheet" th:href="@{/css/accommodation.css}">
<link rel="stylesheet" th:href="@{/css/accommodation-custom.css}">
</head>
<body class="vh-100 overflow-hidden">

	<div class="d-flex h-100">

		<!-- ========== サイドバー ========== -->
		<nav id="sidebar"
			class="d-flex flex-column flex-shrink-0 bg-dark"
			style="width: 260px; overflow-y: auto;">
			<!-- システム名 -->
			<div class="px-3 py-3 border-bottom border-secondary">
				<h5 class="mb-0 fw-bold text-white system-logo">
					<a th:href="@{/top}">
						<img th:src="@{/images/logo-acomo.svg?v=2}" alt="AcOmO"
							class="acomo-logo">
					</a>
				</h5>
			</div>

			<div class="px-2 py-2 flex-grow-1">

				<!-- ===== 動的サイドメニュー ===== -->
				<th:block th:each="lv1 : ${sideMenuTree}">
					<!-- level=1: ラベル -->
					<div class="fw-semibold px-2 pt-3 pb-1 text-white-50 border-bottom border-secondary">
						<img th:if="${lv1.iconLink != null}" th:src="@{${lv1.iconLink}}" class="me-2" style="width:1em;height:1em;">
						<th:block th:text="${lv1.name}"></th:block>
					</div>

					<!-- level=2: アコーディオンまたは直接リンク -->
					<th:block th:each="lv2 : ${lv1.children}">

						<!-- level=2 子メニューあり：アコーディオン -->
						<th:block th:if="${not #lists.isEmpty(lv2.children)}">
							<div class="accordion accordion-flush">
								<div class="accordion-item bg-transparent border-0">
									<h2 class="accordion-header">
											<button class="accordion-button bg-transparent text-white-70 collapsed py-2 px-4 rounded"
											type="button" data-bs-toggle="collapse"
											th:data-bs-target="'#menu-' + ${lv2.menuId}">
											<img th:if="${lv2.iconLink != null}" th:src="@{${lv2.iconLink}}" class="me-2" style="width:1em;height:1em;">
											<th:block th:text="${lv2.name}"></th:block>
										</button>
									</h2>
									<div th:id="'menu-' + ${lv2.menuId}" class="accordion-collapse collapse">
										<div class="accordion-body py-1 px-0">
											<ul class="nav flex-column ms-3">
												<!-- level=3: アコーディオンまたは直接リンク -->
												<th:block th:each="lv3 : ${lv2.children}">

													<!-- level=3 子メニューあり：アコーディオン -->
													<th:block th:if="${not #lists.isEmpty(lv3.children)}">
														<li class="nav-item">
															<button class="accordion-button bg-transparent text-white-70 collapsed py-1 px-4 w-100 border-0"
																type="button" data-bs-toggle="collapse"
																th:data-bs-target="'#menu-' + ${lv3.menuId}">
																<img th:if="${lv3.iconLink != null}" th:src="@{${lv3.iconLink}}" class="me-2" style="width:1em;height:1em;">
																<th:block th:text="${lv3.name}"></th:block>
															</button>
															<ul th:id="'menu-' + ${lv3.menuId}" class="nav flex-column ms-3 collapse">
																<!-- level=4: リンク -->
																<th:block th:each="lv4 : ${lv3.children}">
																	<li class="nav-item">
																		<a class="nav-link px-4 py-1 sidebar-link"
																			th:href="@{${lv4.link}}"
																			th:classappend="${#strings.contains(currentUri, lv4.link)} ? 'text-warning' : 'text-white'">
																			<img th:if="${lv4.iconLink != null}" th:src="@{${lv4.iconLink}}" class="me-2" style="width:1em;height:1em;">
																			<th:block th:text="${lv4.name}"></th:block>
																		</a>
																	</li>
																</th:block>
															</ul>
														</li>
													</th:block>

													<!-- level=3 子メニューなし：直接リンク -->
													<th:block th:if="${#lists.isEmpty(lv3.children)}">
														<li class="nav-item">
															<a class="nav-link px-4 py-1 sidebar-link"
																th:href="@{${lv3.link}}"
																th:classappend="${#strings.contains(currentUri, lv3.link)} ? 'text-warning' : 'text-white'">
																<img th:if="${lv3.iconLink != null}" th:src="@{${lv3.iconLink}}" class="me-2" style="width:1em;height:1em;">
																<th:block th:text="${lv3.name}"></th:block>
															</a>
														</li>
													</th:block>

												</th:block>
											</ul>
										</div>
									</div>
								</div>
							</div>
						</th:block>

						<!-- level=2 子メニューなし：直接リンク -->
						<th:block th:if="${#lists.isEmpty(lv2.children)}">
							<ul class="nav flex-column">
								<li class="nav-item">
									<a class="nav-link px-4 py-1 sidebar-link"
										th:href="@{${lv2.link}}"
										th:classappend="${#strings.contains(currentUri, lv2.link)} ? 'text-warning' : 'text-white'">
										<img th:if="${lv2.iconLink != null}" th:src="@{${lv2.iconLink}}" class="me-2" style="width:1em;height:1em;">
										<th:block th:text="${lv2.name}"></th:block>
									</a>
								</li>
							</ul>
						</th:block>

					</th:block>
				</th:block>
			</div>
		</nav>
		<!-- ========== /サイドバー ========== -->

		<!-- 右カラム（ヘッダー＋メイン） -->
		<div class="d-flex flex-column flex-grow-1 overflow-hidden">

			<!-- ========== ヘッダー ========== -->
			<header
				class="bg-white shadow-sm d-flex align-items-center justify-content-between px-4 flex-shrink-0"
				style="height: 56px;">
				<button class="btn btn-outline-secondary d-md-none"
					id="sidebarToggle">
					<i class="bi bi-list"></i>
				</button>
				<span class="text-muted small d-none d-md-inline">宿泊税LGWAN-ASPシステム</span>
				<div class="d-flex align-items-center gap-3">
					<a th:href="@{/admin/user-password-change(from=${currentUri})}" class="text-muted small text-decoration-none">
						<i class="bi bi-person-circle me-1"></i>
						<span th:text="${loginUserName}">ユーザー</span>
					</a>
					<form th:action="@{/logout}" method="post" class="mb-0">
						<!-- CSRFトークン（CSRF保護が有効な場合のみ） -->
						<input type="hidden" th:if="${_csrf}"
							th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
						<button type="submit" class="btn btn-outline-secondary">
							<i class="bi bi-box-arrow-right me-1"></i>ログアウト
						</button>
					</form>
				</div>
			</header>
			<!-- ========== /ヘッダー ========== -->

			<!-- ========== メインコンテンツ ========== -->
			<main class="flex-grow-1 overflow-auto bg-light">
				<div th:if="${flashSuccessMessage}" class="alert alert-success alert-dismissible fade show mx-4 mt-3 mb-0" role="alert">
					<i class="bi bi-check-circle-fill me-2"></i><span th:text="${flashSuccessMessage}"></span>
					<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
				</div>
				<div layout:fragment="content"></div>
			</main>
			<!-- ========== /メインコンテンツ ========== -->

		</div>
	</div>

	<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
	<script th:src="@{/js/common.js}"></script>
	<script th:src="@{/js/layout.js}"></script>
	<script th:src="@{/js/browserBack.js}"></script>
	<th:block th:if="${showShiteiGassanModal}">
		<script>
			document.addEventListener('DOMContentLoaded', function() {
				var modal = new bootstrap.Modal(document.getElementById('shiteiGassanSearchModal'), {backdrop: 'static'});
				modal.show();
			});
		</script>
	</th:block>
	<th:block layout:fragment="scripts"></th:block>
</body>
</html>
