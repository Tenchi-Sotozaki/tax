spring:
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  datasource:
    url: jdbc:postgresql://localhost:5432/accommodation_tax_db
    username: postgres
    password: ${ACOMO_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

server:
  address: localhost
  tomcat:
    accesslog:
      enabled: true
      directory: /var/log/acomo
      prefix: access_log
      suffix: .log
      rotate: true
      file-date-format: .yyyy-MM-dd
      max-days: 30

logging:
  file:
    name: /var/log/acomo/application.log
  logback:
    rollingpolicy:
      max-history: 30
  level:
    jp.lg.asp: INFO
